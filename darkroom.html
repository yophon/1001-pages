<style>
  :root {
    --bg: #0b0b0d;
    --panel: #151518;
    --line: #26262b;
    --text: #ececef;
    --muted: #9a9aa3;
    --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --serif: Fraunces, "Noto Serif SC", Georgia, "Songti SC", serif;
    /* 页脚自己的一套颜色：暖一点的白、安全灯红 */
    --f-bg: #0d0c0c;
    --f-text: #e8e3dc;
    --f-muted: #8d867e;
    --f-faint: #5d5853;
    --f-line: #221f1d;
    --safe: #d2452f;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.7 var(--sans); }

  /* 角落的页码，点了回目录；用反色混合，深浅底上都看得见 */
  .folio {
    position: absolute; top: 12px; right: 16px; z-index: 20;
    font: 500 11px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .14em;
    color: #fff; mix-blend-mode: difference; opacity: .5; text-decoration: none; transition: opacity .2s;
  }
  .folio:hover, .folio:focus-visible { opacity: 1; }

  /* ---------- 页脚 ---------- */
  .foot { background: var(--f-bg); color: var(--f-text); border-top: 1px solid var(--f-line); }
  .foot-top {
    display: grid; grid-template-columns: minmax(260px, 1.5fr) repeat(3, minmax(120px, 1fr)); gap: 40px 48px;
    max-width: 1320px; margin: 0 auto; padding: 64px clamp(16px, 4vw, 48px) 44px;
  }
  .brand .name { font: 600 40px/1 var(--serif); letter-spacing: -0.015em; }
  .brand .tag { margin: 14px 0 22px; color: var(--f-muted); font-size: 14px; max-width: 32ch; text-wrap: pretty; }
  .status { display: inline-flex; align-items: center; gap: 9px; font: 12.5px/1 var(--sans); color: var(--f-muted); padding: 8px 12px 8px 10px; border: 1px solid var(--f-line); border-radius: 999px; font-variant-numeric: tabular-nums; }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--f-faint); flex: none; transition: background .4s, box-shadow .4s; }
  .status[data-on="safe"] i { background: var(--safe); box-shadow: 0 0 10px 1px rgb(210 69 47 / .65); }
  .status[data-on="room"] i { background: #f3eee4; box-shadow: 0 0 10px 1px rgb(243 238 228 / .45); }
  .status[data-on="bad"] i { background: #6b6560; }
  .col h3 { margin: 4px 0 14px; font: 600 12px/1 var(--sans); letter-spacing: .12em; color: var(--f-faint); }
  .col a { display: block; color: var(--f-text); opacity: .84; text-decoration: none; font-size: 14.5px; padding: 3px 0; }
  .col a:hover { opacity: 1; }

  .scene { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .scene canvas { display: block; width: 100%; }
  .scene .over { position: absolute; inset: 0; height: 100%; }
  .scene .fallback { display: none; }

  .foot-legal {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px;
    max-width: 1320px; margin: 0 auto; padding: 18px clamp(16px, 4vw, 48px) 22px;
    font-size: 12.5px; color: var(--f-faint);
  }
  .foot-legal a { color: var(--f-muted); text-decoration: none; }
  .foot-legal a:hover { color: var(--f-text); }
  .foot-legal .ctl { margin-left: auto; display: flex; gap: 8px; }
  .foot-legal button {
    font: 12.5px/1 var(--sans); color: var(--f-muted); cursor: pointer;
    background: transparent; border: 1px solid var(--f-line); border-radius: 999px; padding: 8px 12px;
  }
  .foot-legal button:hover { color: var(--f-text); border-color: #3a3530; }

  @media (max-width: 760px) {
    .foot-top { grid-template-columns: 1fr 1fr; padding-top: 48px; gap: 32px 24px; }
    .brand { grid-column: 1 / -1; }
    .brand .name { font-size: 34px; }
    .foot-legal .ctl { margin-left: 0; width: 100%; }
  }
</style>

<body>

<script>
  const $ = s => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const ease = x => { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2; };
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
  // 品牌名默认 Lumen，网址加 ?name=星河 这样的参数可以换
  const brand = (new URLSearchParams(location.search).get('name') || '').trim().slice(0, 16) || 'Lumen';
  $('#f-name').textContent = brand;
  document.querySelectorAll('.bn').forEach(b => { b.textContent = brand; });

  // 噪声：整数格点哈希 + 平滑插值
  function hash(x, y) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  const fbm = (x, y) => noise(x, y) * 0.5 + noise(x * 2.03 + 17, y * 2.03 + 9) * 0.28 + noise(x * 4.1 + 41, y * 4.1 + 23) * 0.14 + noise(x * 8.3 + 7, y * 8.3 + 61) * 0.08;
  // 固定种子的随机数，叶子每次长得一样
  function seeded(s) { return () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  const scene = $('#scene'), glc = $('#gl'), ovc = $('#over'), octx = ovc.getContext('2d');
  const statusEl = $('#status'), statusText = $('#status-text');
  const SAFE = [1, 0.13, 0.06], ROOM = [1, 0.985, 0.96];

  /* ---------- 布局：两只盘子并排放在水池台上，镜头一次看一只 ---------- */
  let W, H, DPR, WW, mobile, T1, T2, L1, L2, LR, P1, P2, PW, PH, timer, cordX, cordLen, lamp, room;
  function layout() {
    W = scene.clientWidth;
    DPR = Math.min(devicePixelRatio || 1, 2);
    mobile = W < 680;
    const tw = Math.round(mobile ? W * 0.93 : W * 0.8), th = Math.round(tw / (mobile ? 1.62 : 2.05));
    H = Math.round(th + (mobile ? 34 : clamp(W * 0.06, 44, 90)));
    const tx = Math.round(mobile ? (W - tw) / 2 : W * 0.035), ty = Math.round((H - th) / 2);
    T1 = { x: tx, y: ty, w: tw, h: th };
    T2 = { x: tx + W, y: ty, w: tw, h: th };
    WW = W * 2;
    const inset = clamp(tw * 0.03, 12, 26);
    L1 = { x: T1.x + inset, y: T1.y + inset, w: tw - inset * 2, h: th - inset * 2 };
    L2 = { x: T2.x + inset, y: T2.y + inset, w: L1.w, h: L1.h };
    LR = clamp(tw * 0.012, 6, 12);   // 液面圆角
    PW = Math.round(L1.w * 0.88);
    PH = Math.round(Math.min(L1.h * 0.84, PW / 1.9));
    P1 = { x: L1.x + L1.w / 2 - L1.w * 0.01, y: L1.y + L1.h / 2 + L1.h * 0.015 };
    P2 = { x: L2.x + L2.w / 2 + L2.w * 0.008, y: L2.y + L2.h / 2 - L2.h * 0.01 };
    const gap = W - (tx + tw);
    timer = mobile ? null : { x: tx + tw + gap * 0.5, y: ty + th * 0.7, r: Math.min(gap * 0.36, th * 0.17) };
    cordX = mobile ? W - 18 : tx + tw + gap * 0.5;
    cordLen = H * (mobile ? 0.3 : 0.33);
    // 灯的位置倒着算：俯拍时，平静水面上的倒影落在相机和灯的连线上、按两者高度分比例的那一点
    // 让安全灯灯泡的倒影落在显影盘液面左上角，日光灯管的倒影落在定影盘液面上沿，都在相纸外面
    const camZ = H * 3.2, lz = H * 1.5, rz = H * 2.2, spot = (cam, want, z) => (want * (z + camZ) - cam * z) / camZ;
    lamp = [spot(W / 2, L1.x + L1.w * 0.07, lz), spot(H / 2, L1.y + L1.h * 0.06, lz), lz];
    room = [W, spot(H / 2, L2.y + L2.h * 0.05, rz), rz];
    glc.style.height = ovc.style.height = H + 'px';
    glc.width = ovc.width = Math.round(W * DPR);
    glc.height = ovc.height = Math.round(H * DPR);
  }

  /* ---------- 水池台、盘子和小道具：只画固有色，光照在着色器里算 ---------- */
  let benchCv, benchScale;
  function rrect(o, x, y, w, h, r) {
    o.beginPath();
    o.moveTo(x + r, y);
    o.arcTo(x + w, y, x + w, y + h, r);
    o.arcTo(x + w, y + h, x, y + h, r);
    o.arcTo(x, y + h, x, y, r);
    o.arcTo(x, y, x + w, y, r);
    o.closePath();
  }
  function renderBench(maxTex) {
    benchScale = Math.min(DPR, maxTex / WW, maxTex / H);
    benchCv = canvas(WW * benchScale, H * benchScale);
    const o = benchCv.getContext('2d');
    o.scale(benchScale, benchScale);
    // 台面：黑色玻璃钢水池，带一点大块的明暗和水渍
    const w = Math.ceil(WW / 3), h = Math.ceil(H / 3), img = new ImageData(w, h), d = img.data;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const n = fbm(x * 0.02, y * 0.02), streak = Math.max(0, noise(x * 0.006 + 3, y * 0.09) - 0.62) * 0.5;
      const k = 0.17 + n * 0.06 + streak * 0.12, i = (y * w + x) * 4;
      d[i] = 255 * k; d[i + 1] = 255 * k * 0.99; d[i + 2] = 255 * k * 1.03; d[i + 3] = 255;
    }
    const base = canvas(w, h);
    base.getContext('2d').putImageData(img, 0, 0);
    o.imageSmoothingQuality = 'high';
    o.drawImage(base, 0, 0, WW, H);
    for (let i = 0; i < WW * H / 260; i++) {
      o.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,.035)' : 'rgba(0,0,0,.12)';
      o.fillRect(Math.random() * WW, Math.random() * H, 1, 1);
    }
    tray(o, T1, [74, 76, 82], 'DEV · 显影');
    tray(o, T2, [196, 199, 204], 'FIX · 定影');
    // 台面上的水珠
    const rnd = seeded(7);
    for (let i = 0; i < (mobile ? 18 : 46); i++) {
      const x = rnd() * WW, y = rnd() * H;
      if ([T1, T2].some(t => x > t.x - 8 && x < t.x + t.w + 8 && y > t.y - 8 && y < t.y + t.h + 8)) continue;
      const r = 1.2 + rnd() ** 2 * 5;
      o.fillStyle = 'rgba(0,0,0,.28)';
      o.beginPath(); o.ellipse(x + 0.6, y + 0.8, r, r * 0.85, 0, 0, 7); o.fill();
      o.fillStyle = 'rgba(255,255,255,.08)';
      o.beginPath(); o.ellipse(x, y, r, r * 0.85, 0, 0, 7); o.fill();
      o.fillStyle = 'rgba(255,255,255,.55)';
      o.beginPath(); o.arc(x - r * 0.35, y - r * 0.35, Math.max(0.6, r * 0.22), 0, 7); o.fill();
    }
    if (timer) timerBody(o, timer);
    if (!mobile) paperBox(o, T2.x + T2.w + (W - T1.x - T1.w) * 0.5, T2.y + T2.h * 0.7);
  }
  // 盘子：外沿、往里收的斜壁、带加强筋的底，角上一个倒液嘴，边上贴一条手写的美纹纸
  function tray(o, t, c, label) {
    const col = (k, a = 1) => `rgba(${Math.round(c[0] * k)},${Math.round(c[1] * k)},${Math.round(c[2] * k)},${a})`;
    const R = clamp(t.w * 0.03, 12, 24), rim = clamp(t.w * 0.016, 7, 14), inset = clamp(t.w * 0.03, 12, 26);
    o.save();
    o.shadowColor = 'rgba(0,0,0,.6)';
    o.shadowBlur = 22;
    o.shadowOffsetY = 10;
    o.fillStyle = col(0.8);
    rrect(o, t.x, t.y, t.w, t.h, R);
    o.fill();
    o.restore();
    const g = o.createLinearGradient(t.x, t.y, t.x + t.w * 0.3, t.y + t.h);
    g.addColorStop(0, col(1.02));
    g.addColorStop(1, col(0.9));
    o.fillStyle = g;
    rrect(o, t.x, t.y, t.w, t.h, R);
    o.fill();
    o.strokeStyle = col(1.08, 0.9);
    o.lineWidth = 1.2;
    rrect(o, t.x + 1.5, t.y + 1.5, t.w - 3, t.h - 3, R - 1.5);
    o.stroke();
    // 斜壁：从外沿到底，越往里越暗
    const wx = t.x + rim, wy = t.y + rim, ww = t.w - rim * 2, wh = t.h - rim * 2;
    o.fillStyle = col(0.72);
    rrect(o, wx, wy, ww, wh, R * 0.75);
    o.fill();
    const fx = t.x + inset, fy = t.y + inset, fw = t.w - inset * 2, fh = t.h - inset * 2;
    for (let k = 0; k < 6; k++) {
      o.fillStyle = col(0.74 + k * 0.035);
      rrect(o, lerp(wx, fx, k / 6), lerp(wy, fy, k / 6), lerp(ww, fw, k / 6), lerp(wh, fh, k / 6), lerp(R * 0.75, R * 0.45, k / 6));
      o.fill();
    }
    o.fillStyle = col(0.93);
    rrect(o, fx, fy, fw, fh, R * 0.45);
    o.fill();
    // 底上的加强筋：沿长边几道凸起，一边亮一边暗
    o.save();
    rrect(o, fx, fy, fw, fh, R * 0.45);
    o.clip();
    const n = Math.max(4, Math.round(fh / 26));
    for (let k = 1; k < n; k++) {
      const y = fy + fh * k / n;
      o.fillStyle = col(1.02, 0.9);
      o.fillRect(fx, y - 1.6, fw, 1.4);
      o.fillStyle = col(0.8, 0.9);
      o.fillRect(fx, y, fw, 1.4);
    }
    // 底角的暗部
    const ao = o.createRadialGradient(fx + fw / 2, fy + fh / 2, Math.min(fw, fh) * 0.3, fx + fw / 2, fy + fh / 2, Math.hypot(fw, fh) * 0.55);
    ao.addColorStop(0, 'rgba(0,0,0,0)');
    ao.addColorStop(1, 'rgba(0,0,0,.16)');
    o.fillStyle = ao;
    o.fillRect(fx, fy, fw, fh);
    o.restore();
    // 倒液嘴
    o.fillStyle = col(0.6);
    o.beginPath();
    o.arc(t.x + R * 0.55, t.y + R * 0.55, R * 0.42, 0, 7);
    o.fill();
    // 美纹纸标签
    o.save();
    o.translate(t.x + t.w * 0.08, t.y + t.h - rim * 0.55);
    o.rotate(-0.025);
    const lw = clamp(t.w * 0.15, 66, 130), lh = clamp(t.h * 0.075, 15, 24);
    o.fillStyle = 'rgba(232,216,176,.94)';
    o.beginPath();
    o.moveTo(0, -lh / 2);
    for (let x = 0; x <= lw; x += 4) o.lineTo(x, -lh / 2 + (hash(x, 3) - 0.5) * 1.6);
    for (let x = lw; x >= 0; x -= 4) o.lineTo(x, lh / 2 + (hash(x, 9) - 0.5) * 1.6);
    o.closePath();
    o.fill();
    o.fillStyle = 'rgba(30,30,34,.9)';
    o.font = `600 ${lh * 0.82}px Caveat, "Segoe Print", "KaiTi", cursive`;
    o.textBaseline = 'middle';
    o.fillText(label, lh * 0.35, lh * 0.04);
    o.restore();
  }
  // 计时器：黑色胶木外壳、白色刻度，夜光部分在叠加层里画
  function timerBody(o, t) {
    o.save();
    o.shadowColor = 'rgba(0,0,0,.6)';
    o.shadowBlur = 16;
    o.shadowOffsetY = 8;
    o.fillStyle = '#1a1a1c';
    o.beginPath(); o.arc(t.x, t.y, t.r * 1.12, 0, 7); o.fill();
    o.restore();
    const g = o.createRadialGradient(t.x - t.r * 0.3, t.y - t.r * 0.4, 0, t.x, t.y, t.r * 1.12);
    g.addColorStop(0, '#3a3a3e');
    g.addColorStop(1, '#141416');
    o.fillStyle = g;
    o.beginPath(); o.arc(t.x, t.y, t.r * 1.12, 0, 7); o.fill();
    o.fillStyle = '#0b0b0c';
    o.beginPath(); o.arc(t.x, t.y, t.r, 0, 7); o.fill();
    o.strokeStyle = '#d8d6d0';
    for (let k = 0; k < 60; k++) {
      const a = k / 60 * Math.PI * 2 - Math.PI / 2, l = k % 5 ? 0.06 : 0.13;
      o.lineWidth = k % 5 ? 0.7 : 1.4;
      o.beginPath();
      o.moveTo(t.x + Math.cos(a) * t.r * 0.94, t.y + Math.sin(a) * t.r * 0.94);
      o.lineTo(t.x + Math.cos(a) * t.r * (0.94 - l), t.y + Math.sin(a) * t.r * (0.94 - l));
      o.stroke();
    }
    o.fillStyle = '#d8d6d0';
    o.font = `600 ${t.r * 0.16}px "Segoe UI", sans-serif`;
    o.textAlign = 'center';
    o.textBaseline = 'middle';
    for (let k = 0; k < 12; k++) {
      const a = k / 12 * Math.PI * 2 - Math.PI / 2;
      o.fillText(String(k * 5), t.x + Math.cos(a) * t.r * 0.66, t.y + Math.sin(a) * t.r * 0.66);
    }
    o.font = `600 ${t.r * 0.11}px "Segoe UI", sans-serif`;
    o.fillStyle = '#8a8884';
    o.fillText('SECONDS', t.x, t.y + t.r * 0.32);
  }
  // 相纸盒：黑盒子，盖子歪着搭在上面
  function paperBox(o, x, y) {
    const w = (W - T1.x - T1.w) * 0.7, h = w * 1.25;
    o.save();
    o.translate(x, y);
    o.rotate(0.06);
    o.shadowColor = 'rgba(0,0,0,.6)';
    o.shadowBlur = 16;
    o.shadowOffsetY = 8;
    o.fillStyle = '#121214';

    const noiseHit = (f, q, dur, g, t = ac.currentTime) => {
      const n = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate), d = n.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
      const s = ac.createBufferSource(), b = ac.createBiquadFilter(), a = ac.createGain();
      s.buffer = n;
      b.type = 'bandpass';
      b.frequency.value = f;
      b.Q.value = q;
      a.gain.value = g;
      s.connect(b).connect(a).connect(bus);
      s.start(t);
    };
    return {
      toggle() {
        on = !on;
        if (on && !ac) make();
        if (ac) { ac.resume(); hum.gain.setTargetAtTime(on ? 0.004 * st.safe * (1 - st.light) : 0, ac.currentTime, 0.2); if (!on) water.gain.setTargetAtTime(0, ac.currentTime, 0.1); }
        return on;
      },
      water(e) {
        if (!on || !ac) return;
        water.gain.setTargetAtTime(Math.min(0.09, e * 0.012), ac.currentTime, 0.12);
        hum.gain.setTargetAtTime(0.004 * st.safe * (1 - st.light), ac.currentTime, 0.3);
      },
      drip() { if (on && ac) tone(1300 + Math.random() * 700, 420, 0.12, 0.05); },
      splash() { if (on && ac) noiseHit(900, 0.6, 0.45, 0.35); },
      rock() { if (on && ac) noiseHit(380, 0.8, 0.7, 0.12); },
      clack() { if (on && ac) noiseHit(2600, 4, 0.04, 0.25); },
      ding() { if (on && ac) { tone(1568, 1560, 1.2, 0.06); tone(3920, 3900, 0.5, 0.015); } },
      cord(lightOn) {
        if (!on || !ac) return;
        noiseHit(3200, 5, 0.03, 0.4);
        if (lightOn) for (let k = 0; k < 3; k++) tone(120, 118, 0.07, 0.03, 'sawtooth', ac.currentTime + 0.05 + k * 0.09);
      },
      poke() { if (on && ac) tone(900 + Math.random() * 300, 300, 0.09, 0.03); },
    };
  })();

  /* ---------- 交互 ---------- */
  const ptr = { x: -1, y: -1, on: false };
  scene.addEventListener('pointermove', e => {
    const r = scene.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (ptr.on && started) {
      const dx = x - ptr.x, dy = y - ptr.y, sp = Math.hypot(dx, dy), wx = x + st.cam, wy = y;
      for (const [q, L] of [[Q1, L1], [Q2, L2]]) {
        if (wx < L.x || wx > L.x + L.w || wy < L.y || wy > L.y + L.h) continue;
        const n = Math.ceil(sp / 6);
        for (let k = 1; k <= n; k++) poke(q, L, ptr.x + st.cam + dx * k / n, ptr.y + dy * k / n, 6, Math.min(1.8, sp * 0.05));
        if (Math.abs(dx) > 8) slosh(q, -dx * 0.012, 0);
        if (sp > 3) st.hintT = Math.min(1, st.hintT + 0.04);
      }
    }
    ptr.x = x; ptr.y = y; ptr.on = true;
    const h = nearCord(x, y);
    if (h !== st.hover) { st.hover = h; scene.style.cursor = h ? 'pointer' : ''; }
    dirty = true;
  });
  scene.addEventListener('pointerleave', () => { ptr.on = false; st.hover = false; scene.style.cursor = ''; dirty = true; });
  scene.addEventListener('pointerdown', e => {
    const r = scene.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (nearCord(x, y)) { pullCord(false); dirty = true; return; }
    const wx = x + st.cam;
    for (const [q, L] of [[Q1, L1], [Q2, L2]]) if (wx > L.x && wx < L.x + L.w && y > L.y && y < L.y + L.h) { poke(q, L, wx, y, 5, 9); sfx.poke(); st.hintT = 1; }
    dirty = true;
  });
  let fadeTo = null;
  $('#again').addEventListener('click', () => {
    if (REDUCED) { finish(); dirty = true; return; }
    fadeTo = 'out';
  });
  $('#sound').addEventListener('click', e => { e.target.textContent = sfx.toggle() ? '声音：开' : '声音：关'; });

  /* ---------- 2D 退路：没有 WebGL 时画一张冲好的静态图 ---------- */
  function drawFallback() {
    const o = glc.getContext('2d');
    o.setTransform(1, 0, 0, 1, 0, 0);
    o.drawImage(benchCv, (W * benchScale), 0, W * benchScale, H * benchScale, 0, 0, glc.width, glc.height);
    const img = new ImageData(printW, printH), d = img.data;
    for (let i = 0; i < printTex.length; i++) { const v = 243 - printTex[i] * 0.93; d[i * 4] = v; d[i * 4 + 1] = v * 0.99; d[i * 4 + 2] = v * 0.96; d[i * 4 + 3] = 255; }
    const pc = canvas(printW, printH);
    pc.getContext('2d').putImageData(img, 0, 0);
    o.setTransform(DPR, 0, 0, DPR, 0, 0);
    o.drawImage(pc, P2.x - W - PW / 2, P2.y - PH / 2, PW, PH);
  }

  /* ---------- 组装 ---------- */
  let maxTex = 4096;
  function build() {
    layout();
    if (glOK) maxTex = Math.min(8192, gl.getParameter(gl.MAX_TEXTURE_SIZE));
    renderBench(maxTex);
    renderPrint();
    makeLiquids();
    if (glOK) {
      upload('bench', 0, 'rgba', 0, 0, benchCv);
      upload('print', 1, 'r', printW, printH, printTex);
    }
    if (REDUCED || !glOK) finish();
    else if (started) begin();
    else Object.assign(st, { phase: 'idle', cam: 0, where: -2, tongs: rest(1), light: 0, lightTo: 0, safe: 0.18 });
    dirty = true;
  }
  function render(now) {
    if (!glOK) { drawFallback(); drawOverlay(); return; }
    packLiquid(Q1);
    packLiquid(Q2);
    for (let i = 0; i < dev.p.length; i++) dev.px[i] = clamp(dev.p[i] / 4 * 255, 0, 255);
    upload('dev', 2, 'r', DX, DY, dev.px);
    upload('liq0', 3, 'f', Q1.nx, Q1.ny, Q1.px);
    upload('liq1', 4, 'f', Q2.nx, Q2.ny, Q2.px);
    gl.viewport(0, 0, glc.width, glc.height);
    gl.uniform2f(U.uRes, glc.width, glc.height);
    gl.uniform2f(U.uWorld, WW, H);
    gl.uniform2f(U.uPrintPx, printW, printH);
    gl.uniform1f(U.uDpr, DPR);
    gl.uniform1f(U.uCam, st.cam);
    gl.uniform1f(U.uTime, now / 1000);
    gl.uniform4f(U.uL0, L1.x, L1.y, L1.w, L1.h);
    gl.uniform4f(U.uL1, L2.x, L2.y, L2.w, L2.h);
    gl.uniform4f(U.uPaper, st.px, st.py, PW / 2, PH / 2);
    gl.uniform1f(U.uR, LR);
    gl.uniform1f(U.uRot, st.rot);
    gl.uniform1f(U.uLift, st.lift);
    gl.uniform1f(U.uWhere, st.where);
    gl.uniform1f(U.uFog, st.fog);
    gl.uniform1f(U.uWet, st.wet);
    gl.uniform1f(U.uLight, st.light);
    gl.uniform1f(U.uSafe, st.safe);
    gl.uniform1f(U.uFade, st.fade);
    gl.uniform1f(U.uGain, GAIN);
    gl.uniform3f(U.uLamp, lamp[0], lamp[1], lamp[2]);
    gl.uniform3f(U.uRoom, room[0], room[1], room[2]);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    drawOverlay();
  }

  let visible = false, last = performance.now();
  new IntersectionObserver(es => es.forEach(e => { visible = e.isIntersecting; })).observe(scene);
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(now - last, 50);
    last = now;
    if (!visible) return;
    const r = scene.getBoundingClientRect();
    if (!started && !REDUCED && glOK && (r.top < innerHeight * 0.72 || r.bottom <= innerHeight + 4)) begin();
    if (fadeTo === 'out') { st.fade = Math.max(0, st.fade - dt / 350); if (st.fade <= 0) { begin(); fadeTo = 'in'; } }
    else if (fadeTo === 'in') { st.fade = Math.min(1, st.fade + dt / 450); if (st.fade >= 1) fadeTo = null; }
    const calm = !started || (st.phase === 'done' && Q1.e + Q2.e < 0.02 && st.cord.pull === 0 && Math.abs(st.cord.va) < 0.01 && !fadeTo);
    if (started && !REDUCED) update(dt);
    else if (REDUCED) { stepLiquid(Q1, dt / 1000); stepLiquid(Q2, dt / 1000); }
    setStatus();
    if (calm && !dirty) return;
    dirty = false;
    try { render(now); } catch (err) { console.error(err); }
  }

  // 字体到了再画照片；换品牌名、改宽度时重建
  const fontsReady = () => Promise.all([
    document.fonts.load('800 100px Fraunces'), document.fonts.load('900 100px "Noto Serif SC"', brand), document.fonts.load('600 20px Caveat'),
  ]).catch(() => {});
  try { glOK = initGL(); } catch (err) { console.error(err); glOK = false; }
  if (!glOK) glc.dataset.mode = '2d';
  layout();
  makeLiquids();
  fontsReady().then(() => { build(); requestAnimationFrame(loop); });
  let tmr, lastW = innerWidth;
  addEventListener('resize', () => {
    if (innerWidth === lastW) return;
    lastW = innerWidth;
    clearTimeout(tmr);
    tmr = setTimeout(() => { const keep = st.phase; build(); if (keep === 'done') finish(); }, 200);
  });
</script>
</body>
</html>
