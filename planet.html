<style>
  :root {
    --bg: #0b0b0d;
    --panel: #151518;
    --line: #26262b;
    --text: #ececef;
    --muted: #9a9aa3;

    --f-text: #e4e9f2;

  .folio:hover, .folio:focus-visible { opacity: 1; }

  /* ---------- 页脚 ---------- */
  .foot { background: var(--f-bg); color: var(--f-text); border-top: 1px solid var(--f-line); }
  .foot-top {
    display: grid; grid-template-columns: minmax(260px, 1.5fr) repeat(3, minmax(120px, 1fr)); gap: 40px 48px;
    max-width: 1320px; margin: 0 auto; padding: 64px clamp(16px, 4vw, 48px) 40px;
  }
  .brand .name { font: 700 36px/1 var(--grot); letter-spacing: -0.02em; }
  .brand .tag { margin: 14px 0 22px; color: var(--f-muted); font-size: 14px; max-width: 32ch; text-wrap: pretty; }
  .status { display: inline-flex; align-items: center; gap: 9px; font: 12.5px/1 var(--grot); color: var(--f-muted); padding: 8px 12px 8px 10px; border: 1px solid var(--f-line); border-radius: 999px; font-variant-numeric: tabular-nums; }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--f-faint); flex: none; transition: background .6s, box-shadow .6s; }
  .status[data-on="night"] i { background: #ffc36b; box-shadow: 0 0 10px 1px rgb(255 195 107 / .6); }

  .foot-legal {

  @media (max-width: 760px) {

  }
</style>

<footer class="foot">

<script>
  const $ = s => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
  const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
  // 品牌名默认 Lumen，网址加 ?name=星河 这样的参数可以换
  const brand = (new URLSearchParams(location.search).get('name') || '').trim().slice(0, 16) || 'Lumen';
  $('#f-name').textContent = brand;
  document.querySelectorAll('.bn').forEach(b => { b.textContent = brand; });

  /* ---------- 噪声：二维、三维值噪声，带周期的版本给细节纹理用 ---------- */
  function hash2(x, y) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  function hash3(x, y, z) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(z | 0, 1440662683)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  const fade = t => t * t * (3 - 2 * t);
  function noise2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), u = fade(x - xi), v = fade(y - yi);
    const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function noise3(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), u = fade(x - xi), v = fade(y - yi), w = fade(z - zi);
    const l = (a, b, t) => a + (b - a) * t;
    return l(l(l(hash3(xi, yi, zi), hash3(xi + 1, yi, zi), u), l(hash3(xi, yi + 1, zi), hash3(xi + 1, yi + 1, zi), u), v),
             l(l(hash3(xi, yi, zi + 1), hash3(xi + 1, yi, zi + 1), u), l(hash3(xi, yi + 1, zi + 1), hash3(xi + 1, yi + 1, zi + 1), u), v), w);
  }
  const fbm2 = (x, y) => noise2(x, y) * 0.5 + noise2(x * 2.03 + 17, y * 2.03 + 9) * 0.27 + noise2(x * 4.1 + 41, y * 4.1 + 23) * 0.15 + noise2(x * 8.3 + 7, y * 8.3 + 61) * 0.08;
  const ridge = (x, y) => { const n = 1 - Math.abs(noise2(x, y) * 2 - 1); return n * n; };

  const scene = $('#scene'), glc = $('#gl'), ovc = $('#over'), octx = ovc.getContext('2d');
  const statusEl = $('#status'), statusText = $('#status-text');

  /* ---------- 构图：正交相机，屏幕坐标 y ∈ [-1, 1]，星球的上沿是一道弧 ---------- */
  let W, H, DPR, ASP, mobile, R, C, TB, TILT;
  function layout() {
    W = scene.clientWidth;
    DPR = Math.min(devicePixelRatio || 1, 2);
    mobile = W < 680;
    H = Math.round(mobile ? clamp(W * 0.82, 280, 420) : clamp(W * 0.5, 340, 680));
    ASP = W / H;
    R = Math.max(mobile ? 2.2 : 2.5, ASP * 1.62);
    C = [0, (mobile ? 0.36 : 0.44) - R];
    // 字放在弧下面、星球正对着相机的那一片
    TB = { cx: 0, cy: mobile ? -0.32 : -0.42, hw: ASP * (mobile ? 0.8 : 0.66), hh: mobile ? 0.34 : 0.4 };
    TILT = -0.16;
    glc.style.height = ovc.style.height = H + 'px';
    glc.width = ovc.width = Math.round(W * DPR);
    glc.height = ovc.height = Math.round(H * DPR);
  }
  // 星球朝向：先绕自己的轴转 spin，再往后仰 TILT。返回按列存的 3×3（星球本地 → 相机）
  function rotM(spin) {
    const cs = Math.cos(spin), ss = Math.sin(spin), ct = Math.cos(TILT), st = Math.sin(TILT);
    // Rx(tilt) · Ry(spin)
    return [cs, st * ss, -ct * ss, 0, ct, st, ss, -st * cs, ct * cs];
  }
  const mul = (m, v) => [m[0] * v[0] + m[3] * v[1] + m[6] * v[2], m[1] * v[0] + m[4] * v[1] + m[7] * v[2], m[2] * v[0] + m[5] * v[1] + m[8] * v[2]];
  const mulT = (m, v) => [m[0] * v[0] + m[1] * v[1] + m[2] * v[2], m[3] * v[0] + m[4] * v[1] + m[5] * v[2], m[6] * v[0] + m[7] * v[1] + m[8] * v[2]];
  const norm = v => { const l = Math.hypot(...v) || 1; return v.map(x => x / l); };

  /* ---------- 地图：只在品牌名所在的那一块经纬度里存高精度数据 ---------- */
  // 品牌名先按相机视角画在屏幕上，再把每个地图格子投到屏幕上取样：正对着看时，字形一点不走样
  let MAP = null, ELEV = null, MW = 0, MH = 0, PATCH = null;
  function buildMap() {
    const sw = mobile ? 900 : 1400, sh = Math.round(sw / ASP);
    const toPx = (x, y) => [(x + ASP) / (2 * ASP) * sw, (1 - y) / 2 * sh];
    const mc = canvas(sw, sh), m = mc.getContext('2d', { willReadFrequently: true });
    const font = s => `800 ${s}px Unbounded, "Noto Sans SC", "Segoe UI", "Microsoft YaHei", sans-serif`;
    m.font = font(100);
    const mt = m.measureText(brand), tw = (mt.actualBoundingBoxLeft + mt.actualBoundingBoxRight) || 1, th = (mt.actualBoundingBoxAscent + mt.actualBoundingBoxDescent) || 1;
    const [bx0, by0] = toPx(TB.cx - TB.hw, TB.cy + TB.hh), [bx1, by1] = toPx(TB.cx + TB.hw, TB.cy - TB.hh);
    const size = Math.min(100 * (bx1 - bx0) / tw, 100 * (by1 - by0) / th), k = size / 100;
    m.font = font(size);
    m.fillStyle = '#fff';
    m.filter = `blur(${Math.max(1.5, size * 0.018)}px)`;   // 糊一点，海岸线附近就有一圈渐变，好让噪声咬出海湾和小岛
    m.fillText(brand, (bx0 + bx1) / 2 - tw * k / 2 + mt.actualBoundingBoxLeft * k, (by0 + by1) / 2 - th * k / 2 + mt.actualBoundingBoxAscent * k);
    const md = m.getImageData(0, 0, sw, sh).data, mask = new Float32Array(sw * sh);
    for (let i = 0; i < mask.length; i++) mask[i] = md[i * 4 + 3] / 255;
    const sample = (px, py) => {   // 双线性取样
      if (px < 0 || py < 0 || px >= sw - 1 || py >= sh - 1) return 0;
      const x0 = Math.floor(px), y0 = Math.floor(py), fx = px - x0, fy = py - y0, i = y0 * sw + x0;
      return (mask[i] * (1 - fx) + mask[i + 1] * fx) * (1 - fy) + (mask[i + sw] * (1 - fx) + mask[i + sw + 1] * fx) * fy;
    };
    // 字框（放大一圈）投回球面，得到这块地图要覆盖的经纬度范围
    const M0 = rotM(0);
    let lon0 = 9, lon1 = -9, lat0 = 9, lat1 = -9;
    for (let a = 0; a <= 1; a += 0.05) for (let b = 0; b <= 1; b += 0.05) {
      const x = TB.cx + (a * 2 - 1) * TB.hw * 1.12, y = TB.cy + (b * 2 - 1) * TB.hh * 1.25;
      const qx = (x - C[0]) / R, qy = (y - C[1]) / R, r2 = qx * qx + qy * qy;
      if (r2 >= 1) continue;
      const L = mulT(M0, [qx, qy, Math.sqrt(1 - r2)]);
      const lon = Math.atan2(L[0], L[2]), lat = Math.asin(clamp(L[1], -1, 1));
      lon0 = Math.min(lon0, lon); lon1 = Math.max(lon1, lon); lat0 = Math.min(lat0, lat); lat1 = Math.max(lat1, lat);
    }
    PATCH = [lon0, lat0, lon1, lat1];
    MW = mobile ? 1280 : 2048;
    // 行数按屏幕上的实际密度定：纬度方向既要乘 1/cos(纬度)，又被透视压扁了 nz，两边的格子在屏幕上差不多一样大
    const latc = (lat0 + lat1) / 2, qc = (TB.cy - C[1]) / R, nzc = Math.sqrt(Math.max(0.05, 1 - qc * qc));
    MH = clamp(Math.round(MW * (lat1 - lat0) / ((lon1 - lon0) * Math.cos(latc)) * nzc), 160, 1024);
    // 噪声的坐标用这个格子投到屏幕上的位置，单位大约是一个地图格：这样山和海岸在屏幕上看是各向同性的
    const ns = MW / ((bx1 - bx0) * 1.12);
    const N = MW * MH, land = new Uint8Array(N), soft = new Float32Array(N), NX = new Float32Array(N), NY = new Float32Array(N);
    for (let v = 0; v < MH; v++) {
      const lat = lat1 - (v + 0.5) / MH * (lat1 - lat0), cl = Math.cos(lat), sl = Math.sin(lat);
      for (let u = 0; u < MW; u++) {
        const lon = lon0 + (u + 0.5) / MW * (lon1 - lon0);
        const P = mul(M0, [cl * Math.sin(lon), sl, cl * Math.cos(lon)]);
        if (P[2] <= 0) continue;
        const [px, py] = toPx(C[0] + P[0] * R, C[1] + P[1] * R), i = v * MW + u, X = px * ns, Y = py * ns;
        NX[i] = X;
        NY[i] = Y;
        // 海岸线：取样位置先被噪声推一下，再加一层噪声去比阈值
        const wx = (noise2(X * 0.012, Y * 0.012) - 0.5) * 14, wy = (noise2(X * 0.012 + 31, Y * 0.012 + 7) - 0.5) * 14;
        const mv = sample(px + wx / ns, py + wy / ns);
        if (mv < 0.02) continue;
        const val = mv + (fbm2(X * 0.02, Y * 0.02) - 0.5) * 0.5;
        soft[i] = smooth((val - 0.47) / 0.06);
        land[i] = val > 0.5 ? 1 : 0;
      }
    }
    // 离海岸多远：陆地里决定海拔，海里决定大陆架（海拔最后整体模糊两遍，把距离场在中轴线上的折痕磨平）
    const dIn = dist(land, MW, MH, 1), dOut = dist(land, MW, MH, 0);
    MAP = new Uint8Array(N * 4);
    ELEV = new Float32Array(N);   // 海拔单独存浮点：8 位的话，相邻两行的梯度在 0 和 1/255 之间跳，打光以后是一条条横纹
    for (let v = 0; v < MH; v++) for (let u = 0; u < MW; u++) {
      const i = v * MW + u, o = i * 4, X = NX[i], Y = NY[i];
      let g, b = 0, a = 0;
      if (land[i]) {
        const d = dIn[i];
        const e = clamp(smooth(d / 26) * 0.3 + ridge(X * 0.011, Y * 0.011) * 0.44 * smooth((d - 6) / 34) + (noise2(X * 0.03, Y * 0.03) * 0.6 + noise2(X * 0.061 + 17, Y * 0.061 + 9) * 0.4) * 0.16 - 0.05, 0, 1);
        g = 0.5 + 0.5 * e;
        b = fbm2(X * 0.004 + 50, Y * 0.004 + 20);   // 干湿：决定是沙漠还是森林
        // 城市灯光：沿海密、内陆成团，中间用几条“公路”连起来
        const coast = Math.exp(-d / 9), metro = smooth((noise2(X * 0.03, Y * 0.03) - 0.38) / 0.35);
        const p = (0.06 + 0.5 * coast) * (0.25 + 0.75 * metro), h = hash2(u, v);
        if (h < p * 0.55) a = 0.45 + 0.55 * hash2(u + 7, v) * (0.5 + 0.5 * metro);
        const road = 1 - Math.abs(noise2(X * 0.018 + 9, Y * 0.018 + 3) * 2 - 1);
        if (road > 0.965 && h < 0.35) a = Math.max(a, 0.35);
      } else {
        g = 0.5 - 0.5 * smooth(dOut[i] / (14 + 40 * noise2(u * 0.01 + 3, v * 0.01 * MW / MH * 0.5 + 8)));
        b = 0;
      }
      MAP[o] = soft[i] * 255;
      ELEV[i] = g;
      MAP[o + 1] = g * 255;
      MAP[o + 2] = b * 255;
      MAP[o + 3] = a * 255;
    }
    blur(ELEV, MW, MH, 3);
    blur(ELEV, MW, MH, 3);
  }
  // 横竖各一遍的滑动平均
  function blur(a, w, h, r) {
    const t = new Float32Array(a.length), n = r * 2 + 1;
    for (let y = 0; y < h; y++) {
      let s = 0;
      for (let k = -r; k <= r; k++) s += a[y * w + clamp(k, 0, w - 1)];
      for (let x = 0; x < w; x++) { t[y * w + x] = s / n; s += a[y * w + Math.min(w - 1, x + r + 1)] - a[y * w + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let s = 0;
      for (let k = -r; k <= r; k++) s += t[clamp(k, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) { a[y * w + x] = s / n; s += t[Math.min(h - 1, y + r + 1) * w + x] - t[Math.max(0, y - r) * w + x]; }
    }
  }
  // 两遍倒角距离（单位：格）
  function dist(mask, w, h, want) {
    const d = new Float32Array(w * h), R2 = Math.SQRT2;
    for (let i = 0; i < d.length; i++) d[i] = mask[i] === want ? 1e9 : 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (!d[i]) continue;
      let v = d[i];
      if (x > 0) v = Math.min(v, d[i - 1] + 1);
      if (y > 0) { v = Math.min(v, d[i - w] + 1); if (x > 0) v = Math.min(v, d[i - w - 1] + R2); if (x < w - 1) v = Math.min(v, d[i - w + 1] + R2); }
      d[i] = v;
    }
    for (let y = h - 1; y >= 0; y--) for (let x = w - 1; x >= 0; x--) {
      const i = y * w + x;
      if (!d[i]) continue;
      let v = d[i];
      if (x < w - 1) v = Math.min(v, d[i + 1] + 1);
      if (y < h - 1) { v = Math.min(v, d[i + w] + 1); if (x < w - 1) v = Math.min(v, d[i + w + 1] + R2); if (x > 0) v = Math.min(v, d[i + w - 1] + R2); }
      d[i] = v;
    }
    return d;
  }

  /* ---------- 云：整颗球一张经纬度贴图，用三维噪声在球面上算，接缝和两极都不会裂 ---------- */
  let CLOUD = null, CW = 0, CH = 0, DETAIL = null;
  function buildClouds() {
    CW = mobile ? 640 : 1152;
    CH = CW / 2;
    CLOUD = new Uint8Array(CW * CH);
    const raw = new Float32Array(CW * CH);

  scene.addEventListener('pointerdown', e => {
    st.drag = true;
    st.touched = true;
    lastX = e.clientX;
    scene.classList.add('drag');
    scene.setPointerCapture(e.pointerId);
  });
  scene.addEventListener('pointermove', e => {
    const r = scene.getBoundingClientRect();
    st.parT = [((e.clientX - r.left) / r.width - 0.5) * 0.035, -((e.clientY - r.top) / r.height - 0.5) * 0.02];
    if (st.drag) {
      const dx = e.clientX - lastX;
      lastX = e.clientX;
      st.spin += dx / W * 1.6;
      st.vspin = dx / W * 1.6 * 60;
    }
  });
  const up = () => { st.drag = false; scene.classList.remove('drag'); };
  scene.addEventListener('pointerup', up);
  scene.addEventListener('pointercancel', up);
  scene.addEventListener('pointerleave', () => { st.parT = [0, 0]; });
  $('#ffwd').addEventListener('click', () => { st.ffwd = Math.PI * 2; st.started = true; });

  function frame(dt) {
    const s = dt / 1000;
    if (st.started && !REDUCED) {
      const boost = st.ffwd > 0 ? 7 : 1;
      const near = wrap(st.phi);   // 日出前后放慢一点，让那道光多停一会儿
      const dphi = s * Math.PI * 2 / PERIOD * boost * (1 - 0.55 * Math.exp(-(((near - 0.15) / 0.3) ** 2)));
      st.phi += dphi;
      if (st.ffwd > 0) st.ffwd = Math.max(0, st.ffwd - dphi);
      st.cloudT += s * 0.0035 * boost;
      st.t += s;
    }
    if (!st.drag) {   // 松手后带一点惯性，再被弹簧拉回原位
      st.vspin += (-st.spin * 9 - st.vspin * 4.2) * s;
      st.spin += st.vspin * s;
    }
    st.par = st.par.map((v, i) => v + (st.parT[i] - v) * Math.min(1, s * 3));
  }
  function render(now) {
    const S = sunAt(st.phi);
    setStatus(S);
    if (!glOK) return;
    // 太阳刚从地平线后面探出来时最亮，之后一边升高一边淡下去
    const a = wrap(st.phi), flare = Math.exp(-(((a - 0.13) / 0.12) ** 2));
    const dir = S0, lift = 1.004 + Math.max(0, a - 0.13) * 0.45;
    gl.viewport(0, 0, glc.width, glc.height);
    gl.uniform2f(U.uRes, glc.width, glc.height);
    gl.uniform2f(U.uC, C[0], C[1]);
    gl.uniform2f(U.uPar, st.par[0], st.par[1]);
    gl.uniform1f(U.uAsp, ASP);
    gl.uniform1f(U.uR, R);
    gl.uniform1f(U.uTime, now / 1000);
    gl.uniform1f(U.uCloudT, st.cloudT);
    gl.uniform1f(U.uFlare, flare);
    gl.uniformMatrix3fv(U.uRot, false, rotM(st.spin));
    gl.uniform4f(U.uPatch, PATCH[0], PATCH[1], PATCH[2], PATCH[3]);
    gl.uniform3f(U.uSun, S[0], S[1], S[2]);
    gl.uniform2f(U.uFlarePos, C[0] + st.par[0] + dir[0] * R * lift, C[1] + st.par[1] + dir[1] * R * lift);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  // 没有 WebGL2：画一张安静的夜景剪影，字是暖色的灯
  function fallback() {
    const o = glc.getContext('2d');
    o.setTransform(DPR, 0, 0, DPR, 0, 0);
    o.fillStyle = '#03050a';
    o.fillRect(0, 0, W, H);
    const cx = W / 2, cy = (1 - C[1]) / 2 * H, rr = R / 2 * H;
    const g = o.createRadialGradient(cx, cy, rr * 0.9, cx, cy, rr * 1.04);
    g.addColorStop(0, '#071022');
    g.addColorStop(0.96, '#0b1b3a');
    g.addColorStop(1, 'rgba(60,120,255,0)');
    o.fillStyle = g;
    o.beginPath(); o.arc(cx, cy, rr * 1.04, 0, 7); o.fill();
    o.font = `800 ${H * 0.3}px Unbounded, "Noto Sans SC", sans-serif`;
    o.textAlign = 'center';
    o.fillStyle = 'rgba(255,190,110,.75)';
    o.fillText(brand, W / 2, (1 - TB.cy) / 2 * H + H * 0.1);
  }

  function build() {
    layout();
    buildMap();
    buildClouds();
    sunPath();
    if (glOK) uploadAll();
    else fallback();
    if (REDUCED) { st.phi = 1.4; st.started = true; }   // 停在上午：大陆看得清
  }

  let visible = false, last = performance.now();
  new IntersectionObserver(es => es.forEach(e => { visible = e.isIntersecting; })).observe(scene);
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(now - last, 50);
    last = now;
    if (!visible) return;
    const r = scene.getBoundingClientRect();
    if (!st.started && (r.top < innerHeight * 0.72 || r.bottom <= innerHeight + 4)) st.started = true;
    frame(dt);
    try { render(now); } catch (err) { console.error(err); }
    drawOverlay(dt / 1000);
  }

  const fontsReady = () => Promise.all([
    document.fonts.load('800 100px Unbounded', brand), document.fonts.load('900 100px "Noto Sans SC"', brand), document.fonts.load('700 36px "Space Grotesk"'),
  ]).catch(() => {});
  try { glOK = initGL(); } catch (err) { console.error(err); glOK = false; }
  fontsReady().then(() => { build(); requestAnimationFrame(loop); });
  let tmr, lastW = innerWidth;
  addEventListener('resize', () => {
    if (innerWidth === lastW) return;
    lastW = innerWidth;
    clearTimeout(tmr);
    tmr = setTimeout(build, 250);
  });
</script>
</body>
</html>
