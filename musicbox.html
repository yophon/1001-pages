<meta name="description" content="品牌名打成纸带上的孔，摇动摇柄，纸带走过钢制音梳，字的形状就成了一段旋律。">

<style>
  :root {
    --table: #1a110b;
    --ink: #efe3c8;
    --muted: #b49b77;
    --faint: #7d6a52;
    --brass: #d9b46c;
    --ui: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--table); color: var(--ink); font: 14px/1.5 var(--ui); overflow: hidden; -webkit-tap-highlight-color: transparent; }

  /* 角落的页码，点了回目录；用反色混合，深浅底上都看得见 */
  .folio {
    position: absolute; top: 12px; right: 16px; z-index: 20;
    font: 500 11px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .14em;
    color: #fff; mix-blend-mode: difference; opacity: .5; text-decoration: none; transition: opacity .2s;
  }
  .folio:hover, .folio:focus-visible { opacity: 1; }

  #stage { position: fixed; inset: 0; }
  /* 灯是慢慢亮起来的：画布从桌面的颜色里浮出来 */
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; opacity: 0; transition: opacity 1.1s ease; outline: none; }
  .ready #cv { opacity: 1; }
  #cv:focus-visible { box-shadow: inset 0 0 0 2px rgb(217 180 108 / .55); }

  /* 提示 */
  .hint {
    position: absolute; z-index: 5; pointer-events: none; color: var(--ink);
    font: 500 13px/1.4 var(--ui); letter-spacing: .04em; text-shadow: 0 1px 3px rgb(0 0 0 / .8);
    opacity: 0; transition: opacity .6s;
  }
  .hint.on { opacity: .92; }
  /* 摇柄外面一道顺时针的弧，轻轻往前推 */
  #h-crank { transform: translate(-50%, -50%); }
  #h-crank svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; animation: nudge 1.4s ease-in-out infinite alternate; }
  #h-crank path { fill: none; stroke: var(--brass); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 2px rgb(0 0 0 / .8)); }
  #h-crank path.arc { stroke-dasharray: 2 6; }
  #h-crank span { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; }
  @keyframes nudge { from { transform: rotate(-8deg); } to { transform: rotate(16deg); } }
  #h-punch { transform: translate(-50%, 0); white-space: nowrap; font-size: 12.5px; }

  /* 底下几个按钮 */

  /* 横着拿手机时机器几乎占满高度，按钮挪到左上角的桌面上 */

  .ctl button {

    font: 500 12.5px/1 var(--ui); color: var(--muted); letter-spacing: .03em;
    background: rgb(22 15 10 / .72); border: 1px solid rgb(217 180 108 / .22); cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: color .2s, border-color .2s;
  }
  .ctl button:hover, .ctl button:focus-visible { color: var(--ink); border-color: rgb(217 180 108 / .5); outline: none; }
  .ctl button[aria-pressed="true"] { color: var(--ink); border-color: rgb(217 180 108 / .55); }
  .ctl svg { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .ctl [hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    #cv, .hint { transition: none; }
    #h-crank svg { animation: none; }
  }
</style>

<body>
<a class="folio" href="index.html" title="回到目录">一千零一页 · 008</a>

<main id="stage">
  <canvas id="cv" tabindex="0" aria-label="一台手摇纸带音乐盒，纸带上打着品牌名的孔。按住摇柄转动，或者用左右方向键摇；空格键让它自己转。"></canvas>
  <div class="hint" id="h-crank" aria-hidden="true"><svg><path class="arc"/><path class="head"/></svg><span>摇一下</span></div>
  <div class="hint" id="h-punch" aria-hidden="true">点纸带上的空格打孔，点孔贴胶带补上</div>
</main>

<div class="ctl">
  <button type="button" id="auto" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M11.8 1.8l-.3 2.7 2.7.3"/></svg><span>自己转</span></button>
  <button type="button" id="snd" aria-pressed="true"><svg viewBox="0 0 16 16"><path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z"/><path class="w" d="M10.6 5.6a3.4 3.4 0 0 1 0 4.8M12.4 3.9a5.8 5.8 0 0 1 0 8.2"/></svg><span>声音</span></button>
  <button type="button" id="reset" hidden><svg viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1.5-3.6"/><path d="M4.2 1.8l.3 2.7-2.7.3"/></svg><span>还原纸带</span></button>
</div>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
  const TAU = Math.PI * 2;
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 品牌名默认 Lumen，网址加 ?name=星河 这样的参数可以换
  const brand = (new URLSearchParams(location.search).get('name') || '').trim().slice(0, 16) || 'Lumen';
  const CJK = /[⺀-鿿豈-﫿＀-￯]/.test(brand);

  // ---------- 音阶：20 个齿，上面 16 个是 C 大调五声音阶，下面 4 个是低音 ----------
  const MIDI = [96, 93, 91, 88, 86, 84, 81, 79, 76, 74, 72, 69, 67, 64, 62, 60, 57, 55, 53, 48];
  const NAMES = ['C7', 'A6', 'G6', 'E6', 'D6', 'C6', 'A5', 'G5', 'E5', 'D5', 'C5', 'A4', 'G4', 'E4', 'D4', 'C4', 'A3', 'G3', 'F3', 'C3'];
  const ROWS = 20, MEL = 16;
  // 每小节一个和弦，C – Am – F – G 轮着来；低音按 3+3+2 拨三下
  const BASS = [[19, 19, 17], [16, 16, 16], [18, 18, 19], [17, 17, 17]];
  const BEATS = [0, 3, 6];
  const COLS_PER_REV = 8;               // 摇一圈走一小节
  const freq = m => 440 * 2 ** ((m - 69) / 12);

  // 可复现的伪随机
  const hash = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const mulberry = s => () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };

  // ---------- 把品牌名排成孔 ----------
  // 先用粗体按“一格一个孔”的分辨率栅格化，再细化成一笔宽：竖笔因为斜体变成一串往上走的琶音，横笔是同一个音的连拨，弯笔是起伏的旋律
  function thin(g, w, h) {
    const at = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : g[y * w + x];
    let changed = true;
    while (changed) {
      changed = false;
      for (let step = 0; step < 2; step++) {
        const del = [];
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
          if (!g[y * w + x]) continue;
          const P2 = at(x, y - 1), P3 = at(x + 1, y - 1), P4 = at(x + 1, y), P5 = at(x + 1, y + 1);
          const P6 = at(x, y + 1), P7 = at(x - 1, y + 1), P8 = at(x - 1, y), P9 = at(x - 1, y - 1);
          const B = P2 + P3 + P4 + P5 + P6 + P7 + P8 + P9;
          if (B < 2 || B > 6) continue;
          const q = [P2, P3, P4, P5, P6, P7, P8, P9, P2];
          let A = 0;
          for (let i = 0; i < 8; i++) if (!q[i] && q[i + 1]) A++;
          if (A !== 1) continue;
          if (step === 0 ? (P2 * P4 * P6 || P4 * P6 * P8) : (P2 * P4 * P8 || P2 * P6 * P8)) continue;
          del.push(y * w + x);
        }
        for (const i of del) g[i] = 0;
        if (del.length) changed = true;
      }
    }
  }
  function components(g, w, h) {
    const lab = new Int32Array(w * h).fill(-1), list = [];
    for (let i = 0; i < w * h; i++) {
      if (!g[i] || lab[i] >= 0) continue;
      const id = list.length, cells = [], st = [i];
      lab[i] = id;
      while (st.length) {
        const j = st.pop(), x = j % w, y = (j / w) | 0;
        cells.push(j);
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx, yy = y + dy, k = yy * w + xx;
          if (xx >= 0 && yy >= 0 && xx < w && yy < h && g[k] && lab[k] < 0) { lab[k] = id; st.push(k); }
        }
      }
      list.push(cells);
    }
    return list;
  }
  function rasterBrand() {
    const S = 12;
    const fam = CJK ? '"Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif' : 'Outfit, "Segoe UI", Arial, sans-serif';
    const wt = CJK ? 400 : 700;
    const m = canvas(8, 8).getContext('2d');
    m.font = `${wt} 100px ${fam}`;
    let px, base;
    if (CJK) {
      const mm = m.measureText(brand), hh = (mm.actualBoundingBoxAscent + mm.actualBoundingBoxDescent) || 88;
      px = 100 * 15 * S / hh;
      base = 0.5 * S + (mm.actualBoundingBoxAscent || 76) * px / 100;
    } else {
      const mm = m.measureText('H');
      px = 100 * 10.5 * S / (mm.actualBoundingBoxAscent || 70);
      base = 12.5 * S;
    }
    const k = CJK ? 0 : 0.3;                          // 斜体的倾斜量：每往上一行往后挪 0.3 列
    const ls = (CJK ? 1.8 : 1.15) * S;
    m.font = `${wt} ${px}px ${fam}`;
    const chars = [...brand];
    const adv = chars.map(ch => m.measureText(ch).width + ls);
    const tw = adv.reduce((a, b) => a + b, 0);
    const cw = Math.ceil((tw + k * 16 * S + 4 * S) / S) * S, ch = 16 * S;
    let c, o;
    if (VERT) {
      // 竖屏的中文：纸带竖着走，把每个字转 90° 打上去，屏幕上看是正着的一列竖排；第一个字在最上面
      const step = 16 * S + ls, n = chars.length;
      c = canvas(n * step + 4 * S, ch); o = c.getContext('2d', { willReadFrequently: true });
      o.font = m.font; o.textAlign = 'center'; o.textBaseline = 'middle';
      chars.forEach((chr, i) => {
        o.setTransform(0, 1, -1, 0, 2 * S + (n - 1 - i) * step + 8 * S, 8 * S);
        o.fillText(chr, 0, 0);
      });
    } else {
      c = canvas(cw, ch); o = c.getContext('2d', { willReadFrequently: true });
      o.font = m.font;
      o.setTransform(1, 0, -k, 1, k * base, 0);
      let x = 2 * S;
      chars.forEach((chr, i) => { o.fillText(chr, x, base); x += adv[i]; });
    }
    const cols = Math.round(c.width / S), iw = c.width;
    const d = o.getImageData(0, 0, iw, ch).data;
    const g = new Uint8Array(cols * 16);
    const thr = (CJK ? 0.36 : 0.46) * 255;
    for (let r = 0; r < 16; r++) for (let cc = 0; cc < cols; cc++) {
      let a = 0, n = 0;
      for (let y = r * S + 2; y < r * S + S - 2; y++) for (let xx = cc * S + 2; xx < cc * S + S - 2; xx++) { a += d[(y * iw + xx) * 4 + 3]; n++; }
      g[r * cols + cc] = a / n > thr ? 1 : 0;
    }
    const comps = components(g, cols, 16);
    thin(g, cols, 16);
    // i、j 上的点这类小团块会被整个细化掉，补回一个孔
    for (const cells of comps) {
      if (cells.some(j => g[j])) continue;
      let sx = 0, sy = 0;
      for (const j of cells) { sx += j % cols; sy += (j / cols) | 0; }
      g[Math.round(sy / cells.length) * cols + Math.round(sx / cells.length)] = 1;
    }
    let c0 = cols, c1 = -1;
    for (let cc = 0; cc < cols; cc++) for (let r = 0; r < 16; r++) if (g[r * cols + cc]) { c0 = Math.min(c0, cc); c1 = Math.max(c1, cc); }
    if (c1 < 0) return { g: new Uint8Array(16), cols: 1 };
    const w = c1 - c0 + 1, out = new Uint8Array(w * 16);
    for (let r = 0; r < 16; r++) for (let cc = 0; cc < w; cc++) out[r * w + cc] = g[r * cols + cc + c0];
    return { g: out, cols: w };
  }
  let PAT, VERT = false;
  function buildPattern() {
    VERT = CJK && PORT;
    const R = rasterBrand();
    const LEAD = 4, TAIL = 4;
    const cols = Math.max(32, Math.ceil((LEAD + R.cols + TAIL) / 8) * 8);
    const holes = new Map();
    const add = (c, r, lean = 0) => holes.set(c * ROWS + r, { c, r, dx: (hash(c, r) - 0.5) * 0.12 + lean, patch: false, user: false });
    // 中文字没有斜体：同一列的孔从低到高往后错一点，一竖就成了一下扫弦，不是十几个音同时砸下去
    for (let r = 0; r < MEL; r++) for (let c = 0; c < R.cols; c++) if (R.g[r * R.cols + c]) add(LEAD + c, r, CJK ? (MEL - 1 - r) * 0.045 - 0.3 : 0);
    const bars = cols / 8;
    for (let b = 0; b < bars; b++) BEATS.forEach((o, i) => add(b * 8 + o, BASS[b % 4][i]));
    PAT = { cols, bars, holes, lead: LEAD, nameCols: R.cols, edited: false };
    PAT.orig = new Map([...holes].map(([k, h]) => [k, { ...h }]));
  }
  let SH = [], COLN = new Map();       // 没被贴住的孔，按在纸带上的位置排好（单位：列）；每列有几个孔
  function rebuildHoles() {
    SH = [...PAT.holes.values()].filter(h => !h.patch).map(h => ({ u: h.c + 0.5 + h.dx, r: h.r, c: h.c })).sort((a, b) => a.u - b.u);
    COLN = new Map();
    for (const h of SH) COLN.set(h.c, (COLN.get(h.c) || 0) + 1);
  }
  // 读音线上的纸带坐标从 u0 走到 u0+du，期间经过的孔；倒着走也算，f 是这一段里的先后
  function crossings(u0, du, out) {
    if (!du) return out;
    const P = PAT.cols, a = Math.min(u0, u0 + du), b = Math.max(u0, u0 + du);
    for (let k = Math.floor(a / P); k * P <= b; k++) {
      for (const h of SH) {
        const x = h.u + k * P;
        if (du > 0 ? (x > a && x <= b) : (x >= a && x < b)) out.push({ h, f: (x - u0) / du });
      }
    }
    return out.sort((m, n) => m.f - n.f);
  }

  // ---------- 声音 ----------
  function makeIR(ac, secs) {
    const sr = ac.sampleRate, n = Math.floor(sr * secs), b = ac.createBuffer(2, n, sr), rnd = mulberry(7);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      let lp = 0;
      for (let i = 0; i < n; i++) {
        const t = i / sr;
        lp += ((rnd() * 2 - 1) - lp) * (0.18 + 0.6 * Math.exp(-t / 0.12));     // 越往后越闷
        d[i] = lp * Math.exp(-t / 0.3) * (1 - Math.exp(-t / 0.0025)) * 0.55;
      }
      // 木盒子里的几次早反射
      [0.0029, 0.0047, 0.0071, 0.0113, 0.0164].forEach((s, i) => { d[Math.floor(s * sr) + ch * 7] += (i % 2 ? -0.32 : 0.38) * (1 - i * 0.12); });
    }
    return b;
  }
  function makeSynth(ac, live) {
    const sr = ac.sampleRate;
    const noise = ac.createBuffer(1, sr, sr), nd = noise.getChannelData(0), rnd = mulberry(3);
    for (let i = 0; i < nd.length; i++) nd[i] = rnd() * 2 - 1;
    const master = ac.createGain(); master.gain.value = live ? 0 : 0.9;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -9; comp.knee.value = 8; comp.ratio.value = 5; comp.attack.value = 0.002; comp.release.value = 0.18;
    master.connect(comp).connect(ac.destination);
    // 木盒子的共鸣：两个峰，再把最高的地方压一点
    const b1 = ac.createBiquadFilter(); b1.type = 'peaking'; b1.frequency.value = 240; b1.Q.value = 1.1; b1.gain.value = 4;
    const b2 = ac.createBiquadFilter(); b2.type = 'peaking'; b2.frequency.value = 1180; b2.Q.value = 1.6; b2.gain.value = 2.5;
    const hs = ac.createBiquadFilter(); hs.type = 'highshelf'; hs.frequency.value = 7500; hs.gain.value = -4;
    const dry = ac.createGain();
    dry.connect(b1).connect(b2).connect(hs).connect(master);
    const conv = ac.createConvolver();
    // 混响的冲激响应要算十几毫秒；第一次按下去时已经在建音频了，往后挪一下，别让那一帧更卡
    if (live) setTimeout(() => { conv.buffer = makeIR(ac, 1.5); }, 40); else conv.buffer = makeIR(ac, 1.5);
    const send = ac.createGain(); send.gain.value = 0.3;
    dry.connect(send).connect(conv).connect(master);
    const voices = [];

    // 一个齿：钢齿的基音带一个略微跑调的副本（慢慢地“呜哇”），加上不成倍数的高次泛音，起音很脆，衰减很长；拨之前星轮先“嗒”一下
    function note(row, t, vel = 1) {
      t = Math.max(t, ac.currentTime);              // 刚建好的音频时钟从 0 起，别排到过去去
      const f = freq(MIDI[row]);
      const tau = clamp(0.6 * Math.sqrt(261.6 / f), 0.2, 0.95);
      const amp = 0.13 * vel * Math.pow(f / 523.25, -0.22);
      const bright = 0.7 + 0.3 * vel;
      const prev = voices[row];
      if (prev && prev.end > t) {
        // 还在响的时候又被拨：先把它按住，避免两层叠在一起
        prev.g.gain.cancelScheduledValues(t);
        prev.g.gain.setTargetAtTime(0, t, 0.006);
        prev.srcs.forEach(s => { try { s.stop(t + 0.05); } catch {} });
      }
      const v = { g: ac.createGain(), srcs: [], end: t + tau * 7 };
      v.g.connect(dry);
      const parts = [[1, 1, tau], [1.0021, 0.2, tau * 0.85], [2, 0.1 * bright, tau * 0.3], [5.93, 0.21 * bright, 0.075], [11.4, 0.07 * bright, 0.026]];
      for (const [ra, a, tc] of parts) {
        if (f * ra > 15000) continue;
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = f * ra;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(amp * a, t + 0.0015);
        g.gain.setTargetAtTime(0, t + 0.0015, tc);
        o.connect(g).connect(v.g);
        o.start(t); o.stop(t + 0.002 + tc * 7);
        v.srcs.push(o);
      }
      const nz = ac.createBufferSource(), bp = ac.createBiquadFilter(), ng = ac.createGain();
      nz.buffer = noise;
      bp.type = 'bandpass'; bp.frequency.value = Math.min(8500, f * 4.5); bp.Q.value = 1.2;
      const t0 = Math.max(0, t - 0.007);
      ng.gain.setValueAtTime(0, t0);
      ng.gain.linearRampToValueAtTime(0.01 * vel, t0 + 0.0005);
      ng.gain.setTargetAtTime(0, t0 + 0.0005, 0.0012);
      ng.gain.setValueAtTime(0, t);
      ng.gain.linearRampToValueAtTime(0.045 * vel, t + 0.0006);
      ng.gain.setTargetAtTime(0, t + 0.0006, 0.004);
      nz.connect(bp).connect(ng).connect(v.g);
      nz.start(t0, rnd() * 0.9); nz.stop(t + 0.05);
      v.srcs.push(nz);
      voices[row] = v;

  }
  function drawGears(o) {
    const pa = -st.th * 4;
    for (const [spr, c, ang, R] of [[PIN, G.pin, pa, G.pinR], [GEAR, G.gear, st.th, G.gearR]]) {
      o.save(); o.translate(c[0], c[1]); o.rotate(ang);
      o.drawImage(spr.c, -spr.half, -spr.half, spr.half * 2, spr.half * 2);
      o.restore();
      // 不跟着转的那一点光
      o.save();
      o.beginPath(); o.arc(c[0], c[1], R + 0.2 * p, 0, TAU); o.clip();
      const hx = c[0] + LD[0] * R * 0.45, hy = c[1] + LD[1] * R * 0.45;
      const g = o.createRadialGradient(hx, hy, 0, hx, hy, R * 1.1);
      g.addColorStop(0, 'rgba(255,240,200,.28)'); g.addColorStop(1, 'rgba(255,240,200,0)');
      o.fillStyle = g; o.fillRect(c[0] - R - p, c[1] - R - p, 2 * R + 2 * p, 2 * R + 2 * p);
      const d = o.createRadialGradient(c[0] - LD[0] * R * 0.6, c[1] - LD[1] * R * 0.6, 0, c[0] - LD[0] * R * 0.6, c[1] - LD[1] * R * 0.6, R * 1.2);
      d.addColorStop(0, 'rgba(40,24,4,.25)'); d.addColorStop(1, 'rgba(40,24,4,0)');
      o.fillStyle = d; o.fillRect(c[0] - R - p, c[1] - R - p, 2 * R + 2 * p, 2 * R + 2 * p);
      o.restore();
    }
  }
  function drawCrank(o) {
    const [gx, gy] = G.gear, a = st.th, ca = Math.cos(a), sa = Math.sin(a);
    const kx = gx + ca * G.arm, ky = gy + sa * G.arm, nx = -sa, ny = ca;
    const w0 = 0.62 * p, w1 = 0.4 * p;
    o.save();
    shadow(o, 0.9 * p, 0.55 * p, 0.95 * p, 0.55);
    o.beginPath();
    o.moveTo(gx + nx * w0, gy + ny * w0);
    o.lineTo(kx + nx * w1, ky + ny * w1);
    o.arc(kx, ky, w1, a + Math.PI / 2, a - Math.PI / 2, true);
    o.lineTo(gx - nx * w0, gy - ny * w0);
    o.arc(gx, gy, w0, a - Math.PI / 2, a + Math.PI / 2, true);
    o.closePath();
    // 摇柄是抛光的钢，亮线顺着柄走，位置看光从哪边来
    const lit = nx * LD[0] + ny * LD[1];
    const g = o.createLinearGradient(gx - nx * w0, gy - ny * w0, gx + nx * w0, gy + ny * w0);
    const hiAt = 0.5 + 0.35 * lit;
    g.addColorStop(0, '#4b5257'); g.addColorStop(clamp(hiAt - 0.25, 0.01, 0.98), '#9aa3a9'); g.addColorStop(clamp(hiAt, 0.02, 0.99), '#f4f8fa'); g.addColorStop(1, '#3d4347');
    o.fillStyle = g; o.fill();
    noShadow(o);
    // 轴头的铜螺母
    o.beginPath(); o.arc(gx, gy, 0.82 * p, 0, TAU);
    o.fillStyle = lightGrad(o, gx - p, gy - p, gx + p, gy + p, BRASS); o.fill();
    o.strokeStyle = 'rgba(60,36,8,.6)'; o.lineWidth = 0.7; o.stroke();
    o.beginPath(); o.arc(gx, gy, 0.3 * p, 0, TAU); o.fillStyle = 'rgba(50,30,6,.6)'; o.fill();
    // 木把手
    shadow(o, 1.1 * p, 0.6 * p, 1.0 * p, 0.6);
    o.beginPath(); o.arc(kx, ky, G.knob, 0, TAU);
    const kg = o.createRadialGradient(kx + LD[0] * G.knob * 0.4, ky + LD[1] * G.knob * 0.4, G.knob * 0.1, kx, ky, G.knob);
    kg.addColorStop(0, '#9a6236'); kg.addColorStop(0.6, '#5d3519'); kg.addColorStop(1, '#2c170a');
    o.fillStyle = kg; o.fill();
    noShadow(o);
    o.beginPath(); o.arc(kx, ky, G.knob * 0.42, 0, TAU);
    o.strokeStyle = 'rgba(230,190,110,.75)'; o.lineWidth = 0.14 * p; o.stroke();
    o.beginPath(); o.arc(kx + LD[0] * G.knob * 0.45, ky + LD[1] * G.knob * 0.45, G.knob * 0.22, 0, TAU);
    o.fillStyle = 'rgba(255,230,190,.28)'; o.fill();
    o.restore();
  }
  function drawChad(o, x, y, a, flip, lift) {
    const R = 0.35 * p;
    o.save();
    if (lift > 0) shadow(o, (0.2 + lift) * p, (0.1 + lift * 0.8) * p, (0.15 + lift * 1.2) * p, 0.45);
    else shadow(o, 0.15 * p, 0.06 * p, 0.1 * p, 0.5);
    o.translate(x, y); o.rotate(a);
    o.beginPath(); o.ellipse(0, 0, R * (1 + lift * 0.4), R * (1 + lift * 0.4) * (flip ? 0.85 : 1), 0, 0, TAU);
    o.fillStyle = flip ? '#d9ceb4' : '#ebe1c9'; o.fill();
    noShadow(o);
    if (!flip) { o.beginPath(); o.arc(-R * 0.3, R * 0.1, R * 0.5, 0, Math.PI); o.strokeStyle = 'rgba(70,108,140,.28)'; o.lineWidth = 0.6; o.stroke(); }
    o.restore();
  }

  // ---------- 主循环 ----------
  let last = 0, lastTooth = 0, frames = 0;
  const AUTO_W = TAU * 0.55;
  function step(dt, now) {
    // 拖动是在指针事件里改的角度，所以“上一帧在哪”要自己记着
    const before = st.prev ?? pos();
    if (st.drag) {
      // 拖动时直接跟手；速度用最近一小段算，松手时带一点惯性
    } else if (st.auto) {
      const target = AUTO_W * (1 + 0.07 * Math.sin(st.th));          // 人手摇，一圈里快慢有一点起伏
      st.w += (target - st.w) * (1 - Math.exp(-dt / 0.4));
      st.th += st.w * dt;
    } else if (st.wig) {
      // 开场让摇柄轻轻晃一下，告诉人它能动；幅度很小，不会碰到孔
      const k = (now - st.wigAt) / 1.1;
      if (k >= 1) { st.wig = 0; st.th = st.wigBase; }
      else st.th = st.wigBase + Math.sin(k * Math.PI) * Math.sin(k * TAU * 1.5) * 0.16;
    } else {
      st.w *= Math.exp(-dt / 0.3);
      if (Math.abs(st.w) < 0.03) st.w = 0;
      st.th += st.w * dt;
    }
    const du = pos() - before;
    if (Math.abs(du) > 0 && Math.abs(du) < 14) {
      const list = crossings(before, du, []);
      if (list.length) {
        const live = AC && AC.state === 'running' && soundOn;
        fire(live ? SYN : null, list, live ? AC.currentTime + 0.06 : 0, dt, null);
        if (live) st.notes += list.length;
        for (const e of list) { hit[e.h.r] = now - (1 - e.f) * dt; amp[e.h.r] = 1; }
      }
    }
    // 大齿轮的齿一个个咬过去，细碎地响
    const toothIdx = Math.floor(st.th / (TAU / 48));
    if (toothIdx !== lastTooth) {
      if (AC && AC.state === 'running' && soundOn && Math.abs(du) < 3) SYN.tick(AC.currentTime + 0.03, 0.004 + 0.004 * hash(toothIdx, 2));
      lastTooth = toothIdx;
    }
    if (SYN && SYN.rustle) SYN.rustle.setTargetAtTime(soundOn ? Math.min(0.018, Math.abs(du / Math.max(dt, 1e-3)) * 0.0032) : 0, AC.currentTime, 0.06);
    st.cranked += Math.abs(du);
    st.prev = pos();
    if (st.cranked > 1.5 && !st.hintGone) { st.hintGone = true; hideHint(hintCrank); }
  }
  function draw(now) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(LA, 0, 0);
    sceneT(ctx);
    for (const c of CHADS) drawChad(ctx, c.x, c.y, c.a, c.flip, 0);
    drawStrip(ctx);
    const s = pos() * p;
    drawRoller(ctx, G.rollIn, s / (0.8 * p));
    drawRoller(ctx, G.rollOut, s / (0.8 * p));
    drawTeeth(ctx, now);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(LB, 0, 0);
    sceneT(ctx);
    drawGears(ctx);
    drawCrank(ctx);
    for (let i = FLY.length - 1; i >= 0; i--) {
      const f = FLY[i], k = (now - f.t0) / 0.55;
      if (k >= 1) { CHADS.push({ x: f.x1, y: f.y1, a: f.a, flip: f.flip }); if (CHADS.length > 90) CHADS.shift(); FLY.splice(i, 1); continue; }
      const e = 1 - (1 - k) ** 2, lift = Math.sin(k * Math.PI) * 0.9;
      drawChad(ctx, f.x0 + (f.x1 - f.x0) * e, f.y0 + (f.y1 - f.y0) * e, f.a + k * 5, f.flip, lift);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(LV, 0, 0);
  }
  function loop(t) {
    requestAnimationFrame(loop);
    const now = t / 1000, dt = Math.min(0.05, last ? now - last : 0.016);
    last = now;
    if (!st.ready) return;
    step(dt, now);
    draw(now);
    frames++;
  }

  // ---------- 交互 ----------
  const hintCrank = $('#h-crank'), hintPunch = $('#h-punch');
  function placeHints() {
    const [gx, gy] = toScreen(...G.gear);
    const [kx, ky] = toScreen(G.gear[0] + Math.cos(st.th) * G.arm, G.gear[1] + Math.sin(st.th) * G.arm);
    const R = G.arm + 2.2 * p, a0 = Math.atan2(ky - gy, kx - gx) + 0.32, a1 = a0 + (PORT ? 0.95 : 1.35), S = 2 * (R + 40);
    const pt = (a, r = R) => [Math.cos(a) * r, Math.sin(a) * r];
    const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
    const tx = -Math.sin(a1), ty = Math.cos(a1), nx = Math.cos(a1), ny = Math.sin(a1), hl = 9;
    Object.assign(hintCrank.style, { left: gx + 'px', top: gy + 'px', width: S + 'px', height: S + 'px' });
    const svg = hintCrank.querySelector('svg');
    svg.setAttribute('viewBox', `${-S / 2} ${-S / 2} ${S} ${S}`);
    svg.querySelector('.arc').setAttribute('d', `M${x0.toFixed(1)} ${y0.toFixed(1)}A${R.toFixed(1)} ${R.toFixed(1)} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`);
    svg.querySelector('.head').setAttribute('d', `M${(x1 - tx * hl + nx * hl * 0.6).toFixed(1)} ${(y1 - ty * hl + ny * hl * 0.6).toFixed(1)}L${x1.toFixed(1)} ${y1.toFixed(1)}L${(x1 - tx * hl - nx * hl * 0.6).toFixed(1)} ${(y1 - ty * hl - ny * hl * 0.6).toFixed(1)}`);
    const [lx, ly] = pt((a0 + a1) / 2, R + 24), lab = hintCrank.querySelector('span');
    lab.style.left = (S / 2 + lx) + 'px'; lab.style.top = (S / 2 + ly) + 'px';
    const [hx, hy] = toScreen(PORT ? xr + 9 * p : xr + 24 * p, PORT ? stripTop - 0.2 * p : stripTop - 1.6 * p);
    hintPunch.style.left = (PORT ? clamp(hx, 120, W - 120) : hx) + 'px';
    hintPunch.style.top = (PORT ? hy - 26 : hy - 22) + 'px';
    if (PORT) { hintPunch.style.transform = 'translate(-50%, 0) rotate(0deg)'; }
  }
  const inStrip = (x, y) => y > stripTop && y < stripBot;
  const inMachine = x => x > G.box[0] && x < G.box[2];
  function local(e) {
    const r = cv.getBoundingClientRect();
    return toScene(e.clientX - r.left, e.clientY - r.top);
  }
  cv.addEventListener('pointerdown', e => {
    if (!st.ready) return;
    ensureAudio();
    const [x, y] = local(e);
    const dg = Math.hypot(x - G.gear[0], y - G.gear[1]);
    const kx = G.gear[0] + Math.cos(st.th) * G.arm, ky = G.gear[1] + Math.sin(st.th) * G.arm;
    if (dg < G.arm + 1.8 * p || Math.hypot(x - kx, y - ky) < 2.4 * p) {
      st.drag = { kind: 'crank', a: Math.atan2(y - G.gear[1], x - G.gear[0]), hist: [[performance.now(), st.th]] };
      setAuto(false);
    } else if (inStrip(x, y)) {
      st.drag = { kind: 'strip', x0: x, y0: y, x, t: performance.now(), moved: false, hist: [[performance.now(), st.th]] };
    } else return;
    st.wig = 0; st.w = 0;
    cv.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  cv.addEventListener('pointermove', e => {
    const d = st.drag;
    if (!d) {
      if (!st.ready || e.pointerType !== 'mouse') return;
      const [x, y] = local(e);
      const kx = G.gear[0] + Math.cos(st.th) * G.arm, ky = G.gear[1] + Math.sin(st.th) * G.arm;
      const overCrank = Math.hypot(x - G.gear[0], y - G.gear[1]) < G.arm + 1.8 * p || Math.hypot(x - kx, y - ky) < 2.4 * p;
      cv.style.cursor = overCrank ? 'grab' : inStrip(x, y) ? (inMachine(x) ? 'ew-resize' : 'pointer') : '';
      return;
    }
    const [x, y] = local(e);
    if (d.kind === 'crank') {
      if (Math.hypot(x - G.gear[0], y - G.gear[1]) < 1.2 * p) return;        // 太靠近轴心，角度不稳
      const a = Math.atan2(y - G.gear[1], x - G.gear[0]);
      let da = a - d.a;
      da -= Math.round(da / TAU) * TAU;
      d.a = a;
      st.th += clamp(da, -1.2, 1.2);
      cv.style.cursor = 'grabbing';
    } else {
      if (!d.moved && Math.hypot(x - d.x0, y - d.y0) > 6) d.moved = true;
      if (d.moved) { st.th -= (x - d.x) / p * TAU / COLS_PER_REV; cv.style.cursor = 'grabbing'; }
      d.x = x;
    }
    const t = performance.now();
    d.hist.push([t, st.th]);
    while (d.hist.length > 2 && t - d.hist[0][0] > 90) d.hist.shift();
  });
  function endDrag(e) {
    const d = st.drag;
    if (!d) return;
    st.drag = null;
    cv.style.cursor = '';
    const [t0, th0] = d.hist[0], t1 = performance.now();
    st.w = t1 - t0 > 8 ? clamp((st.th - th0) / ((t1 - t0) / 1000), -TAU * 3, TAU * 3) : 0;
    if (t1 - d.hist[d.hist.length - 1][0] > 70) st.w = 0;                    // 停住再松手就不滑
    if (d.kind === 'strip' && !d.moved && e && e.type === 'pointerup') tap(d.x0, d.y0);
    if (st.cranked > 1) { hideHint(hintCrank); if (!st.punched && !st.punchShown) { st.punchShown = true; showHint(hintPunch, 7000); } }
  }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  // 点纸带：空格打孔，孔贴胶带，胶带再撕掉
  function tap(x, y) {
    if (inMachine(x)) return;
    const row = Math.floor((y - stripTop) / p - 1.7);
    if (row < 0 || row >= ROWS) return;
    const u = pos() + (x - xr) / p, P = PAT.cols;
    const c = ((Math.floor(u) % P) + P) % P, key = c * ROWS + row;
    const h = PAT.holes.get(key);
    const t = AC ? AC.currentTime + 0.01 : 0, live = AC && soundOn;
    if (!h) {
      PAT.holes.set(key, { c, r: row, dx: (hash(c, row + 99) - 0.5) * 0.1, patch: false, user: true });
      if (live) { SYN.punch(t); SYN.note(row, t + 0.16, 0.7); }
      // 冲下来的纸屑蹦到桌上
      const cx = x, cy = rowY(row), z = PROPS.chadZone;
      const tx = z ? z[0] + Math.random() * z[2] : x + (Math.random() - 0.5) * 6 * p;
      const ty = z ? z[1] + Math.random() * z[3] : (side < 0 ? stripBot + 2 * p + Math.random() * 3 * p : stripTop - 2 * p - Math.random() * 3 * p);
      FLY.push({ x0: cx, y0: cy, x1: tx, y1: ty, a: Math.random() * TAU, flip: Math.random() < 0.4, t0: performance.now() / 1000 });
    } else if (!h.patch) {
      h.patch = true;
      if (live) SYN.tape(t);
    } else {
      h.patch = false;
      if (live) { SYN.tape(t); SYN.note(row, t + 0.12, 0.6); }
    }
    PAT.edited = true;
    $('#reset').hidden = false;
    st.punched++;
    hideHint(hintPunch);
    renderStrip(); rebuildHoles();
  }

  function showHint(el, ms) { el.classList.add('on'); if (ms) setTimeout(() => el.classList.remove('on'), ms); }
  function hideHint(el) { el.classList.remove('on'); }

  const autoBtn = $('#auto'), sndBtn = $('#snd'), resetBtn = $('#reset');
  function setAuto(on) {
    st.auto = on;
    autoBtn.setAttribute('aria-pressed', String(on));
  }
  autoBtn.addEventListener('click', () => { ensureAudio(); st.wig = 0; setAuto(!st.auto); if (st.auto) hideHint(hintCrank); });
  sndBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    sndBtn.setAttribute('aria-pressed', String(soundOn));
    sndBtn.querySelector('span').textContent = soundOn ? '声音' : '静音';
    sndBtn.querySelector('.w').style.opacity = soundOn ? 1 : 0.15;
    ensureAudio();
    if (SYN) SYN.master.setTargetAtTime(soundOn ? 0.9 : 0, AC.currentTime, 0.06);
  });
  resetBtn.addEventListener('click', () => {
    PAT.holes = new Map([...PAT.orig].map(([k, h]) => [k, { ...h }]));
    PAT.edited = false; resetBtn.hidden = true;
    renderStrip(); rebuildHoles();
  });
  // 键盘：左右键摇，空格自己转
  cv.addEventListener('keydown', e => {
    if (!st.ready) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { ensureAudio(); setAuto(false); st.wig = 0; st.w = clamp(st.w + 1.8, -TAU * 2, TAU * 2); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { ensureAudio(); setAuto(false); st.wig = 0; st.w = clamp(st.w - 1.8, -TAU * 2, TAU * 2); e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'Enter') { ensureAudio(); st.wig = 0; setAuto(!st.auto); e.preventDefault(); }
    if (st.cranked > 0) hideHint(hintCrank);
  });

  // ---------- 启动 ----------
  let buildMs = 0;
  function build() {
    const t0 = performance.now();
    layout();
    LDs = LD;
    buildLayers();
    renderStrip();
    rebuildHoles();
    placeHints();
    buildMs = performance.now() - t0;
  }
  const cssReady = new Promise(res => {
    const l = $('#font-css');
    if (!l || l.media === 'all') return res();
    l.addEventListener('load', res); l.addEventListener('error', res);
    setTimeout(res, 2000);
  });
  const fontsReady = () => cssReady.then(() => Promise.all([
    document.fonts.load('700 100px Outfit', brand), document.fonts.load('400 100px "Noto Sans SC"', brand),
    document.fonts.load('600 40px Fraunces', brand.toUpperCase() + 'No.0123456789'), document.fonts.load('italic 600 40px Fraunces', brand),
    document.fonts.load('700 40px "Noto Serif SC"', brand + '曲目卡二十音纸带音乐盒小节一圈大调五声阶摇是'),
    document.fonts.load('500 20px "Noto Serif SC"', '曲目卡二十音纸带音乐盒小节一圈大调五声阶摇是'),
  ])).catch(() => {});
  // 字体最多等 2 秒：孔是按字形打的，开演以后就不再换
  Promise.race([fontsReady(), new Promise(r => setTimeout(r, 2000))]).then(() => {
    layout();
    buildPattern();
    build();
    st.ready = true;
    draw(performance.now() / 1000);
    requestAnimationFrame(() => document.body.classList.add('ready'));
    if (!REDUCED) setTimeout(() => { if (!st.cranked && !st.drag && !st.auto) { st.wig = 1; st.wigAt = performance.now() / 1000; st.wigBase = st.th; } }, 1500);
    setTimeout(() => { if (st.cranked < 1 && !st.auto) showHint(hintCrank); }, REDUCED ? 0 : 1300);
  });
  requestAnimationFrame(loop);

  let tmr, lastW = innerWidth, lastH = innerHeight;
  addEventListener('resize', () => {
    if (innerWidth === lastW && innerHeight === lastH) return;
    lastW = innerWidth; lastH = innerHeight;
    clearTimeout(tmr);
    tmr = setTimeout(() => {
      if (!st.ready) return;
      layout();
      if (CJK && PORT !== VERT) buildPattern();      // 中文横竖屏的打法不一样，转屏要重新打孔
      build();
    }, 160);
  });

  // 测试用的钩子
  window.__mb = { st, pos, get ac() { return AC && AC.state; }, get PAT() { return PAT; }, get SH() { return SH; }, crossings, renderOffline, makeSynth, MIDI, NAMES, ROWS, get frames() { return frames; }, get buildMs() { return buildMs; },
    geom: () => ({ p, xr, stripTop, stripBot, Lx, Ly, PORT, gear: G.gear, arm: G.arm, toScreen }) };
})();
</script>
</body>
</html>
