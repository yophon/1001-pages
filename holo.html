<link id="font-css" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@900&family=Syne:wght@600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
  :root {
    --bg: #0b0b0d;
    --panel: #151518;
    --line: #26262b;
    --text: #ececef;
    --muted: #9a9aa3;
    --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --syne: Syne, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
    /* 页脚：黑卡纸一样的印张，银色的字，印刷四色只在小地方露一点 */
    --f-bg: #0c0b11;
    --f-text: #ebe9f2;
    --f-muted: #8f8c9e;
    --f-faint: #5c5969;
    --f-line: #1d1b25;
    --c: #00a0e9;
    --m: #e4007f;

    --holo: linear-gradient(100deg, #ff9ac1, #ffd98a 22%, #a6f5c8 44%, #8fd2ff 64%, #c3a6ff 84%, #ff9ac1);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.7 var(--sans); }

  /* 角落的页码，点了回目录；用反色混合，深浅底上都看得见 */

  .folio:hover, .folio:focus-visible { opacity: 1; }

  /* ---------- 页脚 ---------- */
  .foot { background: var(--f-bg); color: var(--f-text); border-top: 1px solid var(--f-line); }
  .foot-top {
    display: grid; grid-template-columns: minmax(300px, 1.6fr) repeat(3, minmax(120px, 1fr)); gap: 40px 48px;

  .brand .name small { font: 500 12px/1 var(--mono); letter-spacing: .16em; color: var(--f-muted); }
  .brand .tag { margin: 14px 0 26px; color: var(--f-muted); font-size: 14px; max-width: 34ch; text-wrap: pretty; }
  .notify label { display: block; font: 500 11.5px/1 var(--mono); letter-spacing: .12em; color: var(--f-faint); margin-bottom: 10px; }
  .notify .row { display: flex; max-width: 360px; border: 1px solid #2a2733; border-radius: 999px; padding: 4px; transition: border-color .2s; }
  .notify .row:focus-within { border-color: #4a4560; }
  .notify input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--f-text); font: 14px var(--sans); padding: 6px 12px; }
  .notify input::placeholder { color: var(--f-faint); }
  .notify button { font: 600 13px/1 var(--syne); letter-spacing: .02em; color: #0c0b11; background: var(--holo); background-size: 200% 100%; border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer; transition: background-position .6s; }
  .notify button:hover { background-position: 100% 0; }
  .notify .ok { margin: 10px 0 0; font-size: 12.5px; color: var(--f-muted); }
  .col h3 { display: flex; align-items: center; gap: 9px; margin: 4px 0 14px; font: 500 11.5px/1 var(--mono); letter-spacing: .14em; color: var(--f-faint); }
  .col h3 i { width: 8px; height: 8px; flex: none; }
  .col h3 .c { background: var(--c); } .col h3 .m { background: var(--m); } .col h3 .y { background: var(--y); }
  .col a { display: block; color: var(--f-text); opacity: .84; text-decoration: none; font-size: 14.5px; padding: 3px 0; }
  .col a:hover { opacity: 1; }

  .stage { position: relative; background: #0c0b10; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .stage canvas { display: block; width: 100%; outline: none; background: #0c0b10; }   /* 和入场前那一帧的印张同色，画面还没出来时不会先黑一块 */
  .stage canvas:focus-visible { box-shadow: inset 0 0 0 2px #6d64a8; }
  .read { position: absolute; font: 11.5px/1.4 var(--mono); letter-spacing: .06em; color: var(--f-muted); white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; transition: opacity .4s; }
  .read b { font-weight: 500; color: var(--f-text); }

  .foot-legal {

  [hidden] { display: none !important; }

  @media (max-width: 760px) {
    .foot-top { grid-template-columns: 1fr 1fr 1fr; padding-top: 48px; gap: 32px 20px; }

  }
  @media (max-width: 420px) {
    .foot-top { grid-template-columns: 1fr 1fr; }

</style>

<body>

<footer class="foot">
  <div class="foot-top">
    <div class="brand">

<script>
  const $ = s => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
  const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
  // 品牌名默认 Lumen，网址加 ?name=星河 这样的参数可以换
  const brand = (new URLSearchParams(location.search).get('name') || '').trim().slice(0, 16) || 'Lumen';
  $('#f-name').textContent = brand;
  document.querySelectorAll('.bn').forEach(b => { b.textContent = brand; });
  const MONO = '"IBM Plex Mono", Consolas, "Microsoft YaHei", monospace';
  const BRAND = px => `800 ${px}px Syne, "Noto Sans SC", "Microsoft YaHei", sans-serif`;
  // 固定种子的随机数：条码、扭索纹每次长得一样
  function seeded(s) { return () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  const stage = $('#stage'), glc = $('#gl'), readEl = $('#read');

  /* ---------- 构图：透视相机正对着卡片，世界单位里卡片高 1 ---------- */
  const TANF = Math.tan(15 * Math.PI / 180);   // 竖直视角 30°：倾斜看得出透视，又不会把卡拉变形
  let W, H, DPR, mobile, CA, cardW, cardH, CY, DIST, YC, HALF, RAD, TW, TH;
  function layout() {
    W = stage.clientWidth;
    DPR = Math.min(devicePixelRatio || 1, 2);
    mobile = W < 680;
    if (mobile) {   // 手机：竖着的标准卡比例，卡占满宽度，下面留出色条和版边字
      CA = 63 / 88;
      cardW = Math.min(W - 76, 340);
      cardH = cardW / CA;
      CY = 46 + cardH / 2;
      H = Math.round(cardH + 140);
    } else {        // 桌面：宽幅卡
      CA = 1.8;
      H = Math.round(clamp(W * 0.56, 420, 760));
      cardH = H * 0.72;
      cardW = cardH * CA;
      if (cardW > W * 0.8) { cardW = W * 0.8; cardH = cardW / CA; }
      CY = H / 2 - 10;
    }
    DIST = H / (cardH * 2 * TANF);
    YC = (1 - CY / H * 2) * DIST * TANF;
    HALF = [CA / 2, 0.5];
    RAD = 0.048 * Math.min(CA, 1);   // 卡角圆角：短边的 4.8%，和真卡一样
    // 卡面贴图：比屏幕上的卡再密一点，最长边不超过 2048
    let tw = clamp(cardW * DPR * 1.25, 1024, 2048), th = tw / CA;
    if (th > 2048) { th = 2048; tw = th * CA; }
    if (Math.max(tw, th) < 1024) { const k = 1024 / Math.max(tw, th); tw *= k; th *= k; }
    TW = Math.round(tw);
    TH = Math.round(th);
    glc.style.height = H + 'px';
    glc.width = Math.round(W * DPR);
    glc.height = Math.round(H * DPR);
    // 读数放在卡片右下角外面
    const x0 = (W - cardW) / 2, y1 = CY + cardH / 2;
    Object.assign(readEl.style, mobile
      ? { left: x0 + 'px', right: '', top: (y1 + 50) + 'px', textAlign: 'left' }
      : { left: '', right: x0 + 'px', top: (y1 + 24) + 'px', textAlign: 'right' });
  }

  /* ---------- 卡面：每一面画六张图，在着色器里合起来 ----------
     art  油墨的颜色
     cov  油墨覆盖率：0 是露出镭射膜，1 是完全盖住
     foil 烫印（品牌名、小星星），glit 碎钻边框，holo 星芒底纹（背面是防伪标），emb 凸起的高度 */
  const rr = (o, x, y, w, h, r) => { o.beginPath(); o.roundRect(x, y, w, h, Math.max(0, r)); };
  function ring(o, a, ra, b, rb, color) {   // 圆角矩形环：外圈内缩 a，内圈内缩 b
    o.fillStyle = color;
    o.beginPath();
    o.roundRect(a, a, TW - 2 * a, TH - 2 * a, Math.max(0, ra));
    o.roundRect(b, b, TW - 2 * b, TH - 2 * b, Math.max(0, rb));
    o.fill('evenodd');
  }
  function star4(o, x, y, r) {   // 四角星，边是往里凹的弧
    o.beginPath();
    o.moveTo(x, y - r);
    o.quadraticCurveTo(x, y, x + r, y);
    o.quadraticCurveTo(x, y, x, y + r);
    o.quadraticCurveTo(x, y, x - r, y);
    o.quadraticCurveTo(x, y, x, y - r);
    o.fill();
  }
  function fitBrand(o, text, maxW, maxH) {
    o.font = BRAND(100);
    const m = o.measureText(text);
    const w = m.actualBoundingBoxLeft + m.actualBoundingBoxRight, h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
    const k = Math.min(maxW / Math.max(w, 1), maxH / Math.max(h, 1));
    return { px: 100 * k, w: w * k, h: h * k, left: m.actualBoundingBoxLeft * k, asc: m.actualBoundingBoxAscent * k };
  }
  function drawBrand(os, text, cx, cy, f) {   // 按字形的实际外框居中
    for (const o of os) {
      o.font = BRAND(f.px);
      o.textAlign = 'left';
      o.textBaseline = 'alphabetic';
      o.fillStyle = '#fff';
      o.fillText(text, cx - f.w / 2 + f.left, cy - f.h / 2 + f.asc);
    }
  }
  function both(A, V, color, fn) {   // 同一笔油墨：颜色画进 art，覆盖率画进 cov
    A.fillStyle = A.strokeStyle = color;
    V.fillStyle = V.strokeStyle = '#fff';
    fn(A);
    fn(V);
  }
  function mono(o, px, sp) {
    o.font = `500 ${px}px ${MONO}`;
    o.letterSpacing = sp + 'px';
    o.textBaseline = 'top';
  }

  function drawFront(C) {
    const { art: A, cov: V, foil: F, glit: G, holo: Hh, emb: E } = C;
    const s = Math.min(TW, TH) / 100, R = 4.8 * s, port = TH > TW;
    A.fillStyle = '#0c0a17';
    A.fillRect(0, 0, TW, TH);
    V.fillStyle = '#fff';
    V.fillRect(0, 0, TW, TH);
    // 碎钻边框：外面留一道很细的深色边，像真卡裁出来的样子
    const b0 = 1.05 * s, b1 = 6.1 * s;
    ring(G, b0, R - b0, b1, R - b1, '#fff');
    ring(V, b0, R - b0, b1, R - b1, '#000');
    // 星芒底纹：中间油墨薄、镭射透出来最多，四周压暗
    const fi = 6.6 * s, fr = Math.max(R - fi, 1.4 * s), fw = TW - 2 * fi, fh = TH - 2 * fi;
    const cx = TW / 2, cy = port ? TH * 0.47 : TH / 2;
    rr(Hh, fi, fi, fw, fh, fr);
    Hh.fillStyle = '#fff';
    Hh.fill();
    const rad = Math.hypot(fw, fh) / 2;
    V.save();
    rr(V, fi, fi, fw, fh, fr);
    V.clip();
    let g = V.createRadialGradient(cx, cy, 0, cx, cy, rad);
    g.addColorStop(0, '#4a4a4a');
    g.addColorStop(0.35, '#6a6a6a');
    g.addColorStop(0.8, '#c4c4c4');
    g.addColorStop(1, '#dcdcdc');
    V.fillStyle = g;
    V.fillRect(0, 0, TW, TH);
    // 印一圈放射状的深色条：镭射在条里暗一些，星芒更像一道道光
    const N = 44;
    g = V.createRadialGradient(cx, cy, 0, cx, cy, rad);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.12, 'rgba(255,255,255,0)');
    g.addColorStop(0.3, 'rgba(255,255,255,.2)');
    g.addColorStop(1, 'rgba(255,255,255,.34)');
    V.fillStyle = g;
    for (let i = 0; i < N; i += 2) {
      const a0 = i / N * Math.PI * 2, a1 = (i + 1) / N * Math.PI * 2;
      V.beginPath();
      V.moveTo(cx, cy);
      V.lineTo(cx + Math.cos(a0) * rad * 1.2, cy + Math.sin(a0) * rad * 1.2);
      V.lineTo(cx + Math.cos(a1) * rad * 1.2, cy + Math.sin(a1) * rad * 1.2);
      V.closePath();
      V.fill();
    }
    V.restore();
    A.save();
    rr(A, fi, fi, fw, fh, fr);
    A.clip();
    g = A.createRadialGradient(cx, cy, 0, cx, cy, rad);
    g.addColorStop(0, '#3d2f86');
    g.addColorStop(0.45, '#1d1745');
    g.addColorStop(1, '#0b0a18');
    A.fillStyle = g;
    A.fillRect(0, 0, TW, TH);
    A.restore();
    // 底纹边上一道白线、往里一道淡紫的细线
    both(A, V, '#efedf8', o => { o.lineWidth = 0.34 * s; rr(o, fi, fi, fw, fh, fr); o.stroke(); });
    both(A, V, '#6f68a8', o => { o.lineWidth = 0.16 * s; rr(o, fi + 1.25 * s, fi + 1.25 * s, fw - 2.5 * s, fh - 2.5 * s, fr - 1.25 * s); o.stroke(); });
    // 角上的小字
    const pad = fi + 3.3 * s, ts = (port ? 3.1 : 2.35) * s;
    both(A, V, '#efedf8', o => {
      mono(o, ts, ts * 0.16);
      o.textAlign = 'left';
      o.fillText(port ? '镭射印社' : '镭射印社 · 第 03 季', pad, pad);
      o.textAlign = 'right';
      o.fillText(port ? 'No. 0042' : 'No. 0042 / 2000', TW - pad, pad);
      o.textAlign = 'left';
      o.textBaseline = 'bottom';
      o.fillText(port ? '第 03 季 · 限定' : '宽幅镭射卡 · 限定', pad, TH - pad + ts * 0.2);
      o.letterSpacing = '0px';
    });
    // 右下角三颗烫印小星
    for (const o of [F, E]) {
      o.fillStyle = '#fff';
      for (let i = 0; i < 3; i++) star4(o, TW - pad - ts * 0.55 - i * ts * 1.45, TH - pad - ts * 0.5, ts * 0.62);
    }
    // 品牌名：烫印箔，微微凸起
    const f = fitBrand(F, brand, fw * 0.84, fh * (port ? 0.3 : 0.44));
    drawBrand([F, E], brand, cx, cy, f);
    return { ctr: [cx / TW, cy / TH] };
  }

  let guilloche = null;
  async function drawGuilloche(id) {
    const s = Math.min(TW, TH) / 100, port = TH > TW, fi = 2.6 * s;
    const cx = TW / 2, cy = port ? TH * 0.36 : TH * 0.47, R0 = port ? TW * 0.36 : TH * 0.36;
    const c = canvas(TW, TH), A = c.getContext('2d', { willReadFrequently: true });   // 和卡面画布一样放在内存里，贴过去时不用从显卡读回来
    // 两圈：外圈 18 瓣的花边，内圈 30 瓣的细网，每圈几十条线相位一点点错开，交叠出网纹
    A.lineWidth = 0.11 * s;
    for (const [n, base, amp, amp2, lobes, col] of [[30, 0.8, 0.13, 0.035, 18, 'rgba(150,165,235,.34)'], [26, 0.57, 0.06, 0.03, 30, 'rgba(185,170,245,.3)']]) {
      A.strokeStyle = col;
      for (let i = 0; i < n; i++) {
        if (i % 14 === 13) { await nextFrame(); if (id !== buildId) return null; }   // 画十几条让出一帧
        const ph = i / n * Math.PI * 2 / lobes;
        A.beginPath();
        for (let k = 0; k <= 1440; k++) {
          const t = k / 1440 * Math.PI * 2;
          const r = R0 * (base + amp * Math.cos(lobes * (t + ph)) + amp2 * Math.cos(lobes * 3 * t - 2 * lobes * ph));
          const x = cx + Math.cos(t) * r, y = cy + Math.sin(t) * r;
          k ? A.lineTo(x, y) : A.moveTo(x, y);
        }
        A.stroke();
      }
    }
    // 横版：左右两条波纹带
    if (!port) {
      A.lineWidth = 0.11 * s;
      for (let j = 0; j < 14; j++) {
        A.strokeStyle = 'rgba(120,140,230,.32)';
        for (const side of [-1, 1]) {
          A.beginPath();
          const xs = side < 0 ? fi + 4 * s : cx + R0 * 1.02, xe = side < 0 ? cx - R0 * 1.02 : TW - fi - 4 * s;
          for (let x = xs; x <= xe; x += s * 0.5) {
            const y = TH * 0.86 + Math.sin(x / (s * 5.2) + j * 0.42) * s * 1.6 + (j - 7) * s * 0.5;
            x === xs ? A.moveTo(x, y) : A.lineTo(x, y);
          }
          A.stroke();
        }
      }
    }
    c.key = `${TW}x${TH}`;
    return c;
  }
  function drawBack(C) {
    const { art: A, cov: V, foil: F, glit: G, holo: Hh, emb: E } = C;
    const s = Math.min(TW, TH) / 100, R = 4.8 * s, port = TH > TW;
    const rnd = seeded(42);
    A.fillStyle = '#0e1330';
    A.fillRect(0, 0, TW, TH);
    V.fillStyle = '#fff';
    V.fillRect(0, 0, TW, TH);
    // 背面只留一道细细的碎钻边
    const b0 = 1.05 * s, b1 = 2.6 * s;
    ring(G, b0, R - b0, b1, R - b1, '#fff');
    ring(V, b0, R - b0, b1, R - b1, '#000');
    const fi = 2.6 * s;
    let g = A.createLinearGradient(0, 0, TW, TH);
    g.addColorStop(0, '#141a3d');
    g.addColorStop(1, '#0a0e24');
    A.fillStyle = g;
    rr(A, fi, fi, TW - 2 * fi, TH - 2 * fi, R - fi);
    A.fill();
    both(A, V, '#c9cff0', o => { o.lineWidth = 0.22 * s; rr(o, fi + 1.6 * s, fi + 1.6 * s, TW - 2 * fi - 3.2 * s, TH - 2 * fi - 3.2 * s, R - fi - 1.6 * s); o.stroke(); });
    // 扭索纹：几十条相位错开的玫瑰线，像钞票上的底纹。它不随品牌名和字体变，按尺寸缓存一张（建卡前分几帧画好），改名时不用重画
    const cx = TW / 2, cy = port ? TH * 0.36 : TH * 0.47, R0 = port ? TW * 0.36 : TH * 0.36;
    A.drawImage(guilloche, 0, 0);
    // 中间一圈深色衬底，再烫一个小号的品牌名
    g = A.createRadialGradient(cx, cy, 0, cx, cy, R0 * 0.5);
    g.addColorStop(0, '#0e1330');
    g.addColorStop(0.8, '#0e1330');
    g.addColorStop(1, 'rgba(14,19,48,0)');
    A.fillStyle = g;
    A.beginPath(); A.arc(cx, cy, R0 * 0.5, 0, 7); A.fill();
    const f = fitBrand(F, brand, R0 * 0.66, R0 * 0.2);
    drawBrand([F, E], brand, cx, cy - R0 * 0.02, f);
    // 防伪微缩字：绕着品牌名一圈，正常大小看只是一道细线
    const ring1 = `${brand.toUpperCase()} · 镭射印社 · No. 0042 · `;
    A.fillStyle = '#b9c0ea';
    A.font = `500 ${1.05 * s}px ${MONO}`;
    A.textAlign = 'center';
    A.textBaseline = 'middle';
    const rr1 = R0 * 0.4, step = 1.05 * s * 0.74 / rr1, n1 = Math.floor(Math.PI * 2 / step);
    for (let i = 0; i < n1; i++) {
      const ch = ring1[i % ring1.length], a = i * step - Math.PI / 2;
      A.save(); A.translate(cx + Math.cos(a) * rr1, cy + Math.sin(a) * rr1); A.rotate(a + Math.PI / 2); A.fillText(ch, 0, 0); A.restore();
    }
    A.beginPath(); A.arc(cx, cy, rr1 + 1.1 * s, 0, 7); A.arc(cx, cy, rr1 - 1.1 * s, 0, 7);
    A.strokeStyle = '#b9c0ea'; A.lineWidth = 0.1 * s; A.stroke();
    // 编号和序列号
    const pad = fi + 5 * s;
    both(A, V, '#e7e9fb', o => {
      o.textAlign = 'left';
      o.letterSpacing = '0px';
      if (port) {
        let y = TH * 0.66;
        mono(o, 2.9 * s, 0.5 * s); o.fillText('镭射印社 出品', pad, pad);
        o.font = `700 ${12 * s}px Syne, sans-serif`; o.letterSpacing = '0px'; o.textBaseline = 'top'; o.fillText('0042', pad, y);
        mono(o, 3.4 * s, 0.4 * s); o.fillText('/ 2000', pad + o.measureText('0042').width * 0 + 34 * s, y + 6.2 * s);
        y += 15 * s;
        mono(o, 2.7 * s, 0.35 * s);
        o.fillText('序列号  LM-26S3-0042-Q7', pad, y);
        o.fillText('限量 2000 张 · 第 03 季', pad, y + 4.6 * s);
      } else {
        mono(o, 2.1 * s, 0.4 * s); o.fillText('镭射印社 出品 · 第 03 季', pad, pad);
        o.font = `700 ${11 * s}px Syne, sans-serif`; o.letterSpacing = '0px'; o.textBaseline = 'top'; o.fillText('0042', pad, TH * 0.3);
        mono(o, 2.6 * s, 0.3 * s); o.fillText('/ 2000', pad + 2 * s, TH * 0.3 + 13 * s);
        mono(o, 2 * s, 0.3 * s);
        o.fillText('序列号  LM-26S3-0042-Q7', pad, TH * 0.3 + 19 * s);
        o.fillText('限量 2000 张，本张第 0042 张', pad, TH * 0.3 + 23 * s);
      }
    });
    // 条码：随便的粗细，固定种子
    const bx = port ? pad : TW - pad - 26 * s, by = port ? TH - pad - 13 * s : TH * 0.6, bw = 26 * s, bh = (port ? 8 : 9) * s;
    both(A, V, '#e7e9fb', o => {
      let x = bx;
      const r2 = seeded(7);
      while (x < bx + bw) { const w = (0.25 + Math.floor(r2() * 4) * 0.22) * s; if (r2() > 0.42) o.fillRect(x, by, w, bh); x += w + 0.22 * s; }
      mono(o, 1.6 * s, 0.35 * s);
      o.textAlign = 'left';
      o.fillText('2 026003 004207', bx, by + bh + 1.2 * s);
    });
    // 防伪标：一枚圆形的镭射贴，自己带一个径向光栅，边上一圈压出来的字
    const sr = port ? TW * 0.16 : TH * 0.13;
    const sx = port ? TW - pad - sr : TW - pad - sr, sy = port ? TH - pad - sr : pad + sr + 2 * s;
    Hh.fillStyle = '#fff';
    Hh.beginPath(); Hh.arc(sx, sy, sr, 0, 7); Hh.fill();
    V.fillStyle = '#000';
    V.beginPath(); V.arc(sx, sy, sr, 0, 7); V.fill();
    A.fillStyle = '#20264d';
    A.beginPath(); A.arc(sx, sy, sr, 0, 7); A.fill();
    E.fillStyle = '#fff';
    E.strokeStyle = '#fff';
    E.lineWidth = 0.35 * s;
    E.beginPath(); E.arc(sx, sy, sr * 0.97, 0, 7); E.stroke();
    E.beginPath(); E.arc(sx, sy, sr * 0.62, 0, 7); E.stroke();
    E.font = `600 ${sr * 0.17}px ${MONO}`;
    E.textAlign = 'center';
    E.textBaseline = 'middle';
    const ring2 = '正品 · AUTHENTIC · 镭射印社 · ', step2 = sr * 0.17 * 0.82 / (sr * 0.8), n2 = Math.floor(Math.PI * 2 / step2);
    for (let i = 0; i < n2; i++) {
      const a = i * step2 - Math.PI / 2;
      E.save(); E.translate(sx + Math.cos(a) * sr * 0.8, sy + Math.sin(a) * sr * 0.8); E.rotate(a + Math.PI / 2); E.fillText(ring2[i % ring2.length], 0, 0); E.restore();
    }
    star4(E, sx, sy, sr * 0.42);
    return { ctr: [sx / TW, sy / TH] };
  }

  // 可分离的方框模糊，原地改。竖向那一遍也按行往下推（每列一个滑动和），内存是连续读的，比逐列扫快很多
  function blur(a, w, h, r, tmp) {
    const inv = 1 / (2 * r + 1), line = new Float32Array(w);
    for (let y = 0; y < h; y++) {
      const o = y * w;
      let s = a[o] * (r + 1);
      for (let x = 1; x <= r; x++) s += a[o + Math.min(x, w - 1)];
      for (let x = 0; x < w; x++) { line[x] = s * inv; s += a[o + Math.min(x + r + 1, w - 1)] - a[o + Math.max(x - r, 0)]; }
      a.set(line, o);
    }
    for (let x = 0; x < w; x++) { let s = a[x] * (r + 1); for (let y = 1; y <= r; y++) s += a[Math.min(y, h - 1) * w + x]; line[x] = s; }
    for (let y = 0; y < h; y++) {
      const o = y * w, add = Math.min(y + r + 1, h - 1) * w, sub = Math.max(y - r, 0) * w;
      for (let x = 0; x < w; x++) { tmp[o + x] = line[x] * inv; line[x] += a[add + x] - a[sub + x]; }
    }
    a.set(tmp);
  }
  // 分成十来小步，每步之间让出一帧，两倍屏上单步也只有二三十毫秒：画、读出来、打包、六遍模糊、叠起来
  const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
  let buildId = 0;
  async function makeFace(draw, id) {
    const C = {};
    for (const k of ['art', 'cov', 'foil', 'glit', 'holo', 'emb']) {
      C[k] = canvas(TW, TH).getContext('2d', { willReadFrequently: true });
      if (k !== 'art') { C[k].fillStyle = '#000'; C[k].fillRect(0, 0, TW, TH); }
    }
    const info = draw(C), step = async () => { await nextFrame(); return id === buildId; };
    if (!await step()) return null;
    const n = TW * TH, px = k => C[k].getImageData(0, 0, TW, TH).data;
    const art = px('art'), dc = px('cov'), df = px('foil'), dg = px('glit'), dh = px('holo'), de = px('emb');
    if (!await step()) return null;
    const mk = new Uint8Array(n * 4), hs = new Float32Array(n);
    for (let i = 0, j = 0; i < n; i++, j += 4) {
      mk[j] = df[j]; mk[j + 1] = dg[j]; mk[j + 2] = dh[j]; mk[j + 3] = dc[j];
      hs[i] = de[j] / 255;
    }
    // 凸起的轮廓：一道窄的斜边加一圈很缓的肩，各模糊三遍叠起来，存成浮点
    const s = Math.min(TW, TH) / 100, hb = hs.slice(), tmp = new Float32Array(n);
    const r1 = Math.max(1, Math.round(0.24 * s)), r2 = Math.max(2, Math.round(1.1 * s));
    for (const [a, r] of [[hs, r1], [hs, r1], [hs, r1], [hb, r2], [hb, r2], [hb, r2]]) {
      if (!await step()) return null;
      blur(a, TW, TH, r, tmp);
    }
    for (let i = 0; i < n; i++) hs[i] = hs[i] * 0.78 + hb[i] * 0.22;
    return { art: C.art.canvas, artPx: art, mk, hgt: hs, ctr: info.ctr, w: TW, h: TH };
  }

  /* ---------- 印张：卡片背后那张纸，留着裁切线、套准标记、色条和版边字 ---------- */
  let sheetCv;
  function drawSheet() {
    const c = canvas(W * DPR, H * DPR), o = c.getContext('2d', { willReadFrequently: true });
    o.scale(DPR, DPR);
    o.fillStyle = '#16151d';
    o.fillRect(0, 0, W, H);
    const x0 = (W - cardW) / 2, y0 = CY - cardH / 2, x1 = x0 + cardW, y1 = y0 + cardH;
    const ink = 'rgba(214,211,230,.46)';
    o.strokeStyle = ink;
    o.lineWidth = 0.8;
    const line = (a, b, c2, d) => { o.beginPath(); o.moveTo(a, b); o.lineTo(c2, d); o.stroke(); };
    const gap = 9, L = mobile ? 14 : 20;
    for (const [px, py, sx, sy] of [[x0, y0, -1, -1], [x1, y0, 1, -1], [x0, y1, -1, 1], [x1, y1, 1, 1]]) {
      line(px + sx * gap, py, px + sx * (gap + L), py);
      line(px, py + sy * gap, px, py + sy * (gap + L));
    }
    const reg = (x, y, r) => {   // 套准标记：圆圈加十字
      o.beginPath(); o.arc(x, y, r, 0, 7); o.stroke();
      o.beginPath(); o.arc(x, y, r * 0.45, 0, 7); o.stroke();
      line(x - r * 1.7, y, x + r * 1.7, y);
      line(x, y - r * 1.7, x, y + r * 1.7);
    };
    if (!mobile) { reg(x0 - 40, CY, 6.5); reg(x1 + 40, CY, 6.5); }
    if (y0 > 40) reg(W / 2, y0 - 24, 6);
    // 色条：四色实地、半色调，最后一格是镭射
    const sw = mobile ? 9 : 11, cols = ['#00a0e9', '#e4007f', '#ffe100', '#231815', '#7fcff4', '#f17fbf', '#fff07f', '#8a8584'];
    let bx = x0, by = y1 + (mobile ? 22 : 26);
    cols.forEach((col, i) => { o.fillStyle = col; o.globalAlpha = 0.82; o.fillRect(bx + i * (sw + 2), by, sw, sw); });
    const hg = o.createLinearGradient(bx + cols.length * (sw + 2), 0, bx + cols.length * (sw + 2) + sw * 3, 0);
    ['#ff9ac1', '#ffd98a', '#a6f5c8', '#8fd2ff', '#c3a6ff'].forEach((c2, i) => hg.addColorStop(i / 4, c2));
    o.fillStyle = hg;
    o.fillRect(bx + cols.length * (sw + 2), by, sw * 3, sw);
    o.globalAlpha = 1;
    // 版边字
    o.fillStyle = 'rgba(214,211,230,.5)';
    o.font = `500 ${mobile ? 9.5 : 10.5}px ${MONO}`;
    o.letterSpacing = '1.2px';
    o.textBaseline = 'middle';
    let slug = `${brand.toUpperCase()} 镭射印社  ·  ${mobile ? '' : '宽幅'}镭射卡 第 03 季  ·  印张 0042 / 2000`;
    // 右边还要放读数：放不下就换短的，再放不下就不写
    const sx = bx + cols.length * (sw + 2) + sw * 3 + 18, room = x1 - 290 - sx;
    if (!mobile && o.measureText(slug).width > room) slug = `${brand.toUpperCase()} 镭射印社  ·  印张 0042 / 2000`;
    if (!mobile && o.measureText(slug).width > room) slug = '';
    if (mobile) {   // 手机：版边字竖着排在左边
      o.save();
      o.translate(x0 / 2, y0 + cardH / 2);
      o.rotate(-Math.PI / 2);
      o.textAlign = 'center';
      o.fillText(slug, 0, 0);
      o.restore();
    } else {
      o.textAlign = 'left';
      o.fillText(slug, sx, by + sw / 2);
    }
    o.letterSpacing = '0px';
    sheetCv = c;
  }

  /* ---------- 着色器 ---------- */
  const VS = `#version 300 es
in vec2 a;
void main() { gl_Position = vec4(a, 0., 1.); }`;
  const FS = `#version 300 es
precision highp float;
precision highp sampler2D;
precision highp sampler2DArray;
out vec4 o;
uniform vec2 uRes, uHalf, uTex, uBoxS;
uniform float uTanF, uRad, uTh, uBackZ, uBoxI, uFillI, uEmb;
uniform vec3 uCam, uPos, uBox, uBoxU, uBoxV, uFill;
uniform vec4 uCtr;
uniform mat3 uRot;
uniform sampler2DArray uArt, uMask, uHgt;
uniform sampler2D uSheet, uSpec;

float sdRR(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
float h12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec3 h32(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yzz) * p3.zyx); }
float vn(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f); return mix(mix(h12(i), h12(i + vec2(1, 0)), f.x), mix(h12(i + vec2(0, 1)), h12(i + 1.), f.x), f.y); }
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + .03)) / (x * (2.43 * x + .59) + .14), 0., 1.); }

// 波长（纳米）对应的颜色，表是按 CIE 1931 配色函数算好的
vec3 spec(float lam) { float x = (lam - 380.) / 400.; return x > 0. && x < 1. ? texture(uSpec, vec2(x, .5)).rgb : vec3(0.); }
// 衍射光栅：h 是光线和视线在膜面上的投影之和，k 是光栅矢量（垂直于刻槽），d 是刻槽间距（纳米）。
// 沿 k 的分量决定反射回来的波长（一、二、三级），垂直 k 的分量偏离 0 越多越暗，sig 管这道反光带有多宽
vec3 grating(vec2 h, vec2 k, float d, float sig) {
  float u = abs(dot(h, k)) * d, w = dot(h, vec2(-k.y, k.x)) / sig;
  return (spec(u) + .5 * spec(u * .5) + .3 * spec(u / 3.)) * exp(-w * w);
}
// 灯：一根斜放的短灯管。从 p 沿 r 看出去能看到它多少：亮度从中线往两边、从中间往两头都是平滑衰减，倒影没有硬边；
// soft 是表面有多毛（世界单位），越毛倒影糊得越开、也越暗；斜着看灯管时也暗一些
float softbox(vec3 p, vec3 r, float soft) {
  vec3 n = cross(uBoxU, uBoxV);
  float dn = dot(r, n);
  if (abs(dn) < 1e-4) return 0.;
  float t = dot(uBox - p, n) / dn;
  if (t <= 0.) return 0.;
  vec2 c = vec2(dot(p + r * t - uBox, uBoxU), dot(p + r * t - uBox, uBoxV));
  vec2 sg = sqrt(uBoxS * uBoxS + soft * soft);
  vec2 e = exp(-c * c / (sg * sg));
  return e.x * e.y * uBoxS.y / sg.y * abs(dn);
}
vec3 sat(vec3 c, float k) { float l = dot(c, vec3(.2126, .7152, .0722)); return max(mix(vec3(l), c, k), 0.); }
// 屋子里其余的地方：很暗，上面稍亮
vec3 env(vec3 r) { return mix(vec3(.014, .013, .019), vec3(.07, .066, .08), smoothstep(-.5, .9, r.y)); }

vec3 face(vec2 uv, vec2 gx, vec2 gy, float layer, vec3 P, vec3 N, vec3 T, vec3 B, float fpx) {
  vec3 tuv = vec3(uv, layer);
  vec3 ink = textureGrad(uArt, tuv, gx, gy).rgb;
  vec4 mk = textureGrad(uMask, tuv, gx, gy);
  vec2 px = uv * uTex;
  // 凸起：贴图 y 朝下，卡面的 B 朝上
  vec2 ex = vec2(1.25 / uTex.x, 0.), ey = vec2(0., 1.25 / uTex.y);
  float hR = textureLod(uHgt, vec3(uv + ex, layer), 0.).r, hL = textureLod(uHgt, vec3(uv - ex, layer), 0.).r;
  float hU = textureLod(uHgt, vec3(uv - ey, layer), 0.).r, hD = textureLod(uHgt, vec3(uv + ey, layer), 0.).r;
  vec2 g = vec2(hR - hL, hU - hD) * uEmb;
  vec3 n = normalize(N - T * g.x - B * g.y);
  vec3 V = normalize(uCam - P), L = normalize(uBox - P), Lf = normalize(uFill - P);
  vec3 t1 = normalize(T - n * dot(n, T)), t2 = cross(n, t1);
  vec3 Hs = L + V, Hf = Lf + V;
  vec2 h = vec2(dot(Hs, t1), dot(Hs, t2)), hf = vec2(dot(Hf, t1), dot(Hf, t2));
  float hz = dot(Hs, n), hfz = dot(Hf, n);
  vec3 R = reflect(-V, n);
  // 镀铝的镭射膜本身是一面镜子：照出屋子和柔光箱
  vec3 mirror = env(R) + vec3(1., .97, .93) * softbox(P, R, .1) * uBoxI * 1.6;
  vec3 foil = mirror * .5;

  // 碎钻边框：几千粒朝向各不相同的小碎片，底子是暗的镜面，大多数角度下都是黑的。
  // 六成碎片是小光栅，角度刚好对上时亮成一种很饱和的颜色；其余是小镜子，正对灯时白光一闪。倾斜一点，亮的就整批换掉
  vec3 glare = vec3(0.);
  if (mk.g > .002) {
    float cs = 4.6;
    vec2 gp = px / cs, ip = floor(gp), fp = fract(gp);
    float F1 = 9., F2 = 9.;
    vec2 id1 = ip;
    for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
      vec2 oc = vec2(float(i), float(j));
      vec2 d = oc + .1 + .8 * h32(ip + oc).xy - fp;
      float dd = dot(d, d);
      if (dd < F1) { F2 = F1; F1 = dd; id1 = ip + oc; } else if (dd < F2) F2 = dd;
    }
    float gap = sqrt(F2) - sqrt(F1);
    vec3 r1 = h32(id1 + 17.3), r2 = h32(id1 + 3.7);
    vec2 tl = (r2.xy - .5) * .9;   // 朝向散得很开：同一时刻只有少数对得上
    vec2 hs = h - tl * hz, hfs = hf - tl * hfz;
    vec3 nf = normalize(n + t1 * tl.x + t2 * tl.y);
    vec3 Rf = reflect(-V, nf);
    vec3 gc = env(Rf) * (.1 + .3 * r1.z) + vec3(.002, .0018, .003);
    if (r2.z < .6) {
      float th = r1.x * 6.2832, dd = 1050. + 800. * r1.y;
      vec2 k = vec2(cos(th), sin(th));
      gc += sat(grating(hs, k, dd, .026) * uBoxI + grating(hfs, k, dd, .026) * .6 * uFillI, 1.9) * 2.8 * (.25 + .75 * r1.z * r1.z);   // 亮度也有高有低
    } else {
      gc += vec3(1., .97, .92) * (exp(-dot(hs, hs) / .004) * uBoxI + exp(-dot(hfs, hfs) / .004) * .4 * uFillI) * 5.;
    }
    gc += vec3(1., .97, .93) * softbox(P, Rf, .03) * uBoxI * 6.;   // 灯管的倒影扫过哪几粒，哪几粒就亮
    float seam = smoothstep(0., 1.2 * fpx / cs, gap);
    float far = smoothstep(cs * .6, cs * .3, fpx);   // 碎片小到一个像素以下时不闪，免得满是噪点
    vec3 gg = mix(vec3(.018, .016, .022), gc * (.7 + .3 * seam), far);

  // 灯：一块柔光箱在右上方。入场时从左边远处扫过来，冲过头一点再回到原位
  function lights() {
    const t = st.t, on = REDUCED ? 1 : smooth((t - 1.1) / 0.8);
    const u = REDUCED ? 1 : smooth((t - 1.2) / 2.3);
    const sweep = REDUCED ? 0 : (1 - u) * -5.2 + Math.sin(Math.PI * u) * 0.9;
    const p = st.ptr || [0, 0];
    // 扫的时候灯放低一点，倒影横穿品牌名，停下来时升到右上角
    const box = [(mobile ? 0.06 : HALF[0] * 0.32 + 0.22) + sweep - p[0] * 0.35, YC + 0.12 + 0.43 * u + p[1] * 0.2, DIST * 0.82];
    const ctr = [0, YC, 0], nb = norm(sub(ctr, box)), u0 = norm(cross([0, 1, 0], nb)), v0 = cross(nb, u0);
    const ca = Math.cos(0.38), sa = Math.sin(0.38);   // 灯管斜着放，倒影是一道斜的亮条
    const ub = u0.map((v, i) => v * ca + v0[i] * sa), vb = v0.map((v, i) => v * ca - u0[i] * sa);
    return {
      box, U: ub, V: vb, S: mobile ? [0.2, 0.008] : [0.32, 0.011], I: 0.1 + 0.9 * on,
      fill: [-HALF[0] - 0.7, YC - 0.95, DIST * 0.7], F: 0.15 + 0.4 * on,
    };
  }
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

  function render() {
    if (!glOK) return;
    const Lt = lights();
    gl.viewport(0, 0, glc.width, glc.height);
    gl.uniform2f(U.uRes, glc.width, glc.height);
    gl.uniform2f(U.uHalf, HALF[0], HALF[1]);
    gl.uniform2f(U.uTex, FACE.w, FACE.h);   // 用贴图自己的尺寸：改宽度时新贴图还没建好，先接着用旧的
    gl.uniform1f(U.uTanF, TANF);
    gl.uniform1f(U.uRad, RAD);
    gl.uniform1f(U.uTh, 0.0045);
    gl.uniform1f(U.uBackZ, -0.32);
    gl.uniform1f(U.uBoxI, Lt.I);
    gl.uniform1f(U.uFillI, Lt.F);
    gl.uniform1f(U.uEmb, Math.min(FACE.w, FACE.h) / 100 * 0.25);
    gl.uniform3f(U.uCam, 0, 0, DIST);
    gl.uniform3f(U.uPos, 0, YC - 0.06 * Math.max(0, -st.z), st.z);
    gl.uniform3fv(U.uBox, Lt.box);
    gl.uniform3fv(U.uBoxU, Lt.U);
    gl.uniform3fv(U.uBoxV, Lt.V);
    gl.uniform2fv(U.uBoxS, Lt.S);
    gl.uniform3fv(U.uFill, Lt.fill);
    gl.uniform4f(U.uCtr, FACE.ctr[0], FACE.ctr[1], BACK.ctr[0], BACK.ctr[1]);
    gl.uniformMatrix3fv(U.uRot, false, rotM());
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  // 读数：没碰过时是提示，碰过以后显示倾角和哪一面朝上
  let readAt = 0;
  function readout(now) {
    if (now - readAt < 100) return;
    readAt = now;
    const back = Math.cos(st.fl) < 0;
    const deg = v => { const d = Math.round(v * 1800 / Math.PI) / 10; return ((d >= 0 ? '+' : '−') + Math.abs(d).toFixed(1)).padStart(5, ' ') + '°'; };   // 用数字宽的空格补在前面，读数不跳
    const txt = !st.touched
      ? (mobile ? '左右拖动，或转动手机 · 轻点翻面' : '移动鼠标，看光怎么流过卡面 · 点一下翻面')
      : `倾角 <b>${deg(-st.rx)}</b> <b>${deg(st.ry)}</b> · ${back ? '背面' : '正面'}`;
    if (readEl.innerHTML !== txt) readEl.innerHTML = txt;
  }

  /* ---------- 交互 ---------- */
  const local = e => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const overCard = (x, y) => Math.abs(x - W / 2) < cardW / 2 + 6 && Math.abs(y - CY) < cardH / 2 + 6;
  stage.addEventListener('pointermove', e => {
    const [x, y] = local(e);
    if (e.pointerType === 'mouse') {
      st.ptr = [clamp((x - W / 2) / (cardW / 2 + 90), -1, 1), clamp((y - CY) / (cardH / 2 + 70), -1, 1)];
      st.touched = true;
      glc.style.cursor = overCard(x, y) ? 'pointer' : '';
    }
    const d = st.drag;
    if (d && d.id === e.pointerId) {
      const dx = x - d.x, dy = y - d.y;
      if (Math.hypot(dx, dy) > 8) d.moved = true;
      d.nx = clamp(dx / (cardW * 0.55), -1, 1);
      d.ny = clamp(dy / (cardH * 0.55), -1, 1);
      if (!d.mouse) st.touched = true;
    }
  });
  stage.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') st.ptr = null; });
  stage.addEventListener('pointerdown', e => {
    const [x, y] = local(e);
    st.drag = { id: e.pointerId, x, y, nx: 0, ny: 0, moved: false, mouse: e.pointerType === 'mouse', on: overCard(x, y) };
    if (e.pointerType !== 'mouse') stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointerup', e => {
    const d = st.drag;
    st.drag = null;
    if (d && d.id === e.pointerId && !d.moved && d.on) flip();
  });
  stage.addEventListener('pointercancel', () => { st.drag = null; });
  glc.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
  $('#flip').addEventListener('click', flip);

  // 陀螺仪：iPhone 要用户点一下才给权限；没有陀螺仪的设备不会收到带数值的事件，照常自己晃
  function onOri(e) {
    if (e.beta == null || e.gamma == null) return;
    const g = st.gyro, now = performance.now();
    if (!g || now - g.at > 1500) { st.gyro = { b0: e.beta, g0: e.gamma, b: e.beta, g: e.gamma, at: now }; gyroBtn.hidden = true; }
    else { g.b = e.beta; g.g = e.gamma; g.at = now; }
  }
  const gyroBtn = $('#gyro');
  addEventListener('deviceorientation', onOri);
  // 只有触屏设备、又要授权（iPhone）、过了一会儿还没收到数据，才把按钮露出来；桌面的 Chromium 也有这个函数，不能只看它
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function' && matchMedia('(pointer: coarse)').matches) {
    setTimeout(() => { if (!st.gyro) gyroBtn.hidden = false; }, 1200);
    gyroBtn.addEventListener('click', () => {
      DeviceOrientationEvent.requestPermission()
        .then(r => { if (r === 'granted') gyroBtn.hidden = true; else gyroBtn.textContent = '陀螺仪没有授权'; })
        .catch(() => { gyroBtn.textContent = '陀螺仪用不了'; });
    });
  }

  $('#notify').addEventListener('submit', e => { e.preventDefault(); $('#ok').hidden = false; });

  // 没有 WebGL2：画一张静止的卡，镭射用一道固定的彩虹渐变代替
  function fallback() {
    const o = glc.getContext('2d');
    if (!o) return;
    o.setTransform(DPR, 0, 0, DPR, 0, 0);
    o.drawImage(sheetCv, 0, 0, W, H);
    const x0 = (W - cardW) / 2, y0 = CY - cardH / 2, r = RAD / (HALF[1] * 2) * cardH;
    o.save();
    rr(o, x0, y0, cardW, cardH, r);
    o.clip();
    const g = o.createLinearGradient(x0, y0, x0 + cardW, y0 + cardH);
    ['#a9a6b8', '#ffb3d1', '#ffe3a1', '#b9f5d4', '#a9dcff', '#d3bdff', '#a9a6b8'].forEach((c, i) => g.addColorStop(i / 6, c));
    o.fillStyle = g;
    o.fillRect(x0, y0, cardW, cardH);
    // 油墨按覆盖率盖上去
    const p = canvas(FACE.w, FACE.h), pc = p.getContext('2d');
    pc.drawImage(FACE.art, 0, 0);
    const im = pc.getImageData(0, 0, FACE.w, FACE.h);
    for (let i = 0; i < FACE.w * FACE.h; i++) im.data[i * 4 + 3] = FACE.mk[i * 4] > 8 ? 0 : FACE.mk[i * 4 + 3] * 0.92;
    pc.putImageData(im, 0, 0);
    o.drawImage(p, x0, y0, cardW, cardH);
    o.restore();
  }

  let cardReady = false, warmed = false;
  async function buildCard() {
    const id = ++buildId;
    const F = await makeFace(drawFront, id);
    if (!F) return;
    if (!guilloche || guilloche.key !== `${TW}x${TH}`) {
      const g = await drawGuilloche(id);
      if (!g) return;
      guilloche = g;
    }
    const B = await makeFace(drawBack, id);
    if (!B) return;
    drawSheet();
    if (glOK && !await uploadCard(F, B, id)) return;
    if (id !== buildId) return;
    FACE = F;
    BACK = B;
    if (!glOK) fallback();
    cardReady = true;
    warmed = false;
  }
  function build() {
    layout();
    if (REDUCED && !st.started) { st.started = st.flipped = true; st.fl = st.ft = 0; st.z = 0; st.rx = -0.06; st.ry = 0.12; st.t = 9; }
    return buildCard();
  }
  // 预热：贴图和着色器都好了就先画一帧，不管在不在画面里；画布上留着入场前那一帧，滚到时不会先黑一下再闪出来
  function warm() {
    try { render(); gl.flush(); } catch (err) { console.error(err); }
    warmed = true;
  }

  let visible = false, last = performance.now(), fontsIn = false, buildFonts = null, fontsPending = false;
  new IntersectionObserver(es => es.forEach(e => { visible = e.isIntersecting; }), { rootMargin: '300px 0px' }).observe(stage);
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(now - last, 50);
    last = now;
    const r = stage.getBoundingClientRect(), onScreen = r.bottom > 0 && r.top < innerHeight;
    // 字体比第一版贴图晚到：等页脚不在画面里、还没开始，或入场演完了再重建，别在入场中途卡一下
    if (fontsPending && (!onScreen || !st.started || st.t > 4.6)) { fontsPending = false; buildFonts = true; buildCard(); }
    if (glOK) {
      try { if (!glReady()) return; } catch (err) { console.error(err); glOK = false; if (FACE) fallback(); return; }
      if (cardReady && !warmed) warm();
    }
    if (!visible || !cardReady) return;
    if (!st.started && (r.top < innerHeight * 0.72 || r.bottom <= innerHeight + 4)) st.started = true;
    frame(dt);
    try { render(); } catch (err) { console.error(err); }
    readout(now);
  }

  const fontCss = $('#font-css');
  const cssReady = new Promise(r => { if (fontCss.media === 'all') r(); else { fontCss.addEventListener('load', r); fontCss.addEventListener('error', r); } });
  const fontsReady = () => cssReady.then(() => Promise.all([
    document.fonts.load('800 100px Syne', brand), document.fonts.load('900 100px "Noto Sans SC"', brand),
    document.fonts.load('700 100px Syne', '0042'), document.fonts.load('500 20px "IBM Plex Mono"', 'No. 0042 / 2000'),
  ])).catch(() => {});
  try { glOK = initGL(); } catch (err) { console.error(err); glOK = false; }
  // 字体最多等 2 秒：卡片一打开页面就入场，宁可多等一会儿，也别演到一半换字体；没到就先用系统字体建一版，字体到了再换
  const fontsP = fontsReady().then(() => { fontsIn = true; if (buildFonts === false) fontsPending = true; });
  Promise.race([fontsP, new Promise(r => setTimeout(r, 2000))]).then(() => { buildFonts = fontsIn; build(); });
  requestAnimationFrame(loop);
  let tmr, lastW = innerWidth;
  addEventListener('resize', () => {
    if (innerWidth === lastW) return;
    lastW = innerWidth;
    clearTimeout(tmr);
    tmr = setTimeout(build, 250);
  });
</script>
</body>
</html>
