<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>浇铸 · 一千零一页</title>
<meta name="description" content="昏暗的铸造车间里，一包铁水倒进砂型，把品牌名的每一笔灌满；冷下来以后落砂开箱，再把字面打磨出光。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-css" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ultra&family=Noto+Serif+SC:wght@900&display=swap" media="print" onload="this.media='all'">
<style>
  :root {
    --bg: #080706;
    --ink: #dcd4c8;
    --muted: #8f867a;
    --faint: #5b544b;
    --line: rgb(220 212 200 / .13);
    --hot: #ff9b45;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
    --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 var(--sans); overflow: hidden; }

  /* 角落的页码，点了回目录；用反色混合，深浅底上都看得见 */
  .folio {
    position: absolute; top: 12px; right: 16px; z-index: 20;
    font: 500 11px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .14em;
    color: #fff; mix-blend-mode: difference; opacity: .5; text-decoration: none; transition: opacity .2s;
  }
  .folio:hover, .folio:focus-visible { opacity: 1; }

  .stage {
    position: relative; height: 100vh; height: 100svh; overflow: hidden; background: var(--bg);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  /* 画布还没画出第一帧时，先用一层同色调的底：左上角炉口的一点暖光 */
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: radial-gradient(ellipse 70% 60% at 0% 0%, rgb(70 30 10 / .28), transparent 70%), var(--bg); }
  .stage.pointing canvas { cursor: none; }

  /* 铸造单：左下角一张工票，跟着工序走 */
  .ticket {
    position: absolute; left: clamp(16px, 3vw, 40px); bottom: clamp(16px, 3.4vh, 36px); width: 252px;
    font: 11.5px/1.55 var(--mono); color: var(--muted); pointer-events: none;
    animation: rise 1s .3s both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .ticket .hd { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 7px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
  .ticket .hd span { font: 600 12px/1 var(--sans); letter-spacing: .2em; color: var(--ink); }
  .ticket .hd b { font-weight: 500; letter-spacing: .1em; color: var(--muted); }
  .ticket dl { display: grid; grid-template-columns: 4.6em 1fr; gap: 2px 10px; margin: 0; }
  .ticket dt { color: var(--faint); }
  .ticket dd { margin: 0; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .ticket dd .hot { color: var(--hot); }
  .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 12px; }
  .steps div { display: flex; flex-direction: column; gap: 5px; font: 10.5px/1 var(--sans); color: var(--faint); letter-spacing: .08em; transition: color .5s; }
  .steps div::before { content: ""; height: 2px; border-radius: 1px; background: var(--line); transition: background .5s, box-shadow .5s; }
  .steps .done { color: var(--muted); }
  .steps .done::before { background: #6d655b; }
  .steps .now { color: var(--ink); }
  .steps .now::before { background: var(--hot); box-shadow: 0 0 8px rgb(255 150 60 / .7); }

  /* 测温枪：指到哪里读哪里 */
  .probe { position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0; transition: opacity .2s; will-change: transform; }
  .probe.on { opacity: 1; }
  .probe i { position: absolute; left: -11px; top: -11px; width: 22px; height: 22px; border: 1px solid rgb(255 236 214 / .55); border-radius: 50%; }
  .probe i::before, .probe i::after { content: ""; position: absolute; background: rgb(255 236 214 / .55); }
  .probe i::before { left: 10px; top: -5px; width: 1px; height: 30px; clip-path: polygon(0 0, 100% 0, 100% 30%, 0 30%, 0 70%, 100% 70%, 100% 100%, 0 100%); }
  .probe i::after { top: 10px; left: -5px; height: 1px; width: 30px; clip-path: polygon(0 0, 30% 0, 30% 100%, 0 100%, 0 0, 70% 0, 100% 0, 100% 100%, 70% 100%); }
  .probe b { position: absolute; left: -2px; top: -2px; width: 4px; height: 4px; border-radius: 50%; background: #ff3b2f; box-shadow: 0 0 6px 1px rgb(255 50 30 / .9); }
  .probe .pv {
    position: absolute; left: 18px; top: -30px; padding: 3px 7px 3px 6px; border-radius: 3px; white-space: nowrap;
    font: 11.5px/1.2 var(--mono); color: #ffe4c6; background: rgb(12 10 9 / .72); border: 1px solid rgb(255 220 190 / .14);
    font-variant-numeric: tabular-nums;
  }
  .probe em { font-style: normal; color: #9c9184; margin-right: 6px; }
  .probe strong { font-weight: 500; }

  .hint {
    position: absolute; left: 50%; bottom: clamp(20px, 4.4vh, 44px); transform: translateX(-50%); margin: 0;
    font: 13px/1.4 var(--sans); letter-spacing: .08em; color: #b3a99c; white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity .7s;
  }
  .hint.on { opacity: 1; }
  .ctl { position: absolute; right: clamp(16px, 3vw, 40px); bottom: clamp(16px, 3.4vh, 36px); display: flex; gap: 8px; animation: rise 1s .5s both; }
  .ctl button {
    font: 12.5px/1 var(--sans); color: var(--muted); cursor: pointer; letter-spacing: .04em;
    background: rgb(12 10 9 / .55); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .ctl button:hover { color: var(--ink); border-color: rgb(220 212 200 / .3); }
  .ctl button:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
  .ctl button[hidden] { display: none; }

  @media (max-width: 720px) {
    .ticket { width: auto; right: 16px; bottom: 64px; font-size: 11px; }
    .ticket dl { grid-template-columns: 4.4em 1fr 4.4em 1fr; }
    .ticket .hd { padding-bottom: 6px; margin-bottom: 6px; }
    .steps { margin-top: 10px; }
    .hint { bottom: 218px; font-size: 12.5px; }
    .ctl { left: 16px; right: 16px; bottom: 16px; }
    .ctl button { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ticket, .ctl { animation: none; }
    .probe, .hint { transition: none; }
  }
  @media (max-height: 640px) and (min-width: 721px) {
    .ticket dl .opt { display: none; }
  }
</style>
</head>
<body>

<a class="folio" href="index.html" title="回到目录">一千零一页 · 007</a>

<main class="stage" id="stage">
  <canvas id="gl" role="img" aria-label="铸造车间俯视：一包铁水倒进品牌名形状的砂型，冷却后落砂开箱，再把字面打磨出光"></canvas>
  <div class="probe" id="probe" aria-hidden="true"><i></i><b></b><div class="pv"><em id="probe-k">砂型</em><strong id="probe-t">28 °C</strong></div></div>
  <section class="ticket" aria-label="铸造单">
    <div class="hd"><span>铸造单</span><b>No.007</b></div>
    <dl>
      <dt>铸件</dt><dd><span class="bn">Lumen</span> 铭字</dd>
      <dt class="opt">材质</dt><dd class="opt">HT250 灰铸铁</dd>
      <dt>浇注</dt><dd>1420 °C</dd>
      <dt>实测</dt><dd id="live">—</dd>
    </dl>
    <div class="steps" id="steps"><div>吊包</div><div>浇注</div><div>冷却</div><div>落砂</div><div>打磨</div></div>
  </section>
  <p class="hint" id="hint" aria-live="polite"></p>
  <div class="ctl"><button type="button" id="again" hidden>再浇一炉</button><button type="button" id="sound" aria-pressed="false">声音 · 关</button></div>
</main>

<script>
  const $ = s => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const easeOut = x => 1 - (1 - clamp(x, 0, 1)) ** 3;
  const easeIn = x => clamp(x, 0, 1) ** 3;
  const rand = (a, b) => a + Math.random() * (b - a);
  const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const Q = new URLSearchParams(location.search);
  // 品牌名默认 Lumen，网址加 ?name=星河 这样的参数可以换
  const brand = (Q.get('name') || '').trim().slice(0, 16) || 'Lumen';
  document.querySelectorAll('.bn').forEach(b => { b.textContent = brand; });
  const CJK = /[⺀-鿿豈-﫿＀-￯]/.test(brand);
  // 拉丁字母用 Ultra（粗重的板衬线，像老铸铁招牌），中文用思源宋体最粗的一档
  const FONT = px => CJK ? `900 ${px}px "Noto Serif SC", "Songti SC", "SimSun", serif` : `400 ${px}px Ultra, Rockwell, "Roboto Slab", Georgia, serif`;
  const setFont = (o, px) => { o.font = FONT(px); if ('letterSpacing' in o) o.letterSpacing = (CJK ? 0.08 : innerWidth < 720 ? 0.025 : 0.04) * px + 'px'; };

  const stage = $('#stage'), glc = $('#gl');
  const S_OBL = 0.66;   // 斜俯视：高度每升 1，画面上往上挪 0.66

  // ---------- 黑体色表：真实的普朗克谱乘 CIE 配色函数，亮度按真实比例压缩 ----------
  const BB = (() => {
    const n = 256, tex = new Float32Array(n * 4), lum = new Float32Array(n);
    const g = (l, mu, s1, s2) => { const t = (l - mu) / (l < mu ? s1 : s2); return Math.exp(-0.5 * t * t); };
    const xyz = K => {
      let X = 0, Y = 0, Z = 0;
      for (let l = 380; l <= 780; l += 4) {
        const lm = l * 1e-9, B = 1 / (lm ** 5 * (Math.exp(0.014388 / (lm * K)) - 1));
        X += B * (1.056 * g(l, 599.8, 37.9, 31.0) + 0.362 * g(l, 442.0, 16.0, 26.7) - 0.065 * g(l, 501.1, 20.4, 26.2));
        Y += B * (0.821 * g(l, 568.8, 46.9, 40.5) + 0.286 * g(l, 530.9, 16.3, 31.1));
        Z += B * (1.217 * g(l, 437.0, 11.8, 36.0) + 0.681 * g(l, 459.0, 26.0, 13.8));
      }
      return [X, Y, Z];
    };
    const ref = xyz(1420 + 273.15)[1];
    for (let i = 0; i < n; i++) {
      const T = 400 + 1300 * i / (n - 1), [X, Y, Z] = xyz(T + 273.15);
      const r = Math.max(0, 3.2406 * X - 1.5372 * Y - 0.4986 * Z), gg = Math.max(0, -0.9689 * X + 1.8758 * Y + 0.0415 * Z), b = Math.max(0, 0.0557 * X - 0.2040 * Y + 1.0570 * Z);
      const l0 = (0.2126 * r + 0.7152 * gg + 0.0722 * b) || 1e-30;
      // 1420 °C 约等于 6（远超白），1000 °C 约 1.5 的橙，700 °C 只剩 0.3 的暗红，450 °C 以下淡到没有
      const I = 6 * Math.pow(Y / ref, 0.28) * smooth((T - 420) / 140);
      tex.set([r / l0 * I, gg / l0 * I, b / l0 * I, I], i * 4);
      lum[i] = I;
    }
    const at = T => { const f = clamp((T - 400) / 1300, 0, 1) * (n - 1), i = Math.floor(f), k = f - i, j = Math.min(n - 1, i + 1); return [lerp(tex[i * 4], tex[j * 4], k), lerp(tex[i * 4 + 1], tex[j * 4 + 1], k), lerp(tex[i * 4 + 2], tex[j * 4 + 2], k)]; };
    const L = T => { if (T <= 400) return 0; const f = clamp((T - 400) / 1300, 0, 1) * (n - 1), i = Math.floor(f); return lerp(lum[i], lum[Math.min(n - 1, i + 1)], f - i); };
    return { tex, at, L };
  })();

  // ---------- 布局：所有尺寸用 CSS 像素，地面是 z = 0 ----------
  let W, H, DPR, MOB, K, KL, LAY;
  function layout() {
    W = Math.max(320, stage.clientWidth);
    H = Math.max(360, stage.clientHeight);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    MOB = W < 720 || W < H * 0.75;
    K = MOB ? clamp(W / 640, 0.56, 0.78) : clamp(Math.min(W / 1280, H / 800), 0.72, 1.35);
    KL = MOB ? clamp(W / 470, 0.72, 0.95) : K;
    const mc = canvas(8, 8).getContext('2d');
    setFont(mc, 200);
    const m0 = mc.measureText(brand);
    const iw = m0.actualBoundingBoxLeft + m0.actualBoundingBoxRight, ih = m0.actualBoundingBoxAscent + m0.actualBoundingBoxDescent;
    const cupR = 21 * K, riserR = 18 * K, runHW = 6.5 * K, gapL = cupR + (MOB ? 22 : 36) * K, gapR = riserR + (MOB ? 14 : 30) * K;
    const FW = (MOB ? 12 : 17) * K, padIn = (MOB ? 12 : 34) * K;
    // 浇包挂在浇口杯左上方：桌面往左让，手机往上让
    const u = MOB ? [-0.36, 0.933] : [0.96, 0.28];   // 手机上浇包挂在浇口杯右上方，高过字
    const ladR = 68 * KL, back = 110 * KL;
    const leftExt = MOB ? cupR + 12 * K + FW : Math.max(cupR + padIn + FW, back * u[0] + ladR + 46 * KL);   // 倾倒时包底往外甩，多留一点
    const rightExt = gapR + riserR + padIn + FW;
    const margin = MOB ? 6 : 36;
    const maxW = Math.min(W - 2 * margin - leftExt - gapL - rightExt, (MOB ? 9999 : 900 * K));
    const maxH = MOB ? H * 0.17 : H * 0.3;
    const sc = Math.min(maxW / iw, maxH / ih);
    const fontPx = 200 * sc, tw = iw * sc, th = ih * sc;
    const total = leftExt + gapL + tw + rightExt;
    const tx0 = Math.round(W / 2 - total / 2 + leftExt + gapL);
    const ventLen = 13 * K, ventR = 4.6 * K, runGap = clamp(th * 0.15, 20 * K, 40 * K);
    const groupH = ventLen + ventR + th + runGap + runHW;
    const cy = MOB ? H * 0.54 : H * 0.56;
    const ty0 = Math.round(cy - groupH / 2 + ventLen + ventR);
    const ty1 = ty0 + th, runnerY = Math.round(ty1 + runGap);
    const cup = { x: tx0 - gapL, y: runnerY, r: cupR }, riser = { x: tx0 + tw + gapR, y: runnerY - riserR * 0.35, r: riserR };
    const fl = { x0: cup.x - cupR - (MOB ? 10 * K : padIn), y0: ty0 - ventLen - ventR - 26 * K, x1: riser.x + riserR + padIn, y1: runnerY + runHW + 30 * K };
    const tex = { x: Math.floor(fl.x0) - 4, y: Math.floor(fl.y0) - 4 };
    tex.w = Math.ceil(fl.x1) + 4 - tex.x;
    tex.h = Math.ceil(fl.y1) + 4 - tex.y;
    // 浇包：枢轴（耳轴中心）的位置、尺寸
    const zHi = 44 * KL, zLo = -60 * KL;
    const P = [cup.x - u[0] * back, cup.y - u[1] * back, (MOB ? 190 : 236) * KL];
    LAY = {
      fontPx, tw, th, tx0, ty0, ty1, textX: tx0 + m0.actualBoundingBoxLeft * sc, baseY: ty0 + m0.actualBoundingBoxAscent * sc,
      cup, riser, runnerY, runHW, gateHW: 5 * K, ventLen, ventR, fl, FW, tex,
      lad: { u, a: [-u[1], u[0]], R: ladR, Ri: ladR * 0.74, zLo, zHi, P, back, bottom: zLo + 13 * KL },
      grindR: (MOB ? 13 : 22) * K,
    };
  }

  // ---------- 型腔：掩码、距离场、铁水先到哪儿 ----------
  let MD = null;   // mould data
  function buildMould() {
    const T = LAY.tex, mw = T.w, mh = T.h, NPX = mw * mh;
    const cv = canvas(mw, mh), o = cv.getContext('2d', { willReadFrequently: true });
    setFont(o, LAY.fontPx);
    o.textBaseline = 'alphabetic';
    o.fillStyle = '#fff';
    o.fillText(brand, LAY.textX - T.x, LAY.baseY - T.y);
    const lt = o.getImageData(0, 0, mw, mh).data;
    const letter = new Uint8Array(NPX);
    for (let i = 0; i < NPX; i++) letter[i] = lt[i * 4 + 3] > 127 ? 1 : 0;
    // 连通的笔画
    const comp = new Int32Array(NPX).fill(-1), stack = new Int32Array(NPX), comps = [];
    for (let i = 0; i < NPX; i++) {
      if (!letter[i] || comp[i] >= 0) continue;
      const id = comps.length;
      let sp = 0, n = 0, x0 = 1e9, x1 = -1, y0 = 1e9, y1 = -1;
      stack[sp++] = i;
      comp[i] = id;
      while (sp) {
        const j = stack[--sp], x = j % mw, y = (j / mw) | 0;
        n++;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        if (x > 0 && letter[j - 1] && comp[j - 1] < 0) { comp[j - 1] = id; stack[sp++] = j - 1; }
        if (x < mw - 1 && letter[j + 1] && comp[j + 1] < 0) { comp[j + 1] = id; stack[sp++] = j + 1; }
        if (y > 0 && letter[j - mw] && comp[j - mw] < 0) { comp[j - mw] = id; stack[sp++] = j - mw; }
        if (y < mh - 1 && letter[j + mw] && comp[j + mw] < 0) { comp[j + mw] = id; stack[sp++] = j + mw; }
      }
      comps.push({ id, n, x0, x1, y0, y1 });
    }
    const big = comps.filter(c => c.n >= 14);
    const rowMid = (c, y) => { const xs = []; for (let x = c.x0; x <= c.x1; x++) if (comp[y * mw + x] === c.id) xs.push(x); return xs[xs.length >> 1]; };
    // 整张型腔：字、内浇道（每块笔画从最低处往下接到横浇道或别的笔画）、出气孔、横浇道、浇口杯、冒口
    o.clearRect(0, 0, mw, mh);
    o.fillText(brand, LAY.textX - T.x, LAY.baseY - T.y);
    const ry = LAY.runnerY - T.y, gh = LAY.gateHW, vents = [];
    for (const c of big) {
      const gx = rowMid(c, c.y1);
      let y = c.y1 + 1;
      while (y < ry && !(letter[y * mw + gx] && comp[y * mw + gx] !== c.id)) y++;
      o.fillRect(gx - gh, c.y1 - 3, gh * 2, y - c.y1 + 4);
      if (c.n >= 160) {
        const vx = rowMid(c, c.y0), vy = Math.max(LAY.ventR + 3, c.y0 - LAY.ventLen);
        o.fillRect(vx - 1.6 * K, vy, 3.2 * K, c.y0 - vy + 3);
        o.beginPath(); o.arc(vx, vy, LAY.ventR, 0, 7); o.fill();
        vents.push({ x: vx + T.x, y: vy + T.y, cx: vx, cy: vy, n: c.n });
      }
    }
    const cup = LAY.cup, rs = LAY.riser;
    o.beginPath(); o.roundRect(cup.x - T.x, ry - LAY.runHW, rs.x - cup.x, LAY.runHW * 2, LAY.runHW); o.fill();
    o.beginPath(); o.ellipse(cup.x - T.x, ry, cup.r * 1.06, cup.r, 0, 0, 7); o.fill();
    o.fillRect(rs.x - T.x - LAY.runHW, rs.y - T.y, LAY.runHW * 2, ry - (rs.y - T.y));
    o.beginPath(); o.arc(rs.x - T.x, rs.y - T.y, rs.r, 0, 7); o.fill();
    const md = o.getImageData(0, 0, mw, mh).data;
    // 太碎的小块（抗锯齿残渣）不算
    const tiny = new Set(comps.filter(c => c.n < 14).map(c => c.id));
    const cov = new Float32Array(NPX);
    for (let i = 0; i < NPX; i++) cov[i] = (tiny.size && tiny.has(comp[i])) ? 0 : md[i * 4 + 3] / 255;
    // 有符号距离场：型腔里为负
    const INF = 1e20, fA = new Float32Array(NPX), fB = new Float32Array(NPX);
    for (let i = 0; i < NPX; i++) { const in_ = cov[i] >= 0.5; fA[i] = in_ ? 0 : INF; fB[i] = in_ ? INF : 0; }
    edt(fA, mw, mh); edt(fB, mw, mh);
    const sdf = new Float32Array(NPX);
    for (let i = 0; i < NPX; i++) {
      const c = cov[i];
      let d = c >= 0.5 ? -(Math.sqrt(fB[i]) - 0.5) : Math.sqrt(fA[i]) - 0.5;
      if (c > 0.02 && c < 0.98) d = 0.5 - c;
      sdf[i] = d;
    }
    // 低分辨率的模拟网格
    const C = MOB ? 2 : 3, gw = Math.ceil(mw / C), ghh = Math.ceil(mh / C), G = gw * ghh;
    const cav = new Uint8Array(G), thick = new Float32Array(G), isL = new Uint8Array(G);
    for (let j = 0; j < ghh; j++) for (let i = 0; i < gw; i++) {

  function update(dt) {
    S.time += dt;

    const L = LAY.lad, cup = LAY.cup;

      let on = 0;

  // 铁水的温度：灌进来的格子从浇注温度开始，按厚薄降温，相邻的格子互相传热
  function simMetal(dt) {

    let maxT = 0, maxLT = 0, glow = 0;
    for (let k = 0; k < cells.length; k++) {
      const g = cells[k];

  }

  function simParticles(dt) {
    const g = 1500 * K;
    SP = SP.filter(p => {
      p.age += dt;
      if (p.kind === 2) { p.T -= (p.T - 200) * 0.7 * dt; return p.T > 520; }   // 落在砂上的铁珠，慢慢暗下去

      p.vx *= dr; p.vy *= dr;

  }
  // 粒子数据：每个是一段屏幕上的线（尾 → 头）、颜色、宽度
  function packParticles() {
    let n = 0;
    const put = (x0, y0, x1, y1, r, g, b, a, w) => { if (n >= PMAX) return; const o = n * 9; PDATA[o] = x0; PDATA[o + 1] = y0; PDATA[o + 2] = x1; PDATA[o + 3] = y1; PDATA[o + 4] = r; PDATA[o + 5] = g; PDATA[o + 6] = b; PDATA[o + 7] = a; PDATA[o + 8] = w; n++; };

  function uploadState() {
    const { G, rim, cav } = MD;

  function onDone() {
    if (!REDUCED) againBtn.hidden = false;
    setHint('done', REDUCED ? (TOUCH ? '' : '左右移动鼠标，看字面的反光') : TOUCH ? '按住拖动，接着打磨' : '按住拖动，接着打磨；左右移动看反光', 6);
  }
  function hints() {
    if (S.phase === 'ready' && !S.boostEver) setHint('pour', TOUCH ? '按住屏幕，倒得更猛' : '按住鼠标，倒得更猛', 5.5);
    if (S.phase === 'cool' && S.pt > 1.5 && S.maxT > 700 && !S.quenched) setHint('quench', '点一下发红的铁，泼一瓢水', 5);
  }

  // ---------- 主循环 ----------
  let last = performance.now(), dirty = true, started = false;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!started || !glOK || document.hidden) { last = now; return; }   // 没有 WebGL2 时只画一张静止的图
    const dt = clamp((now - last) / 1000, 0, 0.05);   // rAF 的时间戳可能比刚记下的时间还早，别让 dt 变负
    last = now;
    if (restarting) {
      const k = (now - restarting) / 600;
      S.fade = Math.max(0, 1 - k);
      AU.fadeTo(1 - Math.min(1, k));
      if (k >= 1) { restarting = 0; resetSim(); hintShown = {}; AU.fadeTo(1); }
      else { render(); return; }
    }
    if (REDUCED) {
      if (!dirty) return;
      dirty = false;
      S.grind.vis = 0;
      render();
      hud();
      placeProbe();
      return;
    }
    // 完工以后：没有火花、没在磨、鼠标也没动，就不用每帧重画
    if (S.phase === 'done' && S.pt > 2 && !SP.length && S.grind.vis <= 0 && !S.grind.manual && !dirty) { AU.frame(dt); return; }
    dirty = false;
    update(dt);
    AU.frame(dt);
    render();
    hud();
    hints();
    placeProbe();
  }
  // 快进：跑一遍模拟不画（测试和改窗口大小以后接着演）
  function seek(t) {
    const dt = 1 / 60;
    AU.mute = true;
    while (S.t < t) update(dt);
    AU.mute = false;
  }

  // 没有 WebGL2：画一块静止的铸件
  function fallback() {
    const o = glc.getContext('2d');
    if (!o) return;
    glc.width = Math.round(W * DPR); glc.height = Math.round(H * DPR);
    o.scale(DPR, DPR);
    o.fillStyle = '#0c0b0a'; o.fillRect(0, 0, W, H);
    setFont(o, LAY.fontPx);
    o.textBaseline = 'alphabetic';
    const g = o.createLinearGradient(0, LAY.ty0, 0, LAY.ty1);
    g.addColorStop(0, '#5b5652'); g.addColorStop(0.5, '#2c2a28'); g.addColorStop(1, '#1b1a19');
    o.shadowColor = 'rgba(255, 110, 30, .45)'; o.shadowBlur = 24;
    o.fillStyle = g;
    o.fillText(brand, LAY.textX, LAY.baseY);
    stage.classList.add('ready');
  }

  function build(keepTime) {
    const t = keepTime ? S.t : 0;
    layout();
    buildMould();
    resetSim();
    if (glOK) buildGL(); else { fallback(); return; }
    if (REDUCED) {
      // 减少动画：直接给看打磨好的成品
      seek(1);
      while (S.phase !== 'done' && S.t < 120) update(1 / 30);
      S.fade = 1; S.smoke = 0; SP = []; DEB = [];
      dirty = true;
    } else if (t > 0) { seek(t); }
    const sk = parseFloat(Q.get('seek'));
    if (!keepTime && sk > 0 && !REDUCED) { seek(sk); S.fade = 1; }
  }

  const cssReady = new Promise(r => {
    const l = $('#font-css');
    if (l.media === 'all' && l.sheet) r(); else { l.addEventListener('load', () => r()); l.addEventListener('error', () => r()); }
  });
  // 着色器先交给驱动在后台编，同时等字体
  let glStarted = false;
  try { glStarted = !Q.has('nogl') && startGL(); } catch (err) { console.error(err); }   // ?nogl：测试没有 WebGL2 时的样子
  const shadersReady = new Promise(r => { const poll = () => { if (!glStarted || compiled()) r(); else requestAnimationFrame(poll); }; poll(); });
  // 字体最多等 1.6 秒：开场本来就是从黑里亮起来，宁可晚一点亮，也不演到一半换字
  const fontWait = parseFloat(Q.get('fontwait')) || 1600;
  const fontsReady = cssReady.then(() => document.fonts.load(FONT(100), brand)).catch(() => {});
  Promise.all([Promise.race([fontsReady, new Promise(r => setTimeout(r, fontWait))]), shadersReady]).then(() => {
    try { glOK = glStarted && initGL(); } catch (err) { console.error(err); glOK = false; }
    build(false);
    if (glOK) warm();
    started = true;
    stage.classList.add('ready');
    last = performance.now();
    requestAnimationFrame(frame);
  });
  // 预热：每个程序先画一次，把驱动的二次编译挪到开场之前（这时画面还是黑的）
  function warm() {
    const f = S.fade; S.fade = 0;
    render();
    S.fade = f;
    gl.finish();
  }
  let rt = 0, lastW = 0, lastH = 0;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      if (!started || (stage.clientWidth === lastW && Math.abs(stage.clientHeight - lastH) < 80)) return;
      lastW = stage.clientWidth; lastH = stage.clientHeight;
      build(true);
    }, 250);
  });
  setTimeout(() => { lastW = stage.clientWidth; lastH = stage.clientHeight; }, 0);
  window.__foundry = { S, seek: t => seek(t), get MD() { return MD; }, AU, LAY: () => LAY };
</script>
</body>
</html>
