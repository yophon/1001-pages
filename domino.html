<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>多米诺 · 一千零一页</title>
<meta name="description" content="几千块黑色骨牌立在木地板上。推倒第一块，连锁反应沿着路线传开，最后一大片骨牌倒下，背面的颜色拼出品牌名。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-css" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600&display=swap" media="print" onload="this.media='all'">
<style>
  :root {
    --bg: #14100c;
    --ink: #f3ece2;
    --muted: rgba(243, 236, 226, .62);
    --line: rgba(243, 236, 226, .18);
    --ui: "Archivo", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }
  body { font: 14px/1.5 var(--ui); -webkit-font-smoothing: antialiased; }

  /* 角落的页码，点了回目录；用反色混合，深浅底上都看得见 */
  .folio {
    position: absolute; top: 12px; right: 16px; z-index: 20;
    font: 500 11px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .14em;
    color: #fff; mix-blend-mode: difference; opacity: .5; text-decoration: none; transition: opacity .2s;
  }
  .folio:hover, .folio:focus-visible { opacity: 1; }

  .stage { position: fixed; inset: 0; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .7s ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #gl.on { opacity: 1; }
  #gl:focus-visible { outline: none; }
  /* 四角压暗一点，视线落在中间 */
  .vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(130% 95% at 50% 42%, transparent 52%, rgba(12, 9, 6, .5) 100%); }

  .hint {
    position: absolute; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    padding: 7px 15px; border-radius: 999px; white-space: nowrap;
    font: 500 13px/1.4 var(--ui); color: var(--ink); background: rgba(20, 15, 11, .5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); transition: opacity .6s; pointer-events: none;
  }
  .hint.off { opacity: 0; }

  .bar {
    position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
    padding: 18px 24px calc(18px + env(safe-area-inset-bottom)); pointer-events: none;
  }
  .bar > * { pointer-events: auto; }
  .cap b { display: block; font: 400 22px/1 "Archivo Black", "Noto Sans SC", "Arial Black", sans-serif; letter-spacing: .01em; }
  .cap span { display: block; margin-top: 7px; font: 500 12px/1.4 var(--ui); color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .ctl { display: flex; gap: 8px; }
  .ctl button {
    font: 500 13px/1 var(--ui); color: var(--ink); cursor: pointer;
    padding: 10px 15px; border-radius: 999px; border: 1px solid var(--line);
    background: rgba(20, 15, 11, .55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: background .2s, opacity .3s;
  }
  .ctl button:hover:not(:disabled) { background: rgba(44, 34, 26, .75); }
  .ctl button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .ctl button:disabled { opacity: .35; cursor: default; }
  @media (prefers-reduced-motion: reduce) { #gl, .hint { transition: none; } }
  @media (max-width: 640px) {
    .bar { padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
    .cap b { font-size: 18px; }
    .ctl button { padding: 9px 13px; }
    .hint { bottom: calc(70px + env(safe-area-inset-bottom)); font-size: 12.5px; }
  }
</style>
</head>
<body>

<a class="folio" href="index.html" title="回到目录">一千零一页 · 011</a>

<main class="stage">
  <canvas id="gl" tabindex="0" aria-label="木地板上立着几千块黑色骨牌，推倒以后，背面的颜色拼出品牌名。点一块骨牌从那里推倒，按回车从第一块推倒"></canvas>
  <div class="vig"></div>
  <div class="hint" id="hint">点任意一块骨牌，从那里推倒</div>
  <div class="bar">
    <div class="cap"><b id="f-name">Lumen</b><span id="meta">多米诺</span></div>
    <div class="ctl">
      <button type="button" id="reset" disabled>重新立起</button>
      <button type="button" id="sound" aria-pressed="false">声音 · 关</button>
    </div>
  </div>
</main>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
  const mix = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const PI = Math.PI, HALF = PI / 2;
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mulberry = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  // 品牌名默认 Lumen，网址加 ?name=星河 这样的参数可以换
  const brand = (new URLSearchParams(location.search).get('name') || '').trim().slice(0, 16) || 'Lumen';
  $('#f-name').textContent = brand;
  const CJK = /[⺀-鿿豈-﫿　-〿＀-￯]/.test(brand);

  // ---------- 字体：只为品牌名里的汉字取一个子集 ----------
  const links = [$('#font-css')];
  if (CJK) {
    const l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@900&display=swap&text=' + encodeURIComponent(brand);
    document.head.appendChild(l);
    links.push(l);
  }
  const BRAND_FONT = px => CJK
    ? `900 ${px}px "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif`
    : `400 ${px}px "Archivo Black", "Arial Black", sans-serif`;
  const sheetIn = l => new Promise(r => {
    if (l.sheet && l.media !== 'print') return r();
    l.addEventListener('load', () => r(), { once: true });
    l.addEventListener('error', () => r(), { once: true });
  });
  const fontsReady = () => Promise.all(links.map(sheetIn))
    .then(() => Promise.all([document.fonts.load(BRAND_FONT(80), brand), document.fonts.load('600 14px Archivo')]))
    .catch(() => {});

  // ---------- 尺寸（单位：骨牌高 = 1） ----------
  const HH = 1, WD = 0.5, TK = 0.16;   // 高、宽、厚
  const DS = 0.55;                     // 相邻两张的间距（转轴到转轴）
  const WP = 0.6;                      // 场地里的列距
  const V = 18;                        // 波前速度，单位/秒，相当于 9 厘米的骨牌每秒走 1.6 米

  const lin = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(c => { c /= 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; }); };
  const PAL = {
    mat: lin('#1a1f33'), frame: lin('#eee3cb'), gold: lin('#f2c357'), hi: lin('#fbe39c'), coral: lin('#df5d3b'),
    bg: ['#2c7479', '#24566f', '#283b5d', '#382c55'].map(lin),
    body: lin('#29282c'), pip: lin('#efe7d9'),
  };
  const ramp = (stops, f) => { f = clamp(f, 0, 1) * (stops.length - 1); const i = Math.min(stops.length - 2, Math.floor(f)), t = f - i; return stops[i].map((v, k) => mix(v, stops[i + 1][k], t)); };
  const LINE_RAMP = [PAL.coral, PAL.gold, PAL.frame, PAL.bg[0], PAL.bg[1]];

  function textAspect() {
    const o = document.createElement('canvas').getContext('2d');
    o.font = BRAND_FONT(100);
    const m = o.measureText(brand);
    const w = (m.actualBoundingBoxLeft + m.actualBoundingBoxRight) || m.width;
    const h = (m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) || 72;
    return clamp(w / h, 0.6, 9);
  }

  // ---------- 折线工具 ----------
  const cum = pts => { const c = new Float64Array(pts.length); for (let i = 1; i < pts.length; i++) c[i] = c[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return c; };
  const lower = (arr, v) => { let a = 0, b = arr.length; while (a < b) { const m = (a + b) >> 1; if (arr[m] < v) a = m + 1; else b = m; } return a; };
  function sample(pts, c, s) {
    const n = pts.length;
    const i = clamp(lower(c, s), 1, n - 1);
    const seg = c[i] - c[i - 1] || 1, t = clamp((s - c[i - 1]) / seg, 0, 1);
    const a = pts[i - 1], b = pts[i];
    const j0 = Math.max(0, i - 2), j1 = Math.min(n - 1, i + 1);
    const dx = pts[j1][0] - pts[j0][0], dz = pts[j1][1] - pts[j0][1], l = Math.hypot(dx, dz) || 1;
    return { x: mix(a[0], b[0], t), z: mix(a[1], b[1], t), dx: dx / l, dz: dz / l };
  }
  // 折线拐角倒成圆角
  function fillet(wps, rads, step = 0.04) {
    const out = [];
    const line = (a, b) => { const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step)); for (let i = out.length ? 1 : 0; i <= n; i++) out.push([mix(a[0], b[0], i / n), mix(a[1], b[1], i / n)]); };
    let cur = wps[0];
    for (let i = 1; i < wps.length - 1; i++) {
      const A = wps[i - 1], B = wps[i], C2 = wps[i + 1], r = rads[i - 1];
      let ux = B[0] - A[0], uz = B[1] - A[1], l = Math.hypot(ux, uz); ux /= l; uz /= l;
      let vx = C2[0] - B[0], vz = C2[1] - B[1]; l = Math.hypot(vx, vz); vx /= l; vz /= l;
      const sg = Math.sign(ux * vz - uz * vx), ang = Math.acos(clamp(ux * vx + uz * vz, -1, 1)), tl = r * Math.tan(ang / 2);
      const T1 = [B[0] - ux * tl, B[1] - uz * tl];
      line(cur, T1);
      const cx = T1[0] - uz * sg * r, cz = T1[1] + ux * sg * r;
      const a0 = Math.atan2(T1[1] - cz, T1[0] - cx), n = Math.max(2, Math.ceil(ang * r / step));
      for (let k = 1; k <= n; k++) { const a = a0 + sg * ang * k / n; out.push([cx + Math.cos(a) * r, cz + Math.sin(a) * r]); }
      cur = out[out.length - 1];
    }
    line(cur, wps[wps.length - 1]);
    return out;
  }

  // ---------- 摆阵：场地、主线（分叉、汇合、摆动、螺旋）、梳子 ----------
  let G = null;
  function build(prev) {
    const Wv = innerWidth, Hv = innerHeight;
    const portrait = Wv / Hv < 0.95;
    const C = portrait ? 44 : clamp(Math.round(Wv / 13.3), 64, 100);
    const asp = prev ? prev.asp : textAspect();
    const padC = portrait ? 4 : 6;
    const R = clamp(Math.round((C - 2 * padC) * WP / DS / asp + 13), 20, portrait ? 30 : 46);
    const rnd = mulberry(1001);

    const nodes = [];
    const add = (x, z, dx, dz, kind) => { const l = Math.hypot(dx, dz) || 1; nodes.push({ x, z, dx: dx / l, dz: dz / l, kind, kids: [], lean: -1, col: PAL.frame }); return nodes.length - 1; };
    const link = (a, b, lean) => { nodes[a].kids.push(b); if (lean || nodes[a].lean < 0) nodes[a].lean = b; };

    // 场地：错位排列，每张推倒前面一排的两张；从后排的若干入口往前扇形扩开
    const x0 = -(C - 0.5) * WP / 2;
    const cellX = (r, c) => x0 + (c + 0.5 * (r & 1)) * WP;
    const nE = Math.ceil((C - 1) / 4);
    const entries = Array.from({ length: nE }, (_, k) => Math.round(1 + k * (C - 3) / (nE - 1)));
    const ahead = (r, c) => (r & 1) ? [c, c + 1] : [c - 1, c];
    const reach = new Uint8Array(R * C);
    for (const e of entries) reach[e] = 1;
    for (let r = 0; r < R - 1; r++) for (let c = 0; c < C; c++) if (reach[r * C + c]) for (const cc of ahead(r, c)) if (cc >= 0 && cc < C) reach[(r + 1) * C + cc] = 1;
    const cell = new Int32Array(R * C).fill(-1);
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (reach[r * C + c]) { cell[r * C + c] = add(cellX(r, c), r * DS, 0, 1, 1); nodes[cell[r * C + c]].rc = [r, c]; }
    for (let r = 0; r < R - 1; r++) for (let c = 0; c < C; c++) {
      const i = cell[r * C + c]; if (i < 0) continue;
      for (const cc of ahead(r, c)) if (cc >= 0 && cc < C && cell[(r + 1) * C + cc] >= 0) link(i, cell[(r + 1) * C + cc]);
    }
    const NF = nodes.length;

    // 主线的路点
    const FW = (C - 0.5) * WP / 2 + 0.3;
    const zF = (R - 1) * DS, zc = -2.3, zt0 = zF + 2.6;
    let wps, rads, iLeft, iComb;
    if (!portrait) {
      const zm = zt0 + 2.4;
      wps = [[FW + 0.6, zm], [-FW - 2.6, zm], [-FW - 2.6, zc], [FW + 0.9, zc]]; rads = [2.4, 1.6]; iLeft = 1; iComb = 2;
    } else {
      // 竖屏：五趟来回的蛇形，把竖着的空间铺满
      const zA = zt0 + 2.0, zB = zA + 6.5, zC = zB + 9.0, zD = zC + 6.5, zE = zD + 6.5, xl = -FW + 1.6, xr = FW - 1.6;
      wps = [[FW + 0.6, zE], [xl, zE], [xl, zD], [xr, zD], [xr, zC], [xl, zC], [xl, zB], [xr, zB], [xr, zA], [-FW - 2.6, zA], [-FW - 2.6, zc], [FW + 0.9, zc]];
      rads = [2.2, 2.2, 2.2, 2.2, 2.2, 2.2, 2.2, 2.2, 2.4, 1.6]; iLeft = 9; iComb = 10;
    }
    const base = fillet(wps, rads), cB = cum(base);
    const sNear = p => { let best = Infinity, s = 0; for (let i = 0; i < base.length; i++) { const d = (base[i][0] - p[0]) ** 2 + (base[i][1] - p[1]) ** 2; if (d < best) { best = d; s = cB[i]; } } return s; };
    const sW = wps.map(sNear);

    const eyes = [], wigs = [], spirals = [];
    if (!portrait) {
      const Lb = sW[1] - 2.6;
      eyes.push({ s0: 3, L: 7.5, H: 2.1 });
      wigs.push({ s0: 0.24 * Lb, s1: 0.5 * Lb, A: 1.3, k: Math.max(1, Math.round(0.26 * Lb / 8.5)) });
      spirals.push({ s: 0.68 * Lb, side: [0, 1], r0: 3.0, pitch: 1.0 });
      if (Lb - (0.68 * Lb + 3) > 9.5) eyes.push({ s0: 0.68 * Lb + 3, L: 5.5, H: 1.4 });
    } else {
      eyes.push({ s0: 6, L: 6.5, H: 1.8 });                                   // 第一趟（往西）：分叉再汇合
      eyes.push({ s0: (sW[2] + sW[3]) / 2 - 2.6, L: 5.2, H: 1.3 });           // 第二趟（往东）：小一点的
      wigs.push({ s0: (sW[4] + sW[5]) / 2 - 1, s1: sW[5] - 2.8, A: 1.1, k: 1 }); // 第三趟（往西）：左半段摆一下
      spirals.push({ s: sW[7] - 7, side: [0, 1], r0: 2.6, pitch: 0.95 });   // 第四趟（往东）：朝南卷一个螺旋
      wigs.push({ s0: sW[8] + 2.8, s1: sW[9] - 3, A: 0.9, k: 2 });           // 最上面一趟（往西）
    }

    // 摆动：沿法线方向加一段正弦
    const pts = base.map(p => [p[0], p[1]]);
    for (const w of wigs) for (let i = 1; i < base.length - 1; i++) {
      const s = cB[i]; if (s <= w.s0 || s >= w.s1) continue;
      const u = (s - w.s0) / (w.s1 - w.s0);
      const tx = base[i + 1][0] - base[i - 1][0], tz = base[i + 1][1] - base[i - 1][1], l = Math.hypot(tx, tz);
      const off = w.A * Math.sin(2 * PI * w.k * u) * Math.sin(PI * u) ** 0.7;
      pts[i][0] += -tz / l * off; pts[i][1] += tx / l * off;
    }
    const cP = cum(pts);
    const sMap = s => cP[clamp(lower(cB, s), 0, cP.length - 1)];
    const sTot = cP[cP.length - 1], sComb = sMap(sW[iComb]), sLeft = sMap(sW[iLeft]);

    const main = [];
    const colAt = s => s >= sComb - 1 ? PAL.frame : ramp(LINE_RAMP, s / sComb);
    const mk = s => { const q = sample(pts, cP, s); const i = add(q.x, q.z, q.dx, q.dz, 0); nodes[i].s = s; nodes[i].col = colAt(s); main.push(i); return i; };
    // 沿一条折线均匀摆牌（两端已经有牌时去掉）
    const placeAlong = (pl, from, to, col, skipFirst) => {
      const c = cum(pl), L = c[c.length - 1], n = Math.max(1, Math.round(L / DS));
      let p = from;
      for (let j = skipFirst ? 1 : 0; j < (to >= 0 ? n : n + 1); j++) {
        const q = sample(pl, c, L * j / n), i = add(q.x, q.z, q.dx, q.dz, 0);
        nodes[i].col = typeof col === 'function' ? col(j / n) : col;
        if (p >= 0) link(p, i, p !== from); else nodes[i].first = true;
        p = i;
      }
      if (to >= 0) link(p, to);
      return p;
    };
    // 分叉再汇合的“眼睛”
    const eye = (split, merge, e) => {
      for (const side of [-1, 1]) {
        const pl = [];
        for (let s = e.s0; s <= e.s0 + e.L + 1e-6; s += 0.04) {
          const q = sample(base, cB, s), u = (s - e.s0) / e.L, off = side * e.H * Math.sin(PI * u) ** 1.5;
          pl.push([q.x - q.dz * off, q.z + q.dx * off]);
        }
        const s0 = sMap(e.s0), s1 = sMap(e.s0 + e.L);
        const c = cum(pl), L = c[c.length - 1], n = Math.max(2, Math.round(L / DS));
        let p = split;
        for (let j = 1; j < n; j++) {
          const q = sample(pl, c, L * j / n), i = add(q.x, q.z, q.dx, q.dz, 0);
          nodes[i].col = colAt(mix(s0, s1, j / n));
          link(p, i, p !== split ? true : side < 0);
          p = i;
        }
        link(p, merge, true);
      }
    };
    // 螺旋：先拐向一侧走一段，再一圈圈往里卷，最后一张是死头
    const spiral = (from, sp) => {
      const n0 = nodes[from], dx = n0.dx, dz = n0.dz, nx = sp.side[0], nz = sp.side[1], rc = 1.2;
      const A0 = [n0.x + nx * 0.32 + dx * 0.15, n0.z + nz * 0.32 + dz * 0.15];
      const Ca = [A0[0] + nx * rc, A0[1] + nz * rc];
      const pl = [];
      const a0 = Math.atan2(A0[1] - Ca[1], A0[0] - Ca[0]);
      const sg = (-Math.sin(a0) * dx + Math.cos(a0) * dz) > 0 ? 1 : -1;
      for (let k = 0; k <= 40; k++) { const a = a0 + sg * HALF * k / 40; pl.push([Ca[0] + Math.cos(a) * rc, Ca[1] + Math.sin(a) * rc]); }
      const A1 = pl[pl.length - 1], ell = Math.max(0.6, sp.r0 + 0.68 - rc);
      for (let k = 1; k <= 20; k++) pl.push([A1[0] + nx * ell * k / 20, A1[1] + nz * ell * k / 20]);
      const E = pl[pl.length - 1], Cs = [E[0] - dx * sp.r0, E[1] - dz * sp.r0];
      const th0 = Math.atan2(E[1] - Cs[1], E[0] - Cs[0]);
      const sg2 = (-Math.sin(th0) * nx + Math.cos(th0) * nz) > 0 ? 1 : -1;
      for (let phi = 0.03 / sp.r0; ; ) {
        const r = sp.r0 - sp.pitch * phi / (2 * PI);
        if (r < 1.05) break;
        pl.push([Cs[0] + Math.cos(th0 + sg2 * phi) * r, Cs[1] + Math.sin(th0 + sg2 * phi) * r]);
        phi += 0.04 / r;
      }
      placeAlong(pl, from, -1, f => ramp([PAL.gold, PAL.hi, PAL.coral], f), false);
    };

    // 按标记分段摆主线
    const marks = [];
    for (const e of eyes) marks.push({ s: sMap(e.s0), t: 'a', e }, { s: sMap(e.s0 + e.L), t: 'b', e });
    for (const sp of spirals) marks.push({ s: sMap(sp.s), t: 'sp', sp });
    marks.push({ s: sTot, t: 'end' });
    marks.sort((a, b) => a.s - b.s);
    let prevN = mk(0), sPrev = 0;
    for (const m of marks) {

  }
  let ptr = null, down = null;
  glc.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') ptr = [e.clientX, e.clientY]; });
  glc.addEventListener('pointerleave', () => { ptr = null; });
  glc.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  glc.addEventListener('pointerup', e => {
    if (!down || !G) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    down = null;
    if (moved > 10 || st.mode === 'rewind') return;
    trigger(pick(e.clientX, e.clientY));
  });
  glc.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && G) { e.preventDefault(); if (st.mode === 'idle') trigger(G.start); }
  });
  resetBtn.addEventListener('click', rewind);
  $('#sound').addEventListener('click', () => setSound(!SND.on));

  // ---------- 主循环 ----------
  let last = 0, needDraw = true, lastAngT = NaN, lastHover = -2;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!G || !glOK) return;
    const dt = clamp((now - (last || now)) / 1000, 0, 0.05);
    last = now;
    const t0 = st.simT;
    if (st.mode === 'idle' && !st.touched && !REDUCED && now - st.idleAt > 4200) startBall();   // 没人碰就让钢珠滚过来
    if (st.mode === 'run') {
      const target = !REDUCED && fieldActive(st.simT) ? 0.55 : 1;   // 整片场地倒下时放慢一点
      st.scale += (target - st.scale) * (1 - Math.exp(-dt * 3));
      st.simT += dt * st.scale;
      if (st.simT > st.tEnd + 0.6) st.mode = 'done';
    } else if (st.mode === 'rewind') {
      st.simT -= dt * 2.6;
      if (st.simT <= st.runStart - 0.02) { st.simT = st.runStart - 0.02; resetAll(); }
    }
    let changed = false;
    if (st.simT !== lastAngT) {
      st.fallen = evalAngles(st.simT); lastAngT = st.simT; changed = true;
      const { perm, ang, angDraw } = G;
      for (let k = 0; k < perm.length; k++) angDraw[k] = ang[perm[k]];
      gl.bindBuffer(gl.ARRAY_BUFFER, R3.iAng); gl.bufferSubData(gl.ARRAY_BUFFER, 0, angDraw);
    }
    const moving = camStep(dt, now);
    camMats(cam.p, glc.width / glc.height);
    if (SND.on) audioFrame(t0, st.simT, dt);
    // 悬停
    const hv = ptr && st.mode !== 'rewind' ? pick(ptr[0], ptr[1]) : -1;
    if (hv !== st.hover) { st.hover = hv; glc.style.cursor = hv >= 0 ? 'pointer' : ''; }
    if (changed || moving || needDraw || hv !== lastHover) { render(changed); needDraw = false; lastHover = hv; if (!glc.classList.contains('on')) glc.classList.add('on'); }
    // 文字
    const N = G.N;
    const mt = st.mode === 'idle' ? `多米诺 · ${fmt(N)} 块骨牌` : `已倒 ${fmt(st.fallen)} / ${fmt(N)}`;
    if (meta.textContent !== mt) meta.textContent = mt;
    resetBtn.disabled = !(st.mode === 'run' || st.mode === 'done');
    setHint(st.mode === 'idle' ? (G.portrait ? '点一块骨牌，从那里推倒' : '点任意一块骨牌，从那里推倒') : st.mode === 'done' ? '点“重新立起”，看它倒放回去' : '');
  }

  // ---------- 降级：没有 WebGL2 时画一张倒好的俯视图 ----------
  function fallback() {
    const o = glc.getContext('2d');
    if (!o) return;
    const g = G, dpr = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
    glc.width = W * dpr; glc.height = H * dpr; o.setTransform(dpr, 0, 0, dpr, 0, 0);
    o.fillStyle = '#7a5434'; o.fillRect(0, 0, W, H);
    const [x0, x1, z0, z1] = g.box, s = Math.min(W * 0.9 / (x1 - x0), H * 0.7 / (z1 - z0));
    const ox = W / 2 - (x0 + x1) / 2 * s, oz = H * 0.44 - (z0 + z1) / 2 * s;
    const toCss = c => `rgb(${c.map(v => Math.round(255 * (v <= 0.0031308 ? v * 12.92 : 1.055 * v ** (1 / 2.4) - 0.055))).join(',')})`;
    for (const n of g.nodes) {
      o.save(); o.translate(ox + n.x * s, oz + n.z * s); o.rotate(-Math.atan2(n.dx, n.dz));
      o.fillStyle = toCss(n.col); o.fillRect(-WD / 2 * s, 0, WD * s * 0.92, DS * s * 0.92);
      o.restore();
    }
    glc.classList.add('on');
    setHint('这个浏览器不支持 WebGL2，只能看倒好的样子');
  }

  // ---------- 开场 ----------
  let glOK = !!gl;
  function sizeCanvas() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    glc.width = Math.round(innerWidth * dpr); glc.height = Math.round(innerHeight * dpr);
  }
  function setup(keep) {
    const was = st.mode, prev = G;
    G = build(prev && keep ? prev : null);
    sizeCanvas();
    if (glOK) { uploadScene(); G.camFinal = fitFinal(glc.width / glc.height); }
    cam.p = null;
    if (REDUCED || (keep && was !== 'idle')) {
      st.sources = [{ i: G.start, t: 0 }]; solve(); st.simT = st.tEnd + 1; st.runStart = 0; st.mode = 'done'; st.ball = false;
    } else { solve(); st.mode = 'idle'; st.simT = 0; st.idleAt = performance.now(); }
    lastAngT = NaN; needDraw = true;
    if (!glOK) fallback();
  }

  let fontsIn = false;
  const fontsP = fontsReady().then(() => { fontsIn = true; });
  Promise.race([fontsP, new Promise(r => setTimeout(r, 1000))]).then(() => {
    if (glOK) { try { R3 = initGL(); } catch (err) { console.error(err); glOK = false; } }
    setup(false);
    requestAnimationFrame(frame);
    // 字体晚到：牌还没倒、画藏在背面时悄悄换上
    if (!fontsIn) fontsP.then(() => {
      if (!G || st.mode !== 'idle' || st.touched) return;
      paint(G);
      for (let i = 0; i < G.N; i++) G.B.set(G.nodes[i].col, i * 4);
      if (glOK) uploadColors();
    });
  });
  let rt = 0, lastW = innerWidth, lastH = innerHeight;
  addEventListener('resize', () => {
    if (innerWidth === lastW && Math.abs(innerHeight - lastH) < 80) { sizeCanvas(); if (G && glOK) G.camFinal = fitFinal(glc.width / glc.height); needDraw = true; return; }
    lastW = innerWidth; lastH = innerHeight;
    clearTimeout(rt);
    rt = setTimeout(() => setup(true), 250);
  });

  // 测试用：牌在屏幕上的位置（CSS 像素）
  const screenOf = i => { const x = G.A[i * 4], z = G.A[i * 4 + 1], w = vp[3] * x + vp[7] * 0.55 + vp[11] * z + vp[15]; return [((vp[0] * x + vp[4] * 0.55 + vp[8] * z + vp[12]) / w * 0.5 + 0.5) * innerWidth, (0.5 - (vp[1] * x + vp[5] * 0.55 + vp[9] * z + vp[13]) / w * 0.5) * innerHeight]; };
  window.__domino = { st, get G() { return G; }, get snd() { return SND; }, trigger, rewind, startBall, renderOffline, pick, screenOf, cam, setSound, get ev() { return { evT, evI, evK }; } };
})();
</script>
</body>
</html>
