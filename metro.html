<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地铁图 · 一千零一页</title>
<meta name="description" content="品牌名自动画成一张专业的地铁线路图，有站名、换乘、列车和一天的运营时刻。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@500;600&display=swap">
<style>
  :root {
    --page: #ebe7de;
    --paper: #f7f4ed;
    --ink: #1b1b1e;
    --muted: #6d6a62;
    --faint: #a29e94;
    --rule: #d9d4c8;
    --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --grot: "Overpass", "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "Overpass Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    /* 页脚上半截是导视牌：黑底白字，到站屏的琥珀色 */
    --band: #151517;
    --band-text: #f1efe9;
    --band-muted: #8f8c85;
    --band-faint: #5c5a55;
    --band-line: #2a2a2d;
    --amber: #ffb21a;
    --river: #d2e4ee;
    --river-ink: #6f9bb8;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.7 var(--sans); }

  /* 角落的页码，点了回目录；用反色混合，深浅底上都看得见 */
  .folio {
    position: absolute; top: 12px; right: 16px; z-index: 20;
    font: 500 11px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .14em;
    color: #fff; mix-blend-mode: difference; opacity: .5; text-decoration: none; transition: opacity .2s;
  }
  .folio:hover, .folio:focus-visible { opacity: 1; }

  /* ---------- 页脚：导视牌 ---------- */
  .foot { background: var(--paper); }
  .band { background: var(--band); color: var(--band-text); }
  .band-in {
    display: grid; grid-template-columns: minmax(280px, 1.6fr) minmax(220px, 1.1fr) repeat(3, minmax(100px, .7fr)); gap: 36px 40px;
    max-width: 1320px; margin: 0 auto; padding: 56px clamp(16px, 4vw, 48px) 44px;
  }
  .sign { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .sign .name { font: 800 40px/1 var(--grot); letter-spacing: -0.015em; }
  .sign .sub { font: 500 15px/1 var(--sans); color: var(--band-muted); }
  .stripe { display: flex; height: 5px; margin: 18px 0 18px; max-width: 300px; border-radius: 1px; overflow: hidden; }
  .stripe i { flex: 1; }
  .tag { margin: 0; color: var(--band-muted); font-size: 14px; max-width: 34ch; text-wrap: pretty; }
  .board { border: 1px solid var(--band-line); border-radius: 10px; padding: 14px 16px 12px; align-self: start; font-variant-numeric: tabular-nums; }
  .board .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .board .time { font: 600 34px/1 var(--mono); color: var(--amber); letter-spacing: .02em; }
  .board .lamp { display: inline-flex; align-items: center; gap: 7px; font: 12px/1 var(--sans); color: var(--band-muted); white-space: nowrap; }
  .board .lamp i { width: 7px; height: 7px; border-radius: 50%; background: var(--band-faint); transition: background .5s, box-shadow .5s; }
  .board[data-on="run"] .lamp i { background: #39c46e; box-shadow: 0 0 8px rgb(57 196 110 / .7); }
  .board[data-on="peak"] .lamp i { background: var(--amber); box-shadow: 0 0 8px rgb(255 178 26 / .7); }
  .board .msg { margin-top: 10px; font: 13.5px/1.4 var(--sans); color: var(--band-text); min-height: 1.4em; }
  .board .sub { margin-top: 4px; font: 11.5px/1.4 var(--grot); color: var(--band-faint); letter-spacing: .02em; }
  .col h3 { margin: 4px 0 14px; font: 600 11.5px/1 var(--grot); letter-spacing: .16em; color: var(--band-faint); text-transform: uppercase; }
  .col a { display: block; color: var(--band-text); opacity: .84; text-decoration: none; font-size: 14px; padding: 3px 0; }
  .col a:hover { opacity: 1; }

  /* ---------- 线路图 ---------- */
  .scene { position: relative; overflow: hidden; background: var(--paper); touch-action: pan-y; user-select: none; -webkit-user-select: none; container-type: inline-size; }
  /* 高度只按线路图的宽度算，样式一到就占好位置，不等字体和线网生成；脚本读这个高度来排版 */
  .scene #map { display: block; width: 100%; height: clamp(400px, 40cqw, 680px); }
  @container (max-width: 699.98px) { .scene #map { height: 480px; } }
  .scene.pan { cursor: grab; }
  .scene.pan.drag { cursor: grabbing; }
  .cart { position: absolute; left: clamp(16px, 4vw, 48px); top: 18px; pointer-events: none; }
  .cart .t1 { font: 700 15px/1.3 var(--sans); }
  .cart .t2 { font: 600 10.5px/1.3 var(--grot); color: var(--muted); letter-spacing: .06em; margin-top: 3px; text-transform: uppercase; }
  .key { position: absolute; right: clamp(16px, 4vw, 48px); top: 20px; display: flex; gap: 16px; font: 11.5px/1 var(--sans); color: var(--muted); pointer-events: none; }
  .key span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .key svg { width: auto; }

  .card {
    position: absolute; z-index: 3; min-width: 176px; max-width: 250px; pointer-events: none;
    background: #fff; color: var(--ink); border-radius: 8px; padding: 10px 12px 9px;
    box-shadow: 0 1px 0 rgb(0 0 0 / .04), 0 8px 24px -6px rgb(40 30 10 / .22), 0 0 0 1px rgb(0 0 0 / .07);
    font-variant-numeric: tabular-nums; opacity: 0; transform: translateY(4px); transition: opacity .16s, transform .16s;
  }
  .card.on { opacity: 1; transform: none; }
  .card .nm { font: 700 16px/1.25 var(--sans); }
  .card .py { font: 600 10.5px/1.3 var(--grot); color: var(--muted); letter-spacing: .03em; }
  .card .ls { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 6px; }
  .bdg { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 18px; padding: 0 5px; border-radius: 4px; color: #fff; font: 700 11px/1 var(--grot); }
  .bdg.x { background: #fff !important; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .card .eta { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 8px; align-items: center; font-size: 12.5px; line-height: 1.35; }
  .card .eta i { width: 8px; height: 8px; border-radius: 2px; }
  .card .eta b { font: 600 12.5px/1 var(--mono); text-align: right; }
  .card .eta .dim { color: var(--faint); }
  .card .note { margin-top: 7px; padding-top: 7px; border-top: 1px solid #eee9df; font-size: 11.5px; color: var(--muted); }

  .plan {
    position: absolute; z-index: 4; right: clamp(16px, 4vw, 48px); top: 56px; width: 268px;
    background: #fff; border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.45;
    box-shadow: 0 10px 30px -8px rgb(40 30 10 / .25), 0 0 0 1px rgb(0 0 0 / .07);
    opacity: 0; transform: translateY(-4px); transition: opacity .2s, transform .2s; pointer-events: none;
  }
  .plan.on { opacity: 1; transform: none; pointer-events: auto; }
  .plan .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .plan .hd b { font: 700 15px/1.3 var(--sans); }
  .plan .hd span { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .plan ol { list-style: none; margin: 10px 0 0; padding: 0; }
  .plan li { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  .plan li.xf { color: var(--muted); font-size: 12px; padding-left: 30px; }
  .plan .close { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border: 0; background: transparent; color: var(--faint); font-size: 16px; cursor: pointer; border-radius: 6px; }
  .plan .close:hover { background: #f3f0e9; color: var(--ink); }

  .hint { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); font: 12px/1 var(--sans); color: var(--muted); background: rgb(247 244 237 / .9); padding: 7px 12px; border-radius: 999px; pointer-events: none; transition: opacity .4s; white-space: nowrap; }

  .legend {
    display: flex; align-items: center; gap: 10px 22px;
    max-width: 1320px; margin: 0 auto; padding: 14px clamp(16px, 4vw, 48px) 16px;
    border-top: 1px solid var(--rule); font-size: 12.5px; color: var(--muted);
  }
  .legend .lines { display: flex; align-items: center; gap: 16px; flex: 1 1 0; min-width: 0; height: 24px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .legend .lines::-webkit-scrollbar { display: none; }
  .legend .lines.more { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); }
  .legend .ln { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; cursor: default; transition: opacity .2s; }
  .legend .ln:hover { color: var(--ink); }
  .legend .ln i { width: 18px; height: 5px; border-radius: 1px; }
  .legend .ln i.hollow { background: #fff !important; box-shadow: inset 0 0 0 1.5px var(--ink); height: 6px; }
  .legend .compass { flex: none; display: flex; align-items: center; gap: 14px; margin-left: auto; color: var(--faint); font: 600 10.5px/1 var(--grot); letter-spacing: .04em; }
  .legend .compass svg { display: block; }

  .legal {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px;
    max-width: 1320px; margin: 0 auto; padding: 16px clamp(16px, 4vw, 48px) 22px;
    font-size: 12.5px; color: var(--faint); border-top: 1px solid var(--rule);
  }
  .legal a { color: var(--muted); text-decoration: none; }
  .legal a:hover { color: var(--ink); }
  .legal .ctl { margin-left: auto; display: flex; gap: 8px; }
  .legal button {
    font: 12.5px/1 var(--sans); color: var(--muted); cursor: pointer;
    background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 8px 12px;
  }
  .legal button:hover { color: var(--ink); border-color: #bdb7a9; }

  /* 地图里的元素：悬停一条线时其他线淡下去 */
  #map .ln, #map .st, #map .lb, #map .tr, #map .xc { transition: opacity .25s; }
  #map.dim .ln:not(.hi), #map.dim .st:not(.hi), #map.dim .lb:not(.hi), #map.dim .tr:not(.hi), #map.dim .xc:not(.hi) { opacity: .13; }
  #map .st, #map .lb { opacity: 0; }
  #map .st { transform-box: fill-box; transform-origin: center; transform: scale(.2); transition: transform .38s cubic-bezier(.3, 1.7, .5, 1), opacity .2s; }
  #map .st.on { transform: none; }
  #map .st.on, #map .lb.on { opacity: 1; }
  #map.dim .st.on:not(.hi), #map.dim .lb.on:not(.hi) { opacity: .13; }
  #map .lines { transition: filter 1.2s, opacity 1.2s; }
  #map.night .lines, #map.night .stations { filter: saturate(.18); opacity: .62; }
  #map .st.hover .ring { stroke-width: 3.4; }

  @media (max-width: 760px) {
    .band-in { grid-template-columns: 1fr 1fr 1fr; padding-top: 44px; gap: 28px 20px; }
    .band-in .brand, .band-in .board { grid-column: 1 / -1; }
    .sign .name { font-size: 34px; }
    .key { display: none; }
    .hint { left: auto; right: 12px; top: 64px; transform: none; font-size: 11.5px; }
    .plan { left: 12px; right: 12px; top: auto; bottom: 10px; width: auto; padding: 10px 12px; font-size: 12px; line-height: 1.35; max-height: 44%; overflow: auto; }
    .plan .hd b { font-size: 14px; }
    .plan ol { margin-top: 6px; }
    .plan li { padding: 2px 0; }
    .plan li.xf { padding-left: 30px; font-size: 11px; }
    .legend .compass svg:first-child { display: none; }
    .legal .ctl { margin-left: 0; width: 100%; }
  }
</style>
</head>

<footer class="foot">

      <span><svg width="16" height="14" viewBox="0 0 16 14"><circle cx="8" cy="7" r="5" fill="#fff" stroke="#8b877d" stroke-width="1.6" stroke-dasharray="2.4 2"/></svg>规划中</span>

      <svg width="18" height="26" viewBox="0 0 18 26"><path d="M9 7L13 20L9 17L5 20Z" fill="#a29e94"/><text x="9" y="6" font-size="7.5" fill="#a29e94" text-anchor="middle" font-family="Overpass" font-weight="700">N</text></svg>

<script>
  const $ = s => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
  const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NS = 'http://www.w3.org/2000/svg';
  const CJK = s => /[　-鿿가-힯豈-﫿]/.test(s);
  const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
  // 品牌名默认 Lumen，网址加 ?name=星河 这样的参数可以换
  const brand = (new URLSearchParams(location.search).get('name') || '').trim().slice(0, 16) || 'Lumen';
  $('#f-name').textContent = brand;
  document.querySelectorAll('.bn').forEach(b => { b.textContent = brand; });

  // 可复现的随机数：同一个种子每次出来的序列一样
  function seeded(seed) {
    let s = seed >>> 0 || 1;
    return () => { s = Math.imul(s ^ (s >>> 15), 1 | s) + 0x6d2b79f5 | 0; return ((s ^ (s >>> 14)) >>> 0) / 4294967296; };
  }
  function node(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  const f1 = v => Math.round(v * 10) / 10;
  const polyLen = p => { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return L; };

  /* ---------- 站名：前字 +（偶尔一个中字）+ 后字，拼音照站牌的写法连写 ---------- */
  const parse = s => s.split(' ').map(w => { const i = w.search(/[a-z]/); return [w.slice(0, i), w.slice(i)]; });
  const PRE = parse('金jin 银yin 青qing 白bai 东dong 西xi 南nan 北bei 长chang 新xin 古gu 石shi 云yun 星xing 月yue 花hua 松song 柳liu 梅mei 竹zhu 桃tao 兰lan 龙long 凤feng 鹿lu 鹤he 明ming 光guang 安an 平ping 和he 乐le 福fu 瑞rui 文wen 宝bao 玉yu 春chun 秋qiu 晴qing 雪xue 枫feng 樟zhang 榆yu 杏xing 槐huai 翠cui 锦jin 霞xia 虹hong 望wang 清qing 永yong 嘉jia 泰tai 丰feng 华hua 海hai 天tian 江jiang 湖hu 岚lan');
  const MID = parse('水shui 阳yang 江jiang 河he 山shan 林lin 泉quan 沙sha 溪xi 塘tang 家jia 石shi');
  const SUF = parse('门men 桥qiao 湖hu 港gang 湾wan 园yuan 路lu 街jie 坊fang 口kou 村cun 岭ling 洲zhou 台tai 苑yuan 城cheng 里li 庄zhuang 寺si 阁ge 岸an 渡du 堤di 坪ping 营ying 店dian 墩dun 屯tun 浦pu 汇hui 滩tan');
  const BIG = [['广场', 'Guangchang'], ['公园', 'Gongyuan'], ['中心', 'Zhongxin'], ['大道', 'Dadao'], ['体育中心', 'Tiyu Zhongxin'], ['会展中心', 'Huizhan Zhongxin'], ['大学城', 'Daxuecheng'], ['老街', 'Laojie']];
  const pinyin = syl => { const s = syl.map((p, i) => (i && /^[aoe]/.test(p) ? "'" : '') + p).join(''); return s[0].toUpperCase() + s.slice(1); };
  function makeName(rng, big, used) {
    for (let k = 0; k < 60; k++) {
      const a = PRE[(rng() * PRE.length) | 0];
      let cn = a[0], syl = [a[1]], tail = '';
      if (big && rng() < 0.5) {
        const b = BIG[(rng() * BIG.length) | 0];
        cn += b[0];
        tail = ' ' + b[1];
      } else {
        if (rng() < 0.3) { const m = MID[(rng() * MID.length) | 0]; cn += m[0]; syl.push(m[1]); }
        const s = SUF[(rng() * SUF.length) | 0];
        cn += s[0];
        syl.push(s[1]);
      }
      if (cn[0] === cn[1] || used.has(cn)) continue;
      used.add(cn);
      return { cn, py: pinyin(syl) + tail };
    }
    return { cn: '新站', py: 'Xinzhan' };
  }

  /* ---------- 字 → 骨架 ---------- */
  const FAM = '"Overpass", "Noto Sans SC", "Microsoft YaHei", sans-serif';
  // 用偏细的字重画字（单线体的骨架最干净），字号按“大写字母高 = NC 格、每格 P 像素”定
  function rasterize(text, P, scale = 1) {
    const cjk = CJK(text), NC = Math.round((cjk ? 15 : 10) * scale), wgt = cjk ? 500 : 700;
    const probe = canvas(8, 8).getContext('2d');
    probe.font = `${wgt} 100px ${FAM}`;
    const ref = probe.measureText(cjk ? '国' : 'H');
    const capH = ref.actualBoundingBoxAscent + (cjk ? ref.actualBoundingBoxDescent : 0);
    const size = 100 * NC * P / capH;
    probe.font = `${wgt} ${size}px ${FAM}`;

      const u1 = segs[a].u, u2 = segs[b].u, c = clamp(u1[0] * u2[0] + u1[1] * u2[1], -1, 1), ang = Math.acos(c);
      if (ang < 1e-3) return;
      th[i] = ang;
      cr[i] = Math.sign(u1[0] * u2[1] - u1[1] * u2[0]);
      t[i] = Math.min(rad * Math.tan(ang / 2), segs[a].l / 2, segs[b].l / 2);
    };
    for (let i = 1; i < n - 1; i++) corner(i, i - 1, i);
    if (closed) { corner(0, m - 1, 0); t[n - 1] = t[0]; th[n - 1] = th[0]; cr[n - 1] = cr[0]; }
    const samp = [];
    const arc = (i, a, b, out) => {
      const u1 = segs[a].u, u2 = segs[b].u, P = pts[i], r = t[i] / Math.tan(th[i] / 2);
      const A = [P[0] - u1[0] * t[i], P[1] - u1[1] * t[i]], B = [P[0] + u2[0] * t[i], P[1] + u2[1] * t[i]];
      const nr = cr[i] > 0 ? [-u1[1], u1[0]] : [u1[1], -u1[0]], C = [A[0] + nr[0] * r, A[1] + nr[1] * r];
      const a0 = Math.atan2(A[1] - C[1], A[0] - C[0]), K = Math.max(3, Math.ceil(th[i] * r / 3));
      out.push(A);
      for (let k = 1; k < K; k++) { const q = a0 + cr[i] * th[i] * k / K; out.push([C[0] + Math.cos(q) * r, C[1] + Math.sin(q) * r]); }
      out.push(B);
      return `L${f1(A[0])} ${f1(A[1])}A${f1(r)} ${f1(r)} 0 0 ${cr[i] > 0 ? 1 : 0} ${f1(B[0])} ${f1(B[1])}`;
    };
    let d;
    if (closed && t[0] > 0) {
      const s = [pts[0][0] + segs[0].u[0] * t[0], pts[0][1] + segs[0].u[1] * t[0]];
      d = `M${f1(s[0])} ${f1(s[1])}`;
      samp.push(s);
    } else { d = `M${f1(pts[0][0])} ${f1(pts[0][1])}`; samp.push(pts[0]); }
    for (let i = 1; i < n - 1; i++) d += t[i] > 0 ? arc(i, i - 1, i, samp) : (samp.push(pts[i]), `L${f1(pts[i][0])} ${f1(pts[i][1])}`);
    if (closed && t[0] > 0) { d += arc(0, m - 1, 0, samp) + 'Z'; }
    else { d += `L${f1(pts[n - 1][0])} ${f1(pts[n - 1][1])}`; samp.push(pts[n - 1]); if (closed) d += 'Z'; }
    const cum = [0];
    for (let i = 1; i < samp.length; i++) cum.push(cum[i - 1] + Math.hypot(samp[i][0] - samp[i - 1][0], samp[i][1] - samp[i - 1][1]));

    const k = clamp((s - cum[lo]) / ((cum[hi] - cum[lo]) || 1), 0, 1), a = samp[lo], b = samp[hi];
    return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, Math.atan2(b[1] - a[1], b[0] - a[0])];
  }
  function project(G, x, y) {

    for (let i = 1; i < G.samp.length; i++) {

      const k = clamp(((x - ax) * (bx - ax) + (y - ay) * (by - ay)) / L2, 0, 1);
      const d = Math.hypot(x - ax - (bx - ax) * k, y - ay - (by - ay) * k);

  // 两条线段是否相交（端点碰到不算）
  function cross(a, b, c, d) {
    const o = (p, q, r) => (q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]);
    const d1 = o(c, d, a), d2 = o(c, d, b), d3 = o(a, b, c), d4 = o(a, b, d);
    return ((d1 > 1e-6 && d2 < -1e-6) || (d1 < -1e-6 && d2 > 1e-6)) && ((d3 > 1e-6 && d4 < -1e-6) || (d3 < -1e-6 && d4 > 1e-6));
  }

  // 格子大小：桌面先按宽度定；名字太长、格子会小到站名排不下时，改成比屏幕宽、左右平移着看。手机高度固定，一直平移
  const EXG = 1.9, BOT = 70, MX = w => (w < 700 ? 70 : Math.max(64, w * 0.05));
  function fitG(w, bw, bh, h) {
    const mob = w < 700, gH = ((h || (mob ? 480 : 680)) - (mob ? 96 : 100) - BOT) / (bh + EXG);
    let k = mob ? gH : Math.max(Math.min(gH, (w - MX(w) * 2) / bw), Math.min(gH, 24));
    k = clamp(k, 18, 48);
    return h ? Math.min(k, gH) : k;
  }
  // 线路图的高度由 CSS 按宽度占好（.scene #map），这里只读出来，在这个高度里排
  const reservedH = () => map.getBoundingClientRect().height;
  function layout(N, R0) {
    W = scene.clientWidth;
    mobile = W < 700;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    const grow = ([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
    R0.forEach(r => r.poly.forEach(grow));
    N.dots.forEach(grow);
    const bw = x1 - x0, bh = y1 - y0;
    TOP = mobile ? 96 : 100;
    // 高度用 CSS 占好的那个，这里只在这个高度里定格子大小，页面不会再变高
    H = reservedH();
    g = fitG(W, bw, bh, H);
    WW = Math.max(W, Math.round(bw * g + MX(W) * 2));
    pan = WW > W + 1;
    lw = clamp(g * 0.24, 4.5, 8.5);
    const ox = (WW - bw * g) / 2, oy = TOP + (H - TOP - BOT - (bh + EXG) * g) / 2;
    yE = Math.round(oy + (bh + EXG) * g);
    return ([x, y]) => [ox + (x - x0) * g, oy + (y - y0) * g];
  }

  function build(seed) {
    const rng = seeded(seed);
    // 1. 线网：吸格以后有线压在一起就把格子加密
    let N = null;
    for (let k = 0, sc = 1; k < 3; k++, sc *= 1.25) { N = network(brand, sc); if (!N.clash) break; }
    const R0 = assemble(N);
    const toW = layout(N, R0), rad = g * 0.8;
    R0.forEach(r => { r.pts = r.poly.map(toW); r.len = polyLen(r.poly); });
    // 短的一截：挂在别的线上就是支线，自己孤零零的一小段就当一条穿梭线
    R0.forEach(r => { r.main = r.closed || r.len >= 2.5 || !R0.some(o => o !== r && o.nodes.some(a => r.nodes.some(b => b.id === a.id))); });
    // 2. 线号从左往右编；太短的一截算旁边那条线的支线
    const mains = R0.filter(r => r.main).sort((a, b) => Math.min(...a.poly.map(p => p[0])) - Math.min(...b.poly.map(p => p[0])) || Math.min(...a.poly.map(p => p[1])) - Math.min(...b.poly.map(p => p[1])));
    mains.forEach((r, k) => { r.no = k + 1; r.color = PALETTE[k % PALETTE.length]; });
    R0.filter(r => !r.main).forEach(r => {
      const ids = new Set(r.nodes.map(o => o.id));
      const host = mains.filter(m => m.nodes.some(o => ids.has(o.id))).sort((a, b) => b.len - a.len)[0] || mains[0] || r;
      r.no = host.no || 1;
      r.color = host.color || PALETTE[0];
      r.host = host;
    });
    routes = R0;
    routes.forEach((r, k) => { r.k = k; r.G = roundGeom(r.pts, r.closed, rad); });
    routes.slice().sort((a, b) => a.no - b.no || b.main - a.main).forEach((r, k) => { r.ord = k; });

    // 3. 车站：分叉点是换乘站，线路两头是终点站，中间的直段上按间距放小站
    stations = [];
    const add = st => { st.id = stations.length; st.on = []; stations.push(st); return st; };
    const byNode = new Map();
    routes.forEach(r => r.nodes.forEach(o => {
      if (r.deg.get(o.id) >= 3 && !byNode.has(o.id)) byNode.set(o.id, add({ kind: 'xfer', x: r.pts[o.i][0], y: r.pts[o.i][1] }));
    }));
    const S = Math.max(g * 2.35, 62), minGap = Math.max(g * 1.45, 40);
    routes.forEach(r => {
      const anchors = [], P = r.pts, cum = [0];
      for (let i = 1; i < P.length; i++) cum.push(cum[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
      r.nodes.forEach(o => { if (byNode.has(o.id)) anchors.push(cum[o.i]); });
      if (!r.closed) [0, P.length - 1].forEach(i => {
        const o = r.nodes.find(q => q.i === i);
        if (o && byNode.has(o.id)) return;
        const j = i ? i - 1 : 1, u = [(P[i][0] - P[j][0]) / (Math.hypot(P[i][0] - P[j][0], P[i][1] - P[j][1]) || 1), (P[i][1] - P[j][1]) / (Math.hypot(P[i][0] - P[j][0], P[i][1] - P[j][1]) || 1)];
        add({ kind: 'term', x: P[i][0], y: P[i][1], dir: u, r });
        anchors.push(cum[i]);
      });
      // 每个直段去掉两头圆角占的长度，能放几个放几个；长的直段优先
      const cand = [];
      for (let i = 0; i < P.length - 1; i++) {
        const a = cum[i] + r.G.t[i] + g * 0.3, b = cum[i + 1] - r.G.t[i + 1] - g * 0.3;
        if (b < a) continue;
        const k = Math.max(1, Math.round((b - a) / S));
        for (let j = 0; j < k; j++) cand.push({ s: k === 1 ? (a + b) / 2 : a + (b - a) * j / (k - 1), i, w: b - a });
      }
      cand.sort((p, q) => q.w - p.w);
      const taken = anchors.slice();
      cand.forEach(c => {
        if (taken.some(s => Math.abs(s - c.s) < minGap)) return;
        if (r.closed && taken.some(s => Math.abs(Math.abs(s - c.s) - cum[cum.length - 1]) < minGap)) return;
        const k = (c.s - cum[c.i]) / ((cum[c.i + 1] - cum[c.i]) || 1), A = P[c.i], B = P[c.i + 1];
        const x = A[0] + (B[0] - A[0]) * k, y = A[1] + (B[1] - A[1]) * k;
        if (stations.some(o => Math.hypot(o.x - x, o.y - y) < Math.max(g * 1.15, 34))) return;
        const l = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1;
        taken.push(c.s);
        add({ kind: 'stop', x, y, dir: [(B[0] - A[0]) / l, (B[1] - A[1]) / l], r });
      });
    });
    // 每座站在哪几条线上、在线上的里程
    stations.forEach(st => {
      routes.forEach(r => { const [d, s] = project(r.G, st.x, st.y); if (d < lw * 0.6) st.on.push({ r, s }); });
      st.lines = [...new Set(st.on.map(o => o.r.no))].sort((a, b) => a - b);
    });
    // 孤零零的小点：规划中的车站
    dots = N.dots.map(toW).filter(([x, y]) => !stations.some(o => Math.hypot(o.x - x, o.y - y) < g * 0.7)).map(([x, y]) => add({ kind: 'dot', x, y, lines: [] }));

    // 4. 机场快线：从字底下横穿，每个字挑最靠下、往下看得见快线的那座站，用虚线换乘通道连过去
    const parent = routes.map((r, k) => k), find = k => (parent[k] === k ? k : (parent[k] = find(parent[k])));
    routes.forEach((r, k) => routes.forEach((o, j) => { if (j > k && r.nodes.some(a => o.nodes.some(b => b.id === a.id))) parent[find(j)] = find(k); }));
    comps = new Map();
    routes.forEach((r, k) => { const c = find(k); if (!comps.has(c)) comps.set(c, []); comps.get(c).push(r); });
    const allSegs = [];
    routes.forEach(r => { for (let i = 1; i < r.pts.length; i++) allSegs.push([r.pts[i - 1], r.pts[i], r]); });
    exp = { y: yE, list: [], links: [] };
    const ex0 = Math.round(pan ? 34 : WW * 0.035 + 10), ex1 = Math.round(WW - ex0);
    [...comps.values()].map(rs => {
      const own = stations.filter(st => st.on.some(o => rs.includes(o.r)));
      return own.sort((a, b) => b.y - a.y || a.x - b.x);
    }).sort((a, b) => (a[0]?.x ?? 0) - (b[0]?.x ?? 0)).forEach(own => {
      for (const st of own.slice(0, 4)) {
        if (yE - st.y > g * 4.5) break;
        const A = [st.x, st.y + lw], B = [st.x, yE];
        if (allSegs.some(([p, q]) => cross(A, B, p, q))) continue;
        if (stations.some(o => o !== st && Math.abs(o.x - st.x) < g * 0.6 && o.y > st.y && o.y < yE)) continue;
        if (exp.list.some(e => Math.abs(e.x - st.x) < g * 2.4) || st.x < ex0 + g * 1.6 || st.x > ex1 - g * 1.6) continue;
        const es = add({ kind: 'exp', x: st.x, y: yE, lines: ['E'] });
        exp.list.push(es);
        exp.links.push([st, es]);
        st.link = es;
        es.link = st;
        if (st.kind === 'stop' || st.kind === 'term') st.kind = 'xfer';
        break;
      }
    });
    // 两头出图：左边火车站，右边机场
    const ends = [add({ kind: 'exp', x: ex0, y: yE, lines: ['E'], fixed: { cn: '火车站', py: 'Railway Station' } }),
                  add({ kind: 'exp', x: ex1, y: yE, lines: ['E'], fixed: { cn: '国际机场', py: 'Airport' } })];
    exp.list = [ends[0], ...exp.list.sort((a, b) => a.x - b.x), ends[1]];
    exp.pts = [[ends[0].x, yE], [ends[1].x, yE]];
    exp.G = roundGeom(exp.pts, false, rad);
    exp.list.forEach(e => { e.on = [{ r: exp, s: e.x - ends[0].x }]; });
    exp.no = 'E';
    exp.color = INK;
    // 没接上快线的字块（比如“河”里悬着的“口”）：找离已连通部分最近、中间不隔线的两座站，修一条步行换乘通道
    const compOf = st => (st.kind === 'exp' ? -1 : st.on.length ? find(st.on[0].r.k) : null);
    const joined = new Set([-1]);
    exp.links.forEach(([st]) => joined.add(compOf(st)));
    if (joined.size === 1 && routes.length) joined.add(find(0));
    for (let pass = 0; pass < comps.size; pass++) {
      let best = null;
      stations.forEach(a => {
        const ca = compOf(a);
        if (ca === null || joined.has(ca) || a.kind === 'dot') return;
        stations.forEach(b => {
          const cb = compOf(b);
          if (cb === null || !joined.has(cb) || b.kind === 'dot') return;
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d > g * 3.6 || (best && d >= best.d)) return;
          const A = [a.x, a.y], B = [b.x, b.y];
          if (allSegs.some(([p, q]) => cross(A, B, p, q))) return;
          if (stations.some(o => o !== a && o !== b && segDist(o.x, o.y, a.x, a.y, b.x, b.y) < g * 0.6)) return;
          if (exp.links.some(([p, q]) => cross(A, B, [p.x, p.y], [q.x, q.y]))) return;

        });
      });

      exp.links.push([best.a, best.b, true]);
      [best.a, best.b].forEach(o => { if (o.kind === 'stop' || o.kind === 'term') o.kind = 'xfer'; });
      (best.a.walk = best.a.walk || []).push(best.b);
      (best.b.walk = best.b.walk || []).push(best.a);
      joined.add(best.ca);
    }

    // 5. 站名
    const used = new Set();
    stations.forEach(st => { const nm = st.fixed || makeName(rng, st.kind === 'xfer' || st.kind === 'exp', used); st.cn = nm.cn; st.py = nm.py; });
    routes.forEach(r => {
      const ends = r.closed ? null : [0, r.G.total].map(s => stations.filter(st => st.on.some(o => o.r === r && Math.abs(o.s - s) < lw)).sort((a, b) => b.on.length - a.on.length)[0]);
      r.ends = ends;
    });
  }

  /* ---------- 河：只走横和 45°，少和线路并行，过河尽量垂直 ---------- */
  function planRiver(rng) {
    const st = g, C = Math.ceil(WW / st) + 3, y0 = TOP + g * 0.4, y1 = yE - g * 1.4;
    const rows = Math.max(2, Math.floor((y1 - y0) / st));
    const segs = [];
    routes.forEach(r => { for (let i = 1; i < r.pts.length; i++) segs.push([r.pts[i - 1], r.pts[i]]); });
    const X = c => (c - 1) * st, Y = j => y0 + j * st;
    const memo = new Map();
    const stepCost = (c, j, d) => {
      const key = c * 4096 + j * 4 + d + 1;
      if (memo.has(key)) return memo.get(key);
      const a = [X(c), Y(j)], b = [X(c + 1), Y(j + d)], ux = b[0] - a[0], uy = b[1] - a[1], l = Math.hypot(ux, uy);
      const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      let pen = 0;
      for (const [p, q] of segs) {
        const vx = q[0] - p[0], vy = q[1] - p[1], m = Math.hypot(vx, vy) || 1, c2 = Math.abs(ux * vx + uy * vy) / (l * m);
        const dd = Math.min(segDist(mid[0], mid[1], ...p, ...q), segDist(a[0], a[1], ...p, ...q), segDist(b[0], b[1], ...p, ...q));
        if (c2 > 0.95 && dd < g * 1.05) pen += 9;
        else if (cross(a, b, p, q)) pen += c2 < 0.2 ? 0.35 : 1.1;
        else if (dd < g * 0.45) pen += 2.5;
      }
      stations.forEach(o => { if (segDist(o.x, o.y, ...a, ...b) < g * 0.6) pen += 4; });
      memo.set(key, pen);
      return pen;
    };
    // 河从左上斜着流到右下，中间拐几道弯
    const ph = rng() * 6, target = c => rows * (0.12 + 0.76 * c / C) + Math.sin(c * 0.22 + ph) * rows * 0.12;
    const pref = (c, j) => 0.05 * (j - target(c)) ** 2;
    // 动态规划：状态是（列，行，上一步方向）
    let cost = [];
    for (let j = 0; j <= rows; j++) for (let d = -1; d <= 1; d++) cost[j * 3 + d + 1] = pref(0, j);
    const back = [];
    for (let c = 0; c < C; c++) {
      const nc = new Array((rows + 1) * 3).fill(1e18), nb = new Array((rows + 1) * 3).fill(-1);
      for (let j = 0; j <= rows; j++) for (let pd = -1; pd <= 1; pd++) {
        const cur = cost[j * 3 + pd + 1];
        if (cur >= 1e17) continue;
        for (let d = -1; d <= 1; d++) {
          const jj = j + d;
          if (jj < 0 || jj > rows) continue;
          const v = cur + stepCost(c, j, d) + (d !== pd ? 1.8 : 0) + (d ? 0.3 : 0) + pref(c + 1, jj);
          if (v < nc[jj * 3 + d + 1]) { nc[jj * 3 + d + 1] = v; nb[jj * 3 + d + 1] = j * 3 + pd + 1; }
        }
      }
      back.push(nb);
      cost = nc;
    }
    let best = 0;
    cost.forEach((v, k) => { if (v < cost[best]) best = k; });
    const pts = [];
    for (let c = C; c >= 0; c--) {
      const j = Math.floor(best / 3);
      pts.push([X(c), Y(j)]);
      if (c > 0) best = back[c - 1][best];
    }
    pts.reverse();
    const P = tidy(pts.map(p => [Math.round(p[0] * 100) / 100, Math.round(p[1] * 100) / 100]));
    const a = PRE[(rng() * PRE.length) | 0];
    return { pts: P, G: roundGeom(P, false, g * 2.4), cn: a[0] + '江', py: (a[1] + ' jiang').toUpperCase() };
  }

  /* ---------- 站名排版：候选位置里挑第一个不压线、不压字、不出界的 ---------- */
  const FN = b => `${b ? 700 : 500} 12.5px "Noto Sans SC", "Microsoft YaHei", sans-serif`;
  const FP = '600 9px Overpass, "Segoe UI", sans-serif';
  const mctx = canvas(4, 4).getContext('2d');
  const tw = (t, f) => { mctx.font = f; return mctx.measureText(t).width; };
  const ptRect = (x, y, R) => Math.hypot(Math.max(R.x - x, 0, x - R.x - R.w), Math.max(R.y - y, 0, y - R.y - R.h));

  /* ---------- 开场：线路一条条铺出来，车站依次亮起 ---------- */

  /* ---------- 时钟和到站屏 ---------- */

  /* ---------- 看一条线：这条亮，别的淡 ---------- */

    allLines().forEach(r => r.grp.classList.toggle('hi', !!nos && nos.has(r.no)));

  /* ---------- 站卡：两个方向的下一班车，按图上真在跑的车算 ---------- */

  /* ---------- 规划路线：按站换乘的最短时间，换一次线多算三分钟 ---------- */
  function graph() {
    const adj = stations.map(() => []);
    const link = (a, b, r, w) => { adj[a.st.id].push({ to: b.st.id, r, w, s0: a.s, s1: b.s }); adj[b.st.id].push({ to: a.st.id, r, w, s0: b.s, s1: a.s }); };
    allLines().forEach(r => {
      const o = r.stops;
      const k = r === exp ? 0.3 : 0.5;   // 每格几分钟，快线快一些
      for (let i = 1; i < o.length; i++) link(o[i - 1], o[i], r, (o[i].s - o[i - 1].s) / g * k + 1);
      if (r.closed && o.length > 2) link(o[o.length - 1], { st: o[0].st, s: o[0].s + r.G.total }, r, (o[0].s + r.G.total - o[o.length - 1].s) / g * k + 1);
    });

  function showPlan(a, b) {

  }

  const world = e => { const r = scene.getBoundingClientRect(); return [e.clientX - r.left + (pan ? S.panX : 0), e.clientY - r.top]; };
  function pickStation(x, y) {

  /* ---------- 主循环 ---------- */

    build(seed);
    river = planRiver(seeded(seed * 31 + 5));
    placeLabels();
    render();
    allLines().forEach(r => {
      r.stops = stations.filter(st => st.on.some(o => o.r === r)).map(st => ({ st, s: st.on.find(o => o.r === r).s })).sort((a, b) => a.s - b.s);
      r.cool = 0;
      r.p = -1;
    });
    exp.ends = [exp.list[0], exp.list[exp.list.length - 1]];
    exp.k = 'E';
    ADJ = graph();
    S.trains = [];
    S.origin = S.plan = S.hover = S.line = null;
    S.panX = 0;
    S.panDir = 1;
    S.panHold = 1.5;
    $('#plan').classList.remove('on');
    showCard(null);
    scene.classList.toggle('pan', pan);
    $('#hint').textContent = pan ? '左右拖动看全图 · 点两座车站规划路线' : '点两座车站，看怎么换乘';
    $('#hint').style.opacity = 0;
    if (replay && S.started) { S.t0 = performance.now(); S.drawn = false; }
    else if (S.started && !REDUCED) drawIn(1e3);   // 改窗口大小：直接画完，时钟接着走
    if (REDUCED) {   // 不放动画：直接是上午八点，每条线停着一列车
      S.started = true;
      S.t0 = -1e6;
      drawIn(1e3);
      S.drawn = true;
      S.clk = 480;
      allLines().forEach(r => { if (want(r, 480)) { const t = spawn(r, (r.stops.length / 2) | 0, 1, 1e9); t.a = 1; drawTrain(t); } });
      board();
    }
    window.__metro = { S, stations, routes, exp, river, obst, g, lw, W, H, WW, mobile, pan, labels };
    ready = true;
  }
  new IntersectionObserver(es => es.forEach(e => { visible = e.isIntersecting; })).observe(scene);
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!visible || !ready || REDUCED) return;
    const r = scene.getBoundingClientRect();
    if (!S.started && (r.top < innerHeight * 0.75 || r.bottom <= innerHeight + 4)) { S.started = true; S.t0 = now; }
    if (!S.started) return;
    if (!S.drawn) {
      drawIn((now - S.t0) / 1000);
      if (S.drawn && !S.touched) $('#hint').style.opacity = 1;
    }
    tick(dt);
    if (S.drawn) dispatch(dt);
    S.trains.forEach(tr => { moveTrain(tr, dt * (S.ffwd > 0 ? 2.2 : 1)); drawTrain(tr); });
    S.trains = S.trains.filter(tr => { if (tr.gone > 0.6) { tr.el.remove(); return false; } return true; });
    // 手机：画面比屏幕宽，慢慢左右平移；手指拖过以后停一会儿再接着走
    if (pan && !S.drag && !S.drawn && !S.touched) {   // 开场：镜头跟着铺线从左往右走
      S.panX = (WW - W) * smooth((now - S.t0) / 1000 / Math.max(1, S.drawEnd - 0.8));
      S.panDir = -1;
      S.panHold = 2.5;
    } else if (pan && !S.drag) {
      S.panHold -= dt;
      if (S.panHold <= 0 && WW > W) {
        const max = WW - W, edge = Math.min(S.panX, max - S.panX);
        S.panX = clamp(S.panX + S.panDir * dt * (8 + Math.min(1, edge / 60) * 16), 0, max);
        if (S.panX <= 0 || S.panX >= max) { S.panDir *= -1; S.panHold = 2.5; }
      }
    }
    if (pan) map.setAttribute('viewBox', `${f1(S.panX)} 0 ${W} ${H}`);
    S.cardT -= dt;
    if (S.hover && S.cardT <= 0) { S.cardT = 0.5; showCard(S.hover); }
    board();
  }

  const fontsReady = () => Promise.all([
    document.fonts.load(`700 100px Overpass`, brand), document.fonts.load(`500 100px "Noto Sans SC"`, brand),
    document.fonts.load('500 12.5px "Noto Sans SC"', '金银青白东西南北站换乘'), document.fonts.load('700 12.5px "Noto Sans SC"', '金银青白东西南北站换乘'),
    document.fonts.load('600 9px Overpass'), document.fonts.load('600 34px "Overpass Mono"'),
  ]).catch(() => {});
  fontsReady().then(() => { setup(false); requestAnimationFrame(loop); });
  let tmr, lastW = innerWidth;
  $('#rename').addEventListener('click', () => { seed++; setup(true); });
  $('#ffwd').addEventListener('click', () => { if (S.drawn) S.ffwd = 1440; });
  addEventListener('resize', () => {
    if (innerWidth === lastW) return;
    lastW = innerWidth;
    clearTimeout(tmr);
    tmr = setTimeout(() => setup(false), 250);
  });
</script>
</body>
</html>
