<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>结霜 · 一千零一页</title>
<meta name="description" content="冬夜隔着一扇窗往外看，玻璃上的冰花从品牌名的笔画里长出来，一枝枝蕨叶似的枝晶爬满窗角。按住玻璃哈一口气，冰会化开、起雾，还能用手指在雾上写字。">
<meta name="theme-color" content="#0c1322">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-css" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Playfair+Display:ital,wght@0,900;1,600&display=swap" media="print" onload="this.media='all'">
<style>
  :root {
    --night: #0c1322;
    --ink: #f3e7d5;
    --muted: #b9a68d;
    --faint: #8a785f;
    --sill: 66px;
    --frame: 30px;
    --serif: "Playfair Display", "Noto Serif SC", Georgia, serif;
    --cn: "Noto Serif SC", "Songti SC", "SimSun", serif;
    --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); }
  body { color: var(--ink); font: 14px/1.5 var(--sans); -webkit-tap-highlight-color: transparent; }

  /* 角落的页码，点了回目录；用反色混合，深浅底上都看得见 */
  .folio {
    position: absolute; top: 12px; right: 16px; z-index: 20;
    font: 500 11px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .14em;
    color: #fff; mix-blend-mode: difference; opacity: .5; text-decoration: none; transition: opacity .2s;
  }
  .folio:hover, .folio:focus-visible { opacity: 1; }

  .win { position: fixed; inset: 0; height: 100dvh; }
  /* 画布不做 CSS 透明度动画（整屏画布做合成动画会卡一下），淡入在着色器里做 */
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #gl.press { cursor: none; }

  /* 窗台：品牌名、提示和按钮 */
  .sill {
    position: absolute; left: 0; right: 0; bottom: 0; height: var(--sill); z-index: 2;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
    padding: 4px calc(var(--frame) + 4px) 0; pointer-events: none;
    opacity: 0; transition: opacity 1s ease;
  }
  .on .sill { opacity: 1; }
  .sill > * { pointer-events: auto; }
  .title { display: flex; align-items: baseline; gap: 12px; min-width: 0; text-shadow: 0 1px 0 rgb(0 0 0 / .45); }
  .title b { font: italic 600 22px/1 var(--serif); letter-spacing: .01em; white-space: nowrap; }
  .title small { font: 600 12.5px/1.2 var(--cn); color: var(--muted); letter-spacing: .12em; white-space: nowrap; }
  .hint { margin: 0; font: 13px/1.4 var(--sans); color: var(--muted); letter-spacing: .06em; text-align: center; transition: opacity .6s; text-shadow: 0 1px 0 rgb(0 0 0 / .45); }
  .hint.off { opacity: 0; }
  .ctl { display: flex; justify-content: flex-end; gap: 8px; }
  .ctl button {
    display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 14px; border-radius: 16px;
    font: 13px/1 var(--sans); color: var(--ink); background: rgb(20 13 8 / .45); border: 1px solid rgb(243 231 213 / .2);
    cursor: pointer; transition: border-color .2s, background .2s, opacity .3s;
  }
  .ctl button:hover { border-color: rgb(243 231 213 / .45); background: rgb(20 13 8 / .6); }
  .ctl button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .ctl button:disabled { opacity: .4; cursor: default; }
  .ctl svg { width: 14px; height: 14px; flex: none; }
  #sound .wave { display: none; }
  #sound[aria-pressed="true"] .wave { display: inline; }
  #sound[aria-pressed="true"] .mute { display: none; }

  @media (max-width: 640px) {
    :root { --sill: 84px; }
    .sill { grid-template-columns: 1fr auto; grid-template-rows: auto auto; row-gap: 6px; column-gap: 10px; padding: 8px 14px calc(6px + env(safe-area-inset-bottom)); align-content: center; }
    .title { grid-column: 1 / -1; justify-content: space-between; }
    .title b { font-size: 20px; }
    .hint {
      position: absolute; left: 50%; bottom: calc(var(--sill) + 14px); transform: translateX(-50%);
      padding: 6px 14px; border-radius: 16px; background: rgb(8 12 22 / .55); color: var(--ink); white-space: nowrap;
      font-size: 12.5px; backdrop-filter: blur(4px);
    }
    .ctl { grid-column: 1 / -1; justify-content: stretch; }
    .ctl button { flex: 1; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sill { transition: none; }
  }
</style>
</head>
<body>
<a class="folio" href="index.html" title="回到目录">一千零一页 · 009</a>

<main class="win" id="win">
  <canvas id="gl" aria-label="冬夜的窗，玻璃上的冰花从品牌名里长出来；按住玻璃是哈气，按住拖动是用手指在雾上写字"></canvas>
  <div class="sill">
    <div class="title"><b id="f-name">Lumen</b><small>结霜 · 窗外零下十四度</small></div>
    <p class="hint off" id="hint" aria-live="polite">按住玻璃，哈一口气</p>
    <div class="ctl">
      <button type="button" id="again" disabled><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M8 1.5v13M2.4 4.75l11.2 6.5M2.4 11.25l11.2-6.5M8 1.5 6.4 3.1M8 1.5l1.6 1.6M8 14.5l-1.6-1.6M8 14.5l1.6-1.6"/></svg><span>重新结霜</span></button>
      <button type="button" id="sound" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z"/><path class="wave" d="M10.6 5.6a3.4 3.4 0 0 1 0 4.8M12.4 3.9a5.8 5.8 0 0 1 0 8.2"/><path class="mute" d="M11 6.2l3 3.6M14 6.2l-3 3.6"/></svg><span>声音 · 关</span></button>
    </div>
  </div>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const Q = new URLSearchParams(location.search);
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 品牌名默认 Lumen，网址加 ?name=星河 这样的参数可以换
  const brand = (Q.get('name') || '').trim().slice(0, 16) || 'Lumen';
  $('#f-name').textContent = brand;
  document.querySelectorAll('.bn').forEach(b => { b.textContent = brand; });
  const isCJK = s => /[㐀-鿿豈-﫿]/.test(s);
  const BRAND_FONT = px => `900 ${px}px "Playfair Display", "Noto Serif SC", Georgia, serif`;

  // 固定种子的随机数：同一个名字每次长出来的冰花一样
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const seedOf = s => [...s].reduce((h, ch) => Math.imul(h ^ ch.codePointAt(0), 16777619), 2166136261);

  const glc = $('#gl'), hintEl = $('#hint'), againBtn = $('#again'), soundBtn = $('#sound');
  let W = 0, H = 0, dpr = 1, mobile = false, FR = 30, SILL = 66, RAIL = 22;
  let glass = { x: 0, y: 0, w: 1, h: 1 }, cell = 1.4, GW = 1, GH = 1;

  function layout() {
    W = innerWidth; H = innerHeight;
    dpr = Math.min(devicePixelRatio || 1, 2);
    mobile = W < 640;
    FR = mobile ? 12 : Math.round(clamp(W * 0.026, 22, 38));
    SILL = mobile ? 84 : 66;
    RAIL = mobile ? 10 : Math.round(FR * 0.75);
    glass = { x: FR, y: FR, w: W - 2 * FR, h: H - SILL - RAIL - FR };
    cell = mobile ? 1.15 : 1.2;
    // 格子数封顶，防止大屏上一步算太久
    while ((glass.w / cell) * (glass.h / cell) > 640000) cell += 0.1;
    RK = clamp(1.4 / cell, 1, 1.4); BUDGET = Math.round(BUDGET0 * RK);
    GW = Math.max(16, Math.round(glass.w / cell));
    GH = Math.max(16, Math.round(glass.h / cell));
    document.documentElement.style.setProperty('--sill', SILL + 'px');
    document.documentElement.style.setProperty('--frame', FR + 'px');
    glc.width = Math.round(W * dpr);
    glc.height = Math.round(H * dpr);
  }

  // ---------- 冰核、晶粒和耗尽带：都在模拟网格上，行号从下往上 ----------
  let AUX, LET, INIT, letBox;
  function buildAux() {
    const R = rng(seedOf(brand) ^ 0x9e3779b9);
    const cv = document.createElement('canvas'); cv.width = GW; cv.height = GH;
    const m = cv.getContext('2d', { willReadFrequently: true });
    m.fillStyle = '#000'; m.fillRect(0, 0, GW, GH);
    m.font = BRAND_FONT(100);
    const mt = m.measureText(brand);
    const tw = (mt.actualBoundingBoxLeft + mt.actualBoundingBoxRight) || mt.width;
    const th = (mt.actualBoundingBoxAscent + mt.actualBoundingBoxDescent) || 70;
    const size = 100 * Math.min(GW * (mobile ? 0.84 : 0.74) / tw, GH * (mobile ? 0.2 : 0.34) / th);
    m.font = BRAND_FONT(size);
    const m2 = m.measureText(brand);
    const cx = GW / 2 - (m2.actualBoundingBoxRight - m2.actualBoundingBoxLeft) / 2;
    const capH = (m2.actualBoundingBoxAscent + m2.actualBoundingBoxDescent) || size * 0.7;
    const baseY = GH * (mobile ? 0.44 : 0.47) + (m2.actualBoundingBoxAscent - m2.actualBoundingBoxDescent) / 2;
    m.fillStyle = '#fff'; m.textBaseline = 'alphabetic';
    m.fillText(brand, cx, baseY);
    letBox = { y0: baseY - m2.actualBoundingBoxAscent, y1: baseY + m2.actualBoundingBoxDescent, capH };
    const md = m.getImageData(0, 0, GW, GH).data;
    const N = GW * GH;
    const inL = new Float32Array(N);
    for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) inL[y * GW + x] = md[((GH - 1 - y) * GW + x) * 4] / 255;
    // 到字的距离（倒角两遍）
    const D = new Float32Array(N).fill(1e9);
    for (let i = 0; i < N; i++) if (inL[i] > 0.5) D[i] = 0;
    for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
      const i = y * GW + x; let d = D[i];
      if (x > 0) d = Math.min(d, D[i - 1] + 1);
      if (y > 0) { d = Math.min(d, D[i - GW] + 1); if (x > 0) d = Math.min(d, D[i - GW - 1] + 1.414); if (x < GW - 1) d = Math.min(d, D[i - GW + 1] + 1.414); }
      D[i] = d;
    }
    for (let y = GH - 1; y >= 0; y--) for (let x = GW - 1; x >= 0; x--) {
      const i = y * GW + x; let d = D[i];
      if (x < GW - 1) d = Math.min(d, D[i + 1] + 1);
      if (y < GH - 1) { d = Math.min(d, D[i + GW] + 1); if (x < GW - 1) d = Math.min(d, D[i + GW + 1] + 1.414); if (x > 0) d = Math.min(d, D[i + GW - 1] + 1.414); }
      D[i] = d;
    }
    // 字周围一圈不结冰：冰把附近的水汽吸走了（耗尽带），也让字形更清楚
    const MOAT = Math.round(clamp(capH * 0.05, 4, 9));
    const aux = new Uint8Array(N * 4);
    // 晶粒朝向：Voronoi，每块一个随机的晶轴角
    const grains = Array.from({ length: Math.round(16 + N / 14000) }, () => [R() * GW, R() * GH, R()]);
    for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
      const i = y * GW + x;
      let best = 1e18, g = 0;
      for (const [gx, gy, a] of grains) { const d = (gx - x) * (gx - x) + (gy - y) * (gy - y); if (d < best) { best = d; g = a; } }
      aux[i * 4] = Math.round(inL[i] * 255);
      aux[i * 4 + 1] = Math.round(g * 255);
      aux[i * 4 + 2] = D[i] > 0.5 && D[i] <= MOAT ? 0 : 255;
    }
    // 冰核时间表：单位是 30 步
    const slot = steps => clamp(Math.round(steps / 30), 1, 255);
    const disc = (cx, cy, r, s) => {
      for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r) {
        const X = Math.round(cx + x), Y = Math.round(cy + y);
        if (X < 0 || Y < 0 || X >= GW || Y >= GH) continue;
        const i = Y * GW + X;
        if (D[i] > 0.5 && D[i] <= MOAT) continue;
        if (!aux[i * 4 + 3] || aux[i * 4 + 3] > s) aux[i * 4 + 3] = s;
      }
    };
    // 字里：密密的小核，最先冻上
    for (let i = 0; i < N; i++) if (inL[i] > 0.5 && R() < 0.0016) disc(i % GW, (i / GW) | 0, 2, slot(20 + R() * 260));
    // 字外：贴着耗尽带外沿
    let ring = 0;
    const ringN = Math.round(clamp(N * 0.00012, 18, 60));
    for (let k = 0; k < ringN * 40 && ring < ringN; k++) {
      const x = R() * GW, y = R() * GH, d = D[(y | 0) * GW + (x | 0)];
      if (d > MOAT + 1 && d < MOAT + 3.5) { disc(x, y, 2, slot(900 + R() * 2400)); ring++; }
    }
    // 窗边：底边最冷，角上最早，两侧次之，顶边少
    const edgeN = Math.round(clamp((GW + GH) * 0.028, 14, 46));
    for (let k = 0; k < edgeN; k++) {
      const r = R(); let x, y, t = 400 + R() * 3600;
      if (r < 0.3) { x = R() * GW; y = 1 + R() * 2; }
      else if (r < 0.7) { x = R() < 0.5 ? 1 + R() * 2 : GW - 2 - R() * 2; y = R() * GH; }
      else { x = R() * GW; y = GH - 2 - R() * 2; }
      const corner = Math.min(x, GW - x) + Math.min(y, GH - y);
      if (corner < GH * 0.25) t *= 0.4;
      disc(x, y, 2, slot(t));
    }
    // 玻璃中间零星几处（灰尘、划痕）
    for (let k = 0; k < Math.round(clamp(N / 70000, 3, 8)); k++) disc(R() * GW, R() * GH, 2, slot(1800 + R() * 3200));
    // 初始状态：冷玻璃，底边积着一点水
    const init = new Float32Array(N * 4);
    for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
      const i = y * GW + x;
      init[i * 4 + 1] = 0;
      init[i * 4 + 3] = y < 5 ? 0.45 * (1 - y / 5) * (0.6 + 0.4 * R()) : 0;
    }
    AUX = aux; INIT = init;
    LET = new Uint8Array(N); for (let i = 0; i < N; i++) LET[i] = aux[i * 4];
  }

  // ---------- 窗外：虚掉的街灯、人家的窗、雪地，全是散景 ----------
  const bgCv = document.createElement('canvas');
  function buildBg() {
    const R = rng(0x5eed + (mobile ? 7 : 0));
    const bw = Math.max(64, Math.round(W * 0.5)), bh = Math.max(64, Math.round(H * 0.5));
    bgCv.width = bw; bgCv.height = bh;
    const o = bgCv.getContext('2d');
    const s = bw / 640;
    const hor = bh * (mobile ? 0.58 : 0.6);
    const sky = o.createLinearGradient(0, 0, 0, bh);
    sky.addColorStop(0, '#050916'); sky.addColorStop(0.42, '#0b1530'); sky.addColorStop(hor / bh, '#2b2538'); sky.addColorStop(Math.min(0.99, hor / bh + 0.06), '#1d1f2e'); sky.addColorStop(1, '#232838');
    o.fillStyle = sky; o.fillRect(0, 0, bw, bh);
    // 城市的光把低云染成暗橙
    const glow = o.createRadialGradient(bw * 0.55, hor, 0, bw * 0.55, hor, bw * 0.7);
    glow.addColorStop(0, 'rgba(120,70,40,.32)'); glow.addColorStop(1, 'rgba(120,70,40,0)');
    o.fillStyle = glow; o.fillRect(0, 0, bw, bh);
    // 远处的楼：很虚的深色块
    o.fillStyle = 'rgba(8,10,20,.75)';
    for (let x = -20 * s; x < bw; ) {
      const w = (26 + R() * 60) * s, hh = (18 + R() * 70) * s * (mobile ? 1.4 : 1);
      const g = o.createLinearGradient(0, hor - hh, 0, hor);
      g.addColorStop(0, 'rgba(10,12,24,0)'); g.addColorStop(0.18, 'rgba(10,12,24,.7)'); g.addColorStop(1, 'rgba(12,14,26,.85)');
      o.fillStyle = g; o.fillRect(x, hor - hh, w, hh + 2);
      x += w * (0.7 + R() * 0.5);
    }
    // 雪地：被街灯照出一片片暖色
    const ground = o.createLinearGradient(0, hor, 0, bh);
    ground.addColorStop(0, '#2a2c3a'); ground.addColorStop(1, '#3a3c4b');
    o.fillStyle = ground; o.fillRect(0, hor + 2 * s, bw, bh - hor);
    const disc = (x, y, r, col, a, rim = 0.35) => {
      const g = o.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${col},${a * 0.5})`);
      g.addColorStop(0.78, `rgba(${col},${a * 0.62})`);
      g.addColorStop(0.93, `rgba(${col},${a * (0.62 + rim)})`);
      g.addColorStop(1, `rgba(${col},0)`);
      o.fillStyle = g; o.beginPath(); o.arc(x, y, r, 0, Math.PI * 2); o.fill();
    };
    o.globalCompositeOperation = 'lighter';
    // 路灯照在雪地上的光斑
    const lamps = [];
    const nL = mobile ? 3 : 5;
    for (let k = 0; k < nL; k++) lamps.push([bw * ((k + 0.2 + R() * 0.6) / nL), hor - (6 + R() * 22) * s * (mobile ? 1.6 : 1), 0.55 + R() * 0.6]);
    for (const [x] of lamps) {
      const g = o.createRadialGradient(x, hor + 30 * s, 0, x, hor + 30 * s, 120 * s);
      g.addColorStop(0, 'rgba(255,160,80,.26)'); g.addColorStop(1, 'rgba(255,160,80,0)');
      o.save(); o.scale(1, 0.45); o.fillStyle = g; o.beginPath(); o.arc(x, (hor + 30 * s) / 0.45, 120 * s, 0, Math.PI * 2); o.fill(); o.restore();
    }
    // 远处的小灯
    for (let k = 0; k < 70; k++) {
      const x = R() * bw, y = hor - R() * 46 * s * (mobile ? 1.6 : 1) + R() * 10 * s;
      const warm = R() < 0.7;
      disc(x, y, (2.2 + R() * 3.4) * s, warm ? '255,190,120' : '200,215,255', 0.35 + R() * 0.4, 0.2);
    }
    // 人家的窗：中等大小的暖色光斑
    for (let k = 0; k < (mobile ? 18 : 30); k++) {
      const x = R() * bw, y = hor - (14 + R() * 60) * s * (mobile ? 1.5 : 1);
      const c = R() < 0.8 ? (R() < 0.5 ? '255,196,128' : '255,170,96') : '190,205,255';
      disc(x, y, (4 + R() * 7) * s, c, 0.2 + R() * 0.24);
    }
    // 路灯本身：大而亮的钠灯光斑
    for (const [x, y, z] of lamps) disc(x, y, (11 + 13 * z) * s, z > 0.9 ? '255,176,96' : '255,158,78', 0.42 + 0.22 * (1.15 - z), 0.3);
    // 一红一绿两个信号灯
    disc(bw * (0.18 + R() * 0.2), hor - 22 * s, 6 * s, '255,70,60', 0.55);
    disc(bw * (0.62 + R() * 0.2), hor - 18 * s, 5.5 * s, '90,255,170', 0.4);
    o.globalCompositeOperation = 'source-over';
  }

  // ---------- 窗框和窗台：画一次，盖在最上面 ----------
  const frameCv = document.createElement('canvas');
  function buildFrame() {
    const R = rng(0xf2a3e);
    frameCv.width = Math.round(W * dpr); frameCv.height = Math.round(H * dpr);
    const o = frameCv.getContext('2d');
    o.setTransform(dpr, 0, 0, dpr, 0, 0);
    o.clearRect(0, 0, W, H);
    const g = glass, gx1 = g.x + g.w, gy1 = g.y + g.h, sillY = H - SILL;
    o.save();
    o.beginPath(); o.rect(0, 0, W, H); o.rect(g.x, g.y, g.w, g.h); o.clip('evenodd');
    // 深色胡桃木，屋里的灯从左下方照过来
    o.fillStyle = '#2b1d13'; o.fillRect(0, 0, W, H);
    // 木纹：横料横纹，竖料竖纹
    const grain = (x0, y0, w, h, vertical) => {
      o.save(); o.beginPath(); o.rect(x0, y0, w, h); o.clip();
      const n = Math.ceil((vertical ? w : h) / 1.6);
      for (let k = 0; k < n; k++) {
        const t = (k + R() * 0.8) / n;

    if (d > 0.6) {
      const dt = Math.max(1, now - p.lt) / 1000;
      S.speed = S.speed * 0.6 + (d / dt) * 0.4;
      if (S.speed > 70 || d > 3) { S.wipes.push([p.lx, p.ly, x, y]); S.wiped += d; S.act = 1; S.lastAct = S.t; }
      p.lx = x; p.ly = y; p.lt = now;
    }
  });
  const release = e => {
    if (!S.press || S.press.id !== e.pointerId) return;
    if (S.breathT > 0.6 && !S.firstBreath) S.firstBreath = true;
    S.press = null; S.speed = 0;
    glc.classList.remove('press');
  };
  glc.addEventListener('pointerup', release);
  glc.addEventListener('pointercancel', release);
  glc.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') S.parT = [0, 0]; });
  againBtn.addEventListener('click', () => {
    if (S.thaw >= 0 || !S.started) return;
    S.thaw = 0; againBtn.disabled = true; S.act = 1; S.lastAct = S.t;
  });

  // ---------- 提示 ----------
  const HINTS = () => ['按住玻璃，哈一口气', mobile ? '再用手指在雾上写字' : '再按住拖动，在雾上写字', '松开以后，冰会从边上慢慢长回来'];
  function setHint(k) {
    if (S.hint === k) return;
    S.hint = k;
    hintEl.classList.add('off');
    if (k > 0) setTimeout(() => { if (S.hint === k) { hintEl.textContent = HINTS()[k - 1]; hintEl.classList.remove('off'); } }, 380);
  }

  // ---------- 主循环 ----------
  let last = performance.now(), T0 = 0, wipeShown = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = clamp((now - last) / 1000, 0, 0.05);
    last = now;
    if (!S.started || glFailed) return;
    if (S.prewarming) {
      if (prewarmStep()) { S.prewarming = false; S.opening = false; show(); againBtn.disabled = false; }
      return;
    }
    S.t += dt;
    const t = S.t;
    S.fade = onAt ? (REDUCED ? 1 : smooth(0, 1, (now - onAt) / 1000)) : 0;
    // 视差、阵风
    S.par[0] += (S.parT[0] - S.par[0]) * Math.min(1, dt * 3);
    S.par[1] += (S.parT[1] - S.par[1]) * Math.min(1, dt * 3);
    if (!S.glint[0] && !S.glint[1]) S.glint = [W * 0.5, H * 0.5];
    if (!REDUCED) S.glint[0] += dt * 3;
    const gust = 0.5 + 0.3 * Math.sin(t * 0.31) + 0.2 * Math.sin(t * 0.83 + 1.7);
    S.wind = 12 + 34 * gust;
    // 哈气：按住不动时越吹越大，吹久了气就弱了；一拖动就变成手指
    const p = S.press;
    let target = 0;
    if (p) {
      S.speed *= Math.pow(0.02, dt);
      const still = S.speed < 60;
      if (still) { S.breathT += dt; S.breathX += (p.lx - S.breathX) * Math.min(1, dt * 4); S.breathY += (p.ly - S.breathY) * Math.min(1, dt * 4); }
      target = still ? (S.breathT < 2.6 ? 1 : Math.max(0.3, 1 - (S.breathT - 2.6) / 1.4)) : 0;
      S.breathR = (mobile ? 26 : 34) + (mobile ? 42 : 60) * smooth(0, 2.4, S.breathT);
      S.act = 1; S.lastAct = t;
    }
    S.b += (target - S.b) * Math.min(1, dt * (target > S.b ? 5 : 9));
    if (S.b < 0.002) S.b = 0;
    // 化冰重来
    if (S.thaw >= 0) {
      S.thaw += dt / 1.8;
      S.act = 1; S.lastAct = t;
      if (S.thaw >= 1) {
        S.thaw = -1;
        resetSim();
        S.openSteps = 0; S.opening = true; S.openT0 = t; S.acc = 0;
        setTimeout(() => { againBtn.disabled = false; }, 4000);
      }
    }
    // 这一帧跑多少步
    let rate = 0;
    if (S.opening) { rate = S.openSteps < BUDGET ? openRate(t - S.openT0) : 0; if (S.openSteps >= BUDGET) S.opening = false; }
    const since = t - S.lastAct;
    if (S.act) {
      const r2 = (since < 2.5 ? 460 : 460 * Math.max(0, 1 - (since - 2.5) / 11)) * RK;
      rate = Math.max(rate, r2);
      if (since > 13.5) S.act = 0;
    }
    if (REDUCED && !S.press && S.thaw < 0 && !S.act) rate = 0;
    S.acc += rate * dt;
    let n = Math.floor(S.acc);
    S.acc -= n;
    n = Math.min(n, mobile ? 16 : 24);
    const fogActive = since < 30;
    if (n > 0) simStep(n, dt / n, true);
    else if (fogActive) simStep(1, dt, false);
    S.wipes.length = 0;
    prep();
    // 车：每隔半分钟到一分钟开过一辆
    if (!REDUCED && t > S.nextCar && !S.car) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      S.car = { t0: t, dir, x: 0, y: H * (mobile ? 0.6 : 0.63), k: 0 };
      S.nextCar = t + 38 + Math.random() * 30;
      if (SND.on && SND.s) SND.s.car(SND.ac.currentTime + 0.05, dir);
    }
    if (S.car) {
      const u = (t - S.car.t0) / 5.6;
      if (u >= 1) S.car = null;
      else { S.car.x = W * (S.car.dir > 0 ? -0.1 + 1.2 * u : 1.1 - 1.2 * u); S.car.k = 1.3 * Math.sin(Math.PI * u) ** 0.6; }
    }
    draw(REDUCED ? 0 : t);   // 减少动画：闪点和雪都停住
    // 声音
    if (SND.on && SND.s && SND.ac.state === 'running') {
      const at = SND.ac.currentTime;
      const squeak = p && S.speed > 60 ? clamp((S.speed - 60) / 700, 0, 1) : 0;
      SND.s.set(at, { gust, breath: S.b, squeak });
      const cr = rate * 0.012 + (S.b > 0.3 ? 1.5 : 0);
      let k = cr * dt;
      while (k > 0) { if (Math.random() < Math.min(1, k)) SND.s.crack(at + 0.03 + Math.random() * dt, 0.05 + Math.random() * 0.1); k -= 1; }
    }
    // 提示
    const ot = t - (S.openT0 || 0);
    if (S.hint === 0 && ot > 4.2 && !S.firstBreath) setHint(1);
    if (S.firstBreath && S.wiped < 140 && S.hint !== 2 && !S.press) setHint(2);
    if (S.wiped >= 140 && !S.press && S.hint === 2) { setHint(3); wipeShown = t; }
    if (S.hint === 3 && t - wipeShown > 6) setHint(-1);
  }

  // ---------- 降级：没有 WebGL2 或不能渲染浮点时，画一张静止的窗 ----------
  function fallback() {
    const o = glc.getContext('2d');
    if (!o) return;
    o.setTransform(dpr, 0, 0, dpr, 0, 0);
    o.drawImage(bgCv, 0, 0, W, H);
    const g = glass;
    o.save(); o.beginPath(); o.rect(g.x, g.y, g.w, g.h); o.clip();
    const R = rng(7);
    o.strokeStyle = 'rgba(225,235,250,.55)'; o.lineCap = 'round';
    const fern = (x, y, a, len, depth) => {
      if (depth > 3 || len < 3) return;
      const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
      o.lineWidth = Math.max(0.6, 2.4 - depth * 0.6); o.beginPath(); o.moveTo(x, y); o.lineTo(x2, y2); o.stroke();
      for (let s = 0.15; s < 0.95; s += 0.12) {
        const px = x + (x2 - x) * s, py = y + (y2 - y) * s, l = len * (0.36 - s * 0.22);
        fern(px, py, a - 1.047, l, depth + 1); fern(px, py, a + 1.047, l, depth + 1);
      }
    };
    for (let k = 0; k < 26; k++) {
      const side = k % 4, u = R();
      const x = side === 0 ? g.x + u * g.w : side === 1 ? g.x + g.w : side === 2 ? g.x + u * g.w : g.x;
      const y = side === 0 ? g.y + g.h : side === 1 ? g.y + u * g.h : side === 2 ? g.y : g.y + u * g.h;
      const a = [-Math.PI / 2, Math.PI, Math.PI / 2, 0][side] + (R() - 0.5) * 1.2;
      fern(x, y, a, 40 + R() * 90, 0);
    }
    o.restore();
    o.font = BRAND_FONT(Math.min(g.w * 0.18, g.h * 0.32));
    o.textAlign = 'center'; o.textBaseline = 'middle';
    o.shadowColor = 'rgba(210,225,255,.6)'; o.shadowBlur = 18;
    o.fillStyle = 'rgba(236,242,252,.92)';
    o.fillText(brand, W / 2, g.y + g.h * 0.47);
    o.shadowBlur = 0;
    o.drawImage(frameCv, 0, 0, W, H);
  }

  // ---------- 启动：等字体（最多 2 秒），先画一帧再淡入，然后开场 ----------
  const fontCss = $('#font-css');
  const cssReady = new Promise(r => { if (fontCss.media === 'all') r(); else { fontCss.addEventListener('load', r); fontCss.addEventListener('error', r); } });
  const fontsReady = () => cssReady.then(() => Promise.all([
    document.fonts.load(BRAND_FONT(100), brand), document.fonts.load(`italic 600 22px "Playfair Display"`, brand),
    document.fonts.load('600 12px "Noto Serif SC"', '结霜窗外零下十四度'),
  ])).catch(() => {});
  let glFailed = !glOK;
  try { if (glOK) initGL(); } catch (err) { console.error(err); glFailed = true; }
  let buildMs = 0, onAt = 0;
  function build() {
    const tb = performance.now();
    layout();
    buildAux(); buildBg(); buildFrame();
    buildMs = performance.now() - tb;
    if (glFailed) { fallback(); return; }
    try { upload(); } catch (err) { console.error(err); glFailed = true; fallback(); }
  }
  // 减少动画：开场在画面出来之前分几帧算完（一次塞给显卡会超时被重置），之后只在手碰到玻璃时才动
  function prewarmStep() {
    simStep(Math.min(300, BUDGET - S.openSteps), 0, true);
    gl.flush();
    return S.openSteps >= BUDGET;
  }
  function beginPrewarm() { S.prewarming = true; S.opening = true; S.openT0 = -100; S.openSteps = 0; }
  // 先画好第一帧并等显卡做完（着色器在第一次用时才真正编译），再开始淡入，免得淡入头一下卡住
  function show() {
    prep(); draw(0); gl.finish();
    requestAnimationFrame(() => requestAnimationFrame(() => { glc.classList.add('on'); $('#win').classList.add('on'); onAt = performance.now(); }));
  }
  function start() {
    build();
    S.started = true;
    S.t = 0;
    if (glFailed) { glc.classList.add('on'); $('#win').classList.add('on'); hintEl.classList.add('off'); againBtn.disabled = true; return; }
    simStep(1, 0, false);
    if (REDUCED) { beginPrewarm(); return; }
    show();
    S.opening = true; S.openT0 = 1.0;
    setTimeout(() => { againBtn.disabled = false; }, 6000);
  }
  Promise.race([fontsReady(), new Promise(r => setTimeout(r, 2000))]).then(() => {
    start();
    last = performance.now();
    requestAnimationFrame(frame);
  });
  let tmr, lastSize = innerWidth + 'x' + innerHeight;
  addEventListener('resize', () => {
    clearTimeout(tmr);
    tmr = setTimeout(() => {
      const k = innerWidth + 'x' + innerHeight;
      if (k === lastSize) return;
      lastSize = k;
      const wasStarted = S.started;
      S.opening = false; S.openSteps = 0; S.car = null; S.thaw = -1;
      build();
      if (!wasStarted || glFailed) return;
      if (REDUCED) beginPrewarm(); else { S.opening = true; S.openT0 = S.t + 0.2; }
    }, 250);
  });

  // 测试钩子
  window.__frost = { S, get grid() { return [GW, GH, cell]; }, get buildMs() { return buildMs; }, get onAt() { return onAt; }, get glass() { return glass; }, renderOffline, BUDGET,
    readIce() {
      if (glFailed) return null;
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbS[cur]);
      const px = new Float32Array(GW * GH * 4);
      gl.readPixels(0, 0, GW, GH, gl.RGBA, gl.FLOAT, px);
      let ice = 0, fog = 0, wet = 0, Tm = 0;
      for (let i = 0; i < GW * GH; i++) { ice += px[i * 4] > 0.5; Tm = Math.max(Tm, px[i * 4 + 1]); fog += px[i * 4 + 2]; wet += px[i * 4 + 3]; }
      const n = GW * GH;
      return { ice: ice / n, fog: fog / n, wet: wet / n, Tmax: Tm, steps: S.steps, open: S.openSteps };
    },
    iceAt(x, y) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbS[cur]);
      const gx = Math.round((x - glass.x) / cell), gy = Math.round((glass.y + glass.h - y) / cell);
      const px = new Float32Array(4); gl.readPixels(clamp(gx, 0, GW - 1), clamp(gy, 0, GH - 1), 1, 1, gl.RGBA, gl.FLOAT, px);
      return Array.from(px);
    },
  };
})();
</script>
</body>
</html>
