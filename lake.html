<!doctype html>
<html lang="zh-CN">
<head>

<title>倒影 · 一千零一页</title>
<meta name="description" content="黄昏的湖，品牌名是栈道上的几层楼高的大字，水里的倒影实时算出来；太阳落山以后，字上的灯泡一盏盏亮起来。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Noto+Serif+SC:wght@900&display=swap">
<style>
  :root {
    --bg: #0b0b0d;
    --panel: #151518;
    --line: #26262b;
    --text: #ececef;
    --muted: #9a9aa3;
    --sans: "DM Sans", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --slab: "Alfa Slab One", "Noto Serif SC", Georgia, serif;
    /* 页脚：暮色的蓝紫，落日的橙，灯泡的暖白 */
    --f-bg: #0d0c15;
    --f-text: #efe8e1;
    --f-muted: #9a93a1;
    --f-faint: #625c6c;
    --f-line: #201d2a;
    --sun: #ff9d64;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.7 var(--sans); }

  /* 角落的页码，点了回目录；用反色混合，深浅底上都看得见 */
  .folio {
    position: absolute; top: 12px; right: 16px; z-index: 20;
    font: 500 11px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .14em;
    color: #fff; mix-blend-mode: difference; opacity: .5; text-decoration: none; transition: opacity .2s;
  }
  .folio:hover, .folio:focus-visible { opacity: 1; }

  /* ---------- 页脚 ---------- */
  .foot { background: var(--f-bg); color: var(--f-text); border-top: 1px solid var(--f-line); }
  .foot-top {
    display: grid; grid-template-columns: minmax(280px, 1.6fr) repeat(3, minmax(110px, 1fr)); gap: 40px 48px;
    max-width: 1320px; margin: 0 auto; padding: 68px clamp(16px, 4vw, 48px) 44px;
  }
  .brand .name { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brand .name b { font: 400 34px/1 var(--slab); letter-spacing: .01em; font-weight: 400; }
  .brand .name small { font: 500 12px/1 var(--sans); letter-spacing: .22em; color: var(--f-muted); }
  .brand .tag { margin: 16px 0 24px; color: var(--f-muted); font-size: 14.5px; line-height: 1.75; max-width: 30ch; text-wrap: pretty; }
  .status { display: inline-flex; align-items: center; gap: 9px; font: 12.5px/1 var(--sans); color: var(--f-muted); padding: 8px 13px 8px 10px; border: 1px solid var(--f-line); border-radius: 999px; font-variant-numeric: tabular-nums; }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--f-faint); flex: none; transition: background .8s, box-shadow .8s; }
  .status[data-on="gold"] i { background: #ffc06a; box-shadow: 0 0 10px 1px rgb(255 192 106 / .6); }
  .status[data-on="set"] i { background: #ff8a52; box-shadow: 0 0 12px 2px rgb(255 138 82 / .65); }
  .status[data-on="glow"] i { background: #ff7896; box-shadow: 0 0 12px 2px rgb(255 120 150 / .55); }
  .status[data-on="blue"] i { background: #8f9cff; box-shadow: 0 0 10px 1px rgb(143 156 255 / .55); }
  .status[data-on="night"] i { background: #ffd28e; box-shadow: 0 0 10px 2px rgb(255 210 142 / .7); }
  .col h3 { margin: 4px 0 14px; font: 500 12px/1 var(--sans); letter-spacing: .2em; color: var(--f-faint); }
  .col a { display: block; color: var(--f-text); opacity: .84; text-decoration: none; font-size: 14.5px; padding: 3px 0; }
  .col a:hover { opacity: 1; }

  .scene { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .scene canvas { display: block; width: 100%; }
  .scene .over { position: absolute; inset: 0; height: 100%; z-index: 2; }
  /* 上下两头和页脚的底色接起来，画面像是从页面里长出来的 */
  .scene::before, .scene::after { content: ""; position: absolute; left: 0; right: 0; z-index: 1; pointer-events: none; }
  .scene::before { top: 0; height: 72px; background: linear-gradient(var(--f-bg), rgb(13 12 21 / 0)); }
  .scene::after { bottom: 0; height: 40px; background: linear-gradient(rgb(13 12 21 / 0), var(--f-bg)); }

  .foot-legal {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px;
    max-width: 1320px; margin: 0 auto; padding: 16px clamp(16px, 4vw, 48px) 22px;
    font-size: 12.5px; color: var(--f-faint);
  }
  .foot-legal a { color: var(--f-muted); text-decoration: none; }
  .foot-legal a:hover { color: var(--f-text); }
  .foot-legal .ctl { margin-left: auto; display: flex; gap: 8px; }
  .foot-legal button {
    display: inline-flex; align-items: center; gap: 7px;
    font: 12.5px/1 var(--sans); color: var(--f-muted); cursor: pointer;
    background: transparent; border: 1px solid var(--f-line); border-radius: 999px; padding: 8px 13px;
  }
  .foot-legal button:hover { color: var(--f-text); border-color: #3a3448; }
  .foot-legal button svg { width: 14px; height: 14px; flex: none; }
  #sound[aria-pressed="true"] { color: var(--f-text); border-color: #4a3f5a; }
  #sound .wave { opacity: 0; transition: opacity .3s; }
  #sound[aria-pressed="true"] .wave { opacity: 1; }
  #sound[aria-pressed="true"] .mute { opacity: 0; }

  @media (max-width: 760px) {
    .scene::before { height: 44px; }
    .foot-top { grid-template-columns: 1fr 1fr; padding-top: 52px; gap: 32px 24px; }
    .brand { grid-column: 1 / -1; }
    .brand .name b { font-size: 30px; }
    .foot-legal .ctl { margin-left: 0; width: 100%; }
    .foot-legal button { flex: 1; justify-content: center; }
  }
</style>
</head>
<body>

<a class="folio" href="index.html" title="回到目录">一千零一页 · 003</a>

<footer class="foot">
  <div class="foot-top">
    <div class="brand">
      <div class="name"><b id="f-name">Lumen</b><small>湖畔酒店</small></div>
      <p class="tag">湖边四十间房，每一间都朝西。<br>天黑以前，我们不开灯。</p>
      <div class="status" id="status" data-on="gold"><i></i><span id="status-text">湖边 18:31 · 离日落还有 16 分钟</span></div>
    </div>
    <nav class="col" aria-label="住"><h3>住</h3><a href="#">客房</a><a href="#">湖景套房</a><a href="#">长住</a><a href="#">预订</a></nav>
    <nav class="col" aria-label="湖上"><h3>湖上</h3><a href="#">日落划船</a><a href="#">夜钓</a><a href="#">观星</a><a href="#">湖畔餐厅</a></nav>
    <nav class="col" aria-label="关于"><h3>关于</h3><a href="#">我们的故事</a><a href="#">交通</a><a href="#">招聘</a><a href="#">联系</a></nav>
  </div>
  <div class="scene" id="scene">
    <canvas id="gl" aria-hidden="true"></canvas>
    <canvas id="over" class="over" aria-label="黄昏的湖，品牌名是栈道上的大字；在水面上划过会起涟漪，点一下是扔一颗石子"></canvas>
  </div>
  <div class="foot-legal">
    <span>© 2026 <span class="bn">Lumen</span> 湖畔酒店</span>
    <a href="#">隐私</a><a href="#">条款</a>
    <div class="ctl">
      <button type="button" id="sound" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z"/><path class="wave" d="M10.6 5.6a3.4 3.4 0 0 1 0 4.8M12.4 3.9a5.8 5.8 0 0 1 0 8.2"/><path class="mute" d="M11 6.2l3 3.6M14 6.2l-3 3.6"/></svg><span>声音 · 关</span></button>
      <button type="button" id="replay">再看一次日落</button>
    </div>
  </div>
</footer>

<script>
  const $ = s => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
  const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
  // 品牌名默认 Lumen，网址加 ?name=星河 这样的参数可以换
  const brand = (new URLSearchParams(location.search).get('name') || '').trim().slice(0, 16) || 'Lumen';
  $('#f-name').textContent = brand;
  document.querySelectorAll('.bn').forEach(b => { b.textContent = brand; });
  const isCJK = s => /[⺀-鿿豈-﫿＀-￯]/.test(s);
  // 字母用粗衬线的 Alfa Slab One（老式灯泡招牌的味道），中文退到思源宋体最粗的那一档
  const signFont = s => isCJK(brand) ? `900 ${s}px "Noto Serif SC", "Alfa Slab One", serif` : `400 ${s}px "Alfa Slab One", "Noto Serif SC", Georgia, serif`;

  /* ---------- 随机数与噪声 ---------- */
  function rng(seed) {
    return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function hash2(x, y) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  const fade = t => t * t * (3 - 2 * t);
  function noise1(x, seed) { const i = Math.floor(x), f = fade(x - i); return lerp(hash2(i, seed), hash2(i + 1, seed), f); }
  const fbm1 = (x, seed) => noise1(x, seed) * 0.55 + noise1(x * 2.1 + 5, seed + 1) * 0.3 + noise1(x * 4.4 + 9, seed + 2) * 0.15;

  // Zhang-Suen 细化：把 0/1 点阵一层层削成一像素宽的骨架（点阵最外一圈要是空的）
  function thin(src, w, h) {
    const a = Uint8Array.from(src), del = [];
    for (let changed = true; changed;) {
      changed = false;
      for (let pass = 0; pass < 2; pass++) {
        del.length = 0;
        for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
          const i = y * w + x;
          if (!a[i]) continue;
          const p2 = a[i - w], p3 = a[i - w + 1], p4 = a[i + 1], p5 = a[i + w + 1];
          const p6 = a[i + w], p7 = a[i + w - 1], p8 = a[i - 1], p9 = a[i - w - 1];
          const b = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9;
          if (b < 2 || b > 6) continue;
          const t = (!p2 & p3) + (!p3 & p4) + (!p4 & p5) + (!p5 & p6) + (!p6 & p7) + (!p7 & p8) + (!p8 & p9) + (!p9 & p2);
          if (t !== 1) continue;
          if (pass === 0 ? p2 * p4 * p6 || p4 * p6 * p8 : p2 * p4 * p8 || p2 * p6 * p8) continue;
          del.push(i);
        }
        if (del.length) changed = true;
        for (const i of del) a[i] = 0;
      }
    }
    return a;
  }
  // 骨架上一个点的邻居：上下左右直接算，斜着的只在拐角两边都空时才算
  function skelNeighbors(a, w, i, out) {
    out.length = 0;
    const up = a[i - w], dn = a[i + w], lf = a[i - 1], rt = a[i + 1];
    if (up) out.push(i - w);
    if (dn) out.push(i + w);
    if (lf) out.push(i - 1);
    if (rt) out.push(i + 1);
    if (a[i - w - 1] && !up && !lf) out.push(i - w - 1);
    if (a[i - w + 1] && !up && !rt) out.push(i - w + 1);
    if (a[i + w - 1] && !dn && !lf) out.push(i + w - 1);
    if (a[i + w + 1] && !dn && !rt) out.push(i + w + 1);
    return out;
  }
  // 把骨架拆成一段段：端点、分叉点之间各一段，没有端点的闭合圈（比如 o）单独一段
  function skelPaths(a, w) {
    const n = a.length, deg = new Uint8Array(n), used = new Uint8Array(n), nb = [], nb2 = [], paths = [];
    for (let i = 0; i < n; i++) if (a[i]) deg[i] = skelNeighbors(a, w, i, nb).length;
    const walk = (start, next) => {
      const p = [start];
      let prev = start, cur = next;
      while (cur !== undefined) {
        p.push(cur);
        if (deg[cur] !== 2 || cur === start) break;
        used[cur] = 1;
        skelNeighbors(a, w, cur, nb2);
        const nx = nb2[0] === prev ? nb2[1] : nb2[0];
        prev = cur;
        cur = nx;
      }
      return p;
    };
    for (let i = 0; i < n; i++) {
      if (!a[i] || deg[i] === 2) continue;
      for (const j of skelNeighbors(a, w, i, nb).slice()) {
        if (deg[j] !== 2) { if (j > i) paths.push([i, j]); }
        else if (!used[j]) paths.push(walk(i, j));
      }
    }
    for (let i = 0; i < n; i++) {
      if (!a[i] || used[i] || deg[i] !== 2) continue;
      used[i] = 1;
      paths.push(walk(i, skelNeighbors(a, w, i, nb)[0]));
    }
    return { paths, deg };
  }
  // 横竖各一遍的滑动平均
  function boxBlur(a, w, h, r) {
    if (r < 1) return;
    const t = new Float32Array(a.length), n = r * 2 + 1;
    for (let y = 0; y < h; y++) {
      let s = 0;
      for (let k = -r; k <= r; k++) s += a[y * w + clamp(k, 0, w - 1)];
      for (let x = 0; x < w; x++) { t[y * w + x] = s / n; s += a[y * w + Math.min(w - 1, x + r + 1)] - a[y * w + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let s = 0;
      for (let k = -r; k <= r; k++) s += t[clamp(k, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) { a[y * w + x] = s / n; s += t[Math.min(h - 1, y + r + 1) * w + x] - t[Math.max(0, y - r) * w + x]; }
    }
  }

  const scene = $('#scene'), glc = $('#gl'), ovc = $('#over'), octx = ovc.getContext('2d');
  const statusEl = $('#status'), statusText = $('#status-text');

  /* ---------- 构图 ----------
     针孔相机站在离水面 1 个单位高的地方，平视；屏幕坐标 x ∈ [-ASP, ASP]，y ∈ [-1, 1]，地平线在 yH。
     栈道和字在 D1 远处，对岸的山和树在 D2 远处，各当成一块竖着的“背景板”；水面上一点的倒影，
     是从这一点沿反射方向射出去，先碰哪块板就是哪块，两块都没碰到就是天空。 */
  let W, H, DPR, ASP, mobile, G = {};
  function layout() {
    W = scene.clientWidth;
    DPR = Math.min(devicePixelRatio || 1, 2, 3800 / Math.max(W, 1));
    mobile = W < 680;
    H = Math.round(mobile ? clamp(W * 1.22, 420, 600) : clamp(W * 0.5, 380, 700));
    ASP = W / H;
    const F = 2, yH = mobile ? 0.3 : 0.17, g1 = mobile ? 0.056 : 0.06, g2 = 0.006;
    G = { F, yH, D1: F / g1, D2: F / g2, yw1: yH - g1, yw2: yH - g2 };
    G.deck = G.yw1 + (mobile ? 0.032 : 0.036);   // 栈道面：离水大约 0.6 个单位
    // 字框：电脑上偏左，右边留给落日和小船；手机上铺满一行，太阳从字后面落下去
    G.TB = mobile ? { x0: -ASP * 0.9, x1: ASP * 0.9, y0: G.deck, y1: G.deck + 0.34 }
                  : { x0: -ASP * 0.88, x1: ASP * 0.46, y0: G.deck, y1: G.deck + 0.6 };
    G.LR = { x0: -ASP * 1.12, x1: ASP * 1.12, y0: G.yw1 - 0.006, y1: Math.min(1.08, G.TB.y1 + 0.13) };
    G.FR = { x0: -ASP * 1.2, x1: ASP * 1.2, y0: G.yw2 - 0.006, y1: yH + 0.36 };
    G.BR = { x0: -ASP * 1.2, x1: ASP * 1.2, y0: G.yw2 - 0.03, y1: yH + 1.85 };
    G.ppu = H * DPR / 2;                          // 每个屏幕单位多少设备像素
    G.sunX = ASP * (mobile ? 0.5 : 0.72);
    G.sunR = mobile ? 0.042 : 0.046;
    G.moon = mobile ? [-ASP * 0.52, 0.86] : [ASP * 0.56, yH + 0.56];
    G.moonR = mobile ? 0.02 : 0.022;
    G.boat = mobile ? { sx: ASP * 0.62, z: 25, s: 0.8 } : { sx: ASP * 0.7, z: 27, s: 1 };
    glc.style.height = ovc.style.height = H + 'px';
    glc.width = ovc.width = Math.round(W * DPR);
    glc.height = ovc.height = Math.round(H * DPR);
  }
  const SX = sx => (sx / ASP + 1) / 2 * W, SY = sy => (1 - sy) / 2 * H;         // 屏幕坐标 → CSS 像素
  const proj = (x, y, z) => [x * G.F / z, G.yH + (y - 1) * G.F / z];           // 世界坐标 → 屏幕坐标
  const ppw = z => G.F / z * H / 2;                                            // z 远处，一个世界单位是多少 CSS 像素

  /* ---------- 对岸：远山、近山、树林、几户人家 ---------- */
  let FAR = null;
  const farTop = x => G.yH + 0.035 + 0.08 * fbm1(x * 0.85 + 3.1, 11) + 0.085 * Math.exp(-(((x - G.sunX * 0.95) / 0.8) ** 2));
  const midTop = x => G.yH + 0.008 + 0.045 * fbm1(x * 1.9 + 17, 23) + 0.03 * Math.exp(-(((x - G.sunX * 1.1) / 0.45) ** 2));
  function buildFar() {
    const R = G.FR, ppu = G.ppu, fw = Math.round((R.x1 - R.x0) * ppu), fh = Math.round((R.y1 - R.y0) * ppu);
    const X = x => (x - R.x0) * ppu, Y = y => (R.y1 - y) * ppu, Xi = px => R.x0 + px / ppu;
    const mk = () => { const c = canvas(fw, fh).getContext('2d', { willReadFrequently: true }); return c; };
    const alb = mk(), hz = mk(), win = mk(), wr = mk();
    const ridge = (fn, col, haze) => {
      for (const [c, fill] of [[alb, col], [hz, `rgb(${haze * 255},0,0)`]]) {
        c.fillStyle = fill;
        c.beginPath();
        c.moveTo(0, fh);
        for (let px = 0; px <= fw + 2; px += 2) c.lineTo(px, Y(fn(Xi(px))));
        c.lineTo(fw, fh);
        c.fill();
      }
    };
    ridge(farTop, '#2f2c42', 0.72);
    ridge(midTop, '#1e1c2a', 0.44);
    // 树林：一列一列算高度，尖的是松，圆的是阔叶树
    const r = rng(31), prof = new Float32Array(fw + 1), base = G.yw2 + 0.0025;
    for (let x = R.x0; x < R.x1;) {
      const conifer = r() < 0.72, h = (0.007 + 0.026 * r() * (0.35 + noise1(x * 3, 5))) * (mobile ? 1.15 : 1);
      const wd = h * (conifer ? 0.42 : 0.9) * (0.7 + 0.5 * r());
      const c0 = X(x), hw = wd / 2 * ppu;
      for (let px = Math.max(0, Math.floor(c0 - hw)); px <= Math.min(fw, Math.ceil(c0 + hw)); px++) {
        const u = (px - c0) / hw;
        if (Math.abs(u) > 1) continue;
        const v = conifer ? (1 - Math.abs(u)) * (0.86 + 0.14 * Math.cos(u * 30)) : (Math.sqrt(1 - u * u) * 0.75 + 0.25 * (1 - Math.abs(u))) * (0.9 + 0.1 * Math.sin(u * 17 + x * 50));
        prof[px] = Math.max(prof[px], h * v);
      }
      x += wd * (0.35 + 0.5 * r());
    }
    for (const [c, fill] of [[alb, '#141618'], [hz, 'rgb(56,0,0)']]) {
      c.fillStyle = fill;
      c.beginPath();
      c.moveTo(0, fh);
      for (let px = 0; px <= fw; px++) c.lineTo(px, Y(base + prof[px] + 0.0015 * noise1(px * 0.05, 3)));
      c.lineTo(fw, fh);
      c.fill();
    }
    // 几户人家：小木屋，窗户天黑以后陆续亮
    for (const hx of [-0.98, -0.62, -0.16, 0.36, 0.6, 0.93]) {
      const x = hx * ASP + (r() - 0.5) * 0.06, w = (0.018 + 0.012 * r()) * (mobile ? 1.2 : 1), h = w * (0.55 + 0.2 * r()), y0 = base + 0.001;

  /* ---------- 栈道和字：字面奶白，侧边黄铜，字面上沿笔画中线嵌一串灯泡 ---------- */
  let LET = null;
  function buildLetters() {

    const left = cx - tw * k / 2, right = cx + tw * k / 2, top = bottom - th * k;

    const font = signFont(size);

    const vpx = X(0), vpy = Y(G.yH), depth = 1.3, sBack = G.D1 / (G.D1 + depth);

    alb.fillStyle = '#2b1f17';
    for (let k2 = 1; k2 < 3; k2++) alb.fillRect(X(pierL), Y(G.deck) + deckH * ppu * k2 / 3, X(pierR) - X(pierL), Math.max(1, ppu * 0.0012));

      sil.font = font;
      sil.fillStyle = '#fff';
      sil.fillText(brand, ox, oy);
    }
    // 字面：奶白，上亮下暗一点；边上压一道细线，分开正面和侧边
    at(alb, 1);
    alb.font = font;
    const fg = alb.createLinearGradient(0, top, 0, bottom);
    fg.addColorStop(0, '#f3ebde');
    fg.addColorStop(1, '#ddd0bd');
    alb.fillStyle = fg;
    alb.fillText(brand, ox, oy);
    alb.lineWidth = Math.max(1, size * 0.006);

    alb.strokeText(brand, ox, oy);
    alb.globalCompositeOperation = 'source-over';

    rid.globalCompositeOperation = 'source-over';

    rimC.drawImage(rid.canvas, 0, 0);

  function placeBulbs(font, size, ox, oy, lw, lh) {

  /* ---------- 水面的细波纹：几十道整数波数的余弦叠起来，可以无缝平铺；存坡度和坡度平方，缩小几级取样时还能知道“看不清的那部分有多糙” ---------- */

    const N = 256, r = rng(19), waves = [];

  /* ---------- 着色器 ---------- */

in vec2 a; void main() { gl_Position = vec4(a, 0., 1.); }`;
  const COMMON = `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform vec4 uView;
uniform float uAsp, uF, uYH, uD1, uD2, uT, uWinT, uMist, uBulbT;
uniform vec2 uSun, uBulbX;
uniform float uSunR;
uniform vec3 uZen, uHor, uGlow, uHalo, uCLit, uCDark, uFarAmb, uWinCol, uMistCol;
uniform sampler2D uNoise, uFA, uFB;
uniform vec4 uFRect;

vec2 scr() { return vec2(mix(uView.x, uView.z, gl_FragCoord.x / uRes.x), mix(uView.y, uView.w, gl_FragCoord.y / uRes.y)); }

vec3 skyBase(vec2 s) {

  const RTF = () => floatRT ? [gl.RGBA16F, gl.HALF_FLOAT] : [gl.RGBA8, gl.UNSIGNED_BYTE];
  function rt(k, w, h, mip, tex = TX[k]) {
    bindT(k, tex);
    const [fmt, type] = RTF();
    gl.texImage2D(gl.TEXTURE_2D, 0, fmt, w, h, 0, gl.RGBA, type, null);
    params(gl.CLAMP_TO_EDGE, mip);
    if (mip && aniso) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, 16);
  }
  let BGW, BGH, SIM = null;
  function uploadAll() {
    bindT('uFA');
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, FAR.w, FAR.h, 0, gl.RGBA, gl.UNSIGNED_BYTE, FAR.fa);
    gl.generateMipmap(gl.TEXTURE_2D);
    params(gl.CLAMP_TO_EDGE, true);
    bindT('uFB');
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, FAR.w, FAR.h, 0, gl.RGBA, gl.UNSIGNED_BYTE, FAR.fb);
    gl.generateMipmap(gl.TEXTURE_2D);
    params(gl.CLAMP_TO_EDGE, true);
    uploadLetters();
    // 天空 + 对岸：半分辨率，倒影要的是糊的版本
    BGW = Math.round((G.BR.x1 - G.BR.x0) * G.ppu * 0.5);
    BGH = Math.round((G.BR.y1 - G.BR.y0) * G.ppu * 0.5);
    rt('uSky', BGW, BGH, false);
    rt('uBg', BGW, BGH, true);
    gl.bindFramebuffer(gl.FRAMEBUFFER, FBO.bg);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, TX.uSky, 0);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, TX.uBg, 0);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
    if (simOK) setupSim();
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  function uploadLetters() {
    bindT('uLA');
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, LET.w, LET.h, 0, gl.RGBA, gl.UNSIGNED_BYTE, LET.la);
    gl.generateMipmap(gl.TEXTURE_2D);
    params(gl.CLAMP_TO_EDGE, true);
    bindT('uLB');
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, LET.w, LET.h, 0, gl.RGBA, gl.UNSIGNED_BYTE, LET.lb);
    params(gl.CLAMP_TO_EDGE, false);
    bindT('uGlowT');
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, LET.gw, LET.gh, 0, gl.RGBA, gl.FLOAT, LET.glow);
    params(gl.CLAMP_TO_EDGE, false);
    rt('uLit', LET.w, LET.h, true);
    gl.bindFramebuffer(gl.FRAMEBUFFER, FBO.lit);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, TX.uLit, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  // 涟漪只在近处这一片水里算：按“最近处一格大约 6 个像素”定格子，太多就放粗
  function setupSim() {
    const z0 = G.F / (G.yH + 1) * 0.97, z1 = Math.min(13, G.D1 * 0.6);
    let cell = clamp(6 / ppw(z0), 0.01, 0.08);
    const x1 = ASP * z1 / G.F * 1.03;
    let nx = Math.ceil(2 * x1 / cell), nz = Math.ceil((z1 - z0) / cell);
    const cap = 900000;
    if (nx * nz > cap) { const f = Math.sqrt(nx * nz / cap); cell *= f; nx = Math.ceil(2 * x1 / cell); nz = Math.ceil((z1 - z0) / cell); }
    SIM = { x0: -x1, z0, x1, z1: z0 + nz * cell, cell, nx, nz, cur: 'uSim', on: false, idle: 0, acc: 0, dirty: true };
    rt('uSim', nx, nz, false, TX.uSim);
    rt('uSim', nx, nz, false, TX.simB);
    gl.bindFramebuffer(gl.FRAMEBUFFER, FBO.simA);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, TX.uSim, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, FBO.simB);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, TX.simB, 0);
    SIM.texs = [TX.uSim, TX.simB];
    SIM.fbos = [FBO.simA, FBO.simB];
    SIM.i = 0;
  }

  /* ---------- 一天里的光：五个关键时刻的颜色，中间插值 ----------
     0 金色时刻，1 太阳落到山后，2 晚霞最浓，3 蓝调时刻，4 入夜 */
  const hex = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255].map(v => Math.pow(v, 2.2)); };
  const PAL = {
    zen:   [['#4a66a8', .9], ['#43569a', .86], ['#3b3b7b', .78], ['#1f2c63', .62], ['#0b1130', .55]],
    hor:   [['#ffc68c', 1.1], ['#ffa074', 1.05], ['#e48a96', 1.0], ['#5e62a2', .66], ['#151d42', .5]],
    glow:  [['#ffa24c', 2.3], ['#ff8840', 2.1], ['#ff5a3c', 1.5], ['#a6516f', .5], ['#26214a', .16]],
    clit:  [['#ffc98c', 1.05], ['#ffa66e', 1.3], ['#ff6e8e', 1.3], ['#7466a4', .48], ['#222a52', .3]],
    cdark: [['#5c5f90', .5], ['#5c4e82', .48], ['#563f72', .46], ['#2b315f', .42], ['#0d1228', .38]],
    fill:  [['#c9aeb0', .56], ['#c4909c', .48], ['#8e6a98', .36], ['#454f84', .24], ['#161c3a', .17]],
    far:   [['#6c6284', .34], ['#605272', .3], ['#4c3e64', .25], ['#242c54', .18], ['#0c1128', .15]],
    body:  [['#15211f', .42], ['#161b1f', .4], ['#141621', .36], ['#0b1020', .3], ['#05080f', .26]],
    mist:  [['#f6caa8', .38], ['#eda08c', .42], ['#d78c9b', .4], ['#6c72aa', .36], ['#1f2850', .3]],
    win:   [['#ffc678', 1], ['#ffc678', 1], ['#ffc678', 1], ['#ffc678', 1], ['#ffc678', 1]],
  };
  const PALL = Object.fromEntries(Object.entries(PAL).map(([k, v]) => [k, v.map(([h, i]) => hex(h).map(c => c * i))]));
  function ramp(key, k) {
    const a = PALL[key], i = clamp(Math.floor(k), 0, 3), f = smooth(clamp(k - i, 0, 1));
    return a[i].map((c, j) => c + (a[i + 1][j] - c) * f);
  }
  const mix3 = (a, b, t) => a.map((c, j) => c + (b[j] - c) * t);
  const T_BULB = 41.5, T_WIN = 33, T_BOAT = 37, T_FLY = 50;
  function env(t) {
    const k = t < 20 ? t / 20 : t < 32 ? 1 + (t - 20) / 12 : t < 46 ? 2 + (t - 32) / 14 : t < 74 ? 3 + (t - 46) / 28 : 4;
    const sunY = G.setY + G.sunR + G.sunV * (18 - t), up = clamp((sunY - G.setY) / (G.sunR + G.sunV * 18), 0, 1);
    const vis = smooth((sunY - G.setY + G.sunR) / (2 * G.sunR));      // 0 = 整个落到山后
    const sunCol = mix3(hex('#ff5e22'), hex('#ffd9a0'), Math.pow(up, 0.7));
    return {
      t, k, up, vis,
      sun: [G.sunX + 0.0015 * t, sunY], sunCol,
      halo: sunCol.map(c => c * (1.15 * smooth((sunY - G.setY + 3 * G.sunR) / (4 * G.sunR)) + 0.15 * vis)),
      rim: sunCol.map(c => c * vis * 1.2),
      glint: vis,
      star: smooth((k - 2.7) / 1.1), moon: smooth((k - 2.15) / 1.25),
      mist: 0.1 + 0.42 * smooth((k - 1.6) / 2.2),
      expo: [1, 1.04, 1.12, 1.42, 1.9][Math.min(4, Math.floor(k))] * (1 - (k % 1)) + [1, 1.04, 1.12, 1.42, 1.9][Math.min(4, Math.floor(k) + 1)] * (k % 1),
      calm: lerp(0.24, 0.13, smooth((k - 2) / 2)),
      swell: lerp(1, 0.72, smooth((k - 2) / 2)),
    };
  }

  /* ---------- 状态 ---------- */
  const st = { t: 0, started: false, rewind: false, imp: [], drops: [], nextFish: 4, touched: false, last: null, clacked: false, lastSpeed: 0 };
  if (REDUCED) { st.t = 45.5; st.started = true; }

  function setStatus(e) {
    const t = e.t, mins = t < 24 ? 18 * 60 + 31 + t / 24 * 16 : 18 * 60 + 47 + (t - 24) * 0.9;
    const hh = Math.floor(mins / 60), mm = Math.floor(mins % 60), clock = `${hh}:${String(mm).padStart(2, '0')}`;
    let on, txt;
    if (t < 20) { on = 'gold'; txt = `湖边 ${clock} · 离日落还有 ${Math.max(1, 47 - mm)} 分钟`; }
    else if (t < 28) { on = 'set'; txt = `湖边 ${clock} · 太阳落山了`; }
    else if (t < 39) { on = 'glow'; txt = `湖边 ${clock} · 晚霞正浓`; }
    else if (t < T_FLY) { on = 'blue'; txt = t < T_BULB ? `湖边 ${clock} · 蓝调时刻` : `湖边 ${clock} · 蓝调时刻，灯亮了`; }
    else { on = 'night'; txt = `湖边 ${clock} · 入夜，萤火虫出来了`; }
    if (statusText.textContent !== txt) statusText.textContent = txt;
    if (statusEl.dataset.on !== on) statusEl.dataset.on = on;
  }

  /* ---------- 每帧：推进时间、算水波、画 ---------- */
  function frame(s) {
    if (st.started && !REDUCED) {
      if (st.rewind) {
        st.t -= s * 24;
        if (st.t <= 0) { st.t = 0; st.rewind = false; }
      } else st.t += s;
    }
    if (st.t < T_BULB) st.clacked = false;
    else if (!st.clacked && !st.rewind) { st.clacked = true; if (SND.on) clackRow(); }
    // 偶尔有鱼在近处冒头，一圈小涟漪
    if (!REDUCED && simOK) {
      st.nextFish -= s;
      if (st.nextFish <= 0) {
        st.nextFish = 6 + Math.random() * 8;
        const z = 3 + Math.random() * 8, x = (Math.random() * 1.7 - 0.85) * ASP * z / G.F;
        poke(x, z, x, z, 0.05, 0.022);
      }
    }
    // 溅起来的水珠落回水面
    for (const p of st.drops) { p.vy += 900 * s; p.x += p.vx * s; p.y += p.vy * s; }
    st.drops = st.drops.filter(p => {
      if (p.vy < 0 || p.y < p.y0) return true;
      const w = toWorld(p.x, p.y0);
      if (w) poke(w.x, w.z, w.x, w.z, 0.03, 0.012);
      return false;
    });
  }

  function poke(ax, az, bx, bz, r, a) {
    if (!SIM) return;
    st.imp.push([ax, az, bx, bz, r, a]);
  }
  function toWorld(cx, cy) {
    const sx = (cx / W * 2 - 1) * ASP, sy = 1 - cy / H * 2;
    if (sy > G.yH - 0.012) return null;
    const z = G.F / (G.yH - sy);
    return { x: sx * z / G.F, z };
  }

  function stepSim(s) {
    if (!simOK || !SIM) return;
    if (st.imp.length) {
      if (!SIM.on) {   // 停过一阵：先把两张图清空，免得旧的波纹冒出来
        for (const f of SIM.fbos) { gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
        SIM.on = true;
        SIM.acc = 1 / 60;
      }
      SIM.idle = 0;
    }
    if (!SIM.on) return;
    SIM.idle += s;
    if (SIM.idle > 9) { SIM.on = false; return; }
    SIM.acc = Math.min(SIM.acc + s, 4 / 60);
    const P = PR.sim;
    gl.useProgram(P.p);
    gl.viewport(0, 0, SIM.nx, SIM.nz);
    gl.uniform2f(P.u.uN, SIM.nx, SIM.nz);
    gl.uniform1f(P.u.uDamp, 0.9935);
    while (SIM.acc >= 1 / 60) {
      SIM.acc -= 1 / 60;
      const imp = st.imp.splice(0, 8), A = new Float32Array(32), B = new Float32Array(32);
      imp.forEach(([ax, az, bx, bz, r, a], i) => {
        A.set([(ax - SIM.x0) / SIM.cell, (az - SIM.z0) / SIM.cell, (bx - SIM.x0) / SIM.cell, (bz - SIM.z0) / SIM.cell], i * 4);
        B.set([Math.max(1.2, r / SIM.cell), a, 0, 0], i * 4);
      });
      gl.uniform4fv(P.u.uImpA, A);
      gl.uniform4fv(P.u.uImpB, B);
      gl.uniform1i(P.u.uImpN, imp.length);
      bindT('uPrev', SIM.texs[SIM.i]);
      gl.bindFramebuffer(gl.FRAMEBUFFER, SIM.fbos[1 - SIM.i]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      SIM.i = 1 - SIM.i;
    }
    st.imp.length = 0;
    bindT('uPrev', null);
    bindT('uSim', SIM.texs[SIM.i]);
  }

  function setCommon(P, e, now) {
    const u = P.u, f = (k, ...v) => { if (u[k]) gl['uniform' + v.length + 'f'](u[k], ...v); };
    f('uAsp', ASP); f('uF', G.F); f('uYH', G.yH); f('uD1', G.D1); f('uD2', G.D2); f('uT', now);
    f('uWinT', e.t - T_WIN); f('uMist', e.mist); f('uBulbT', e.t - T_BULB);
    f('uSun', ...e.sun); f('uBulbX', G.letters.x0, G.letters.x1); f('uSunR', G.sunR);
    f('uZen', ...ramp('zen', e.k)); f('uHor', ...ramp('hor', e.k)); f('uGlow', ...ramp('glow', e.k).map(c => c * (0.35 + 0.65 * smooth(1.6 - e.k * 0.35))));
    f('uHalo', ...e.halo); f('uCLit', ...ramp('clit', e.k)); f('uCDark', ...ramp('cdark', e.k)); f('uFarAmb', ...ramp('far', e.k));
    f('uWinCol', ...ramp('win', e.k)); f('uMistCol', ...ramp('mist', e.k));
    f('uFRect', G.FR.x0, G.FR.y0, G.FR.x1, G.FR.y1);
    f('uLRect', G.LR.x0, G.LR.y0, G.LR.x1, G.LR.y1);
    f('uBgRect', G.BR.x0, G.BR.y0, G.BR.x1, G.BR.y1);
    f('uEnc', floatRT ? 1 : 0.125); f('uDec', floatRT ? 1 : 8);
  }

  function render(now) {
    const e = env(st.t);
    setStatus(e);
    if (!glOK) return;
    stepSim(st.dt || 0);
    // 1. 天空和对岸
    let P = PR.bg;
    gl.useProgram(P.p);
    setCommon(P, e, now);
    gl.uniform2f(P.u.uRes, BGW, BGH);
    gl.uniform4f(P.u.uView, G.BR.x0, G.BR.y1, G.BR.x1, G.BR.y0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, FBO.bg);
    gl.viewport(0, 0, BGW, BGH);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    bindT('uBg');
    gl.generateMipmap(gl.TEXTURE_2D);
    // 2. 栈道和字
    P = PR.lit;
    gl.useProgram(P.p);
    setCommon(P, e, now);
    gl.uniform2f(P.u.uRes, LET.w, LET.h);
    gl.uniform3f(P.u.uFill, ...ramp('fill', e.k));
    gl.uniform3f(P.u.uRimCol, ...e.rim);
    gl.bindFramebuffer(gl.FRAMEBUFFER, FBO.lit);
    gl.viewport(0, 0, LET.w, LET.h);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    bindT('uLit');
    gl.generateMipmap(gl.TEXTURE_2D);
    // 3. 屏幕：地平线以上画天，以下画水
    const cw = glc.width, ch = glc.height, split = clamp(Math.ceil((G.yH + 1) / 2 * ch - 0.5), 0, ch);
    gl.viewport(0, 0, cw, ch);
    gl.enable(gl.SCISSOR_TEST);
    for (const [name, y0, y1] of [['water', 0, split], ['sky', split, ch]]) {
      if (y1 <= y0) continue;
      P = PR[name];
      gl.useProgram(P.p);
      setCommon(P, e, now);
      const u = P.u, f = (k, ...v) => { if (u[k]) gl['uniform' + v.length + 'f'](u[k], ...v); };
      f('uRes', cw, ch); f('uView', -ASP, -1, ASP, 1);
      f('uExpo', e.expo); f('uBulbGlow', 1);
      f('uMoon', ...G.moon); f('uMoonR', G.moonR); f('uMoonV', e.moon);
      f('uSunCol', ...e.sunCol);
      if (name === 'sky') { f('uStar', e.star); f('uSunDisk', lerp(2.4, 13, Math.pow(e.up, 1.4))); }
      else {
        f('uSimRect', SIM ? SIM.x0 : 0, SIM ? SIM.z0 : 0, SIM ? SIM.x1 : 1, SIM ? SIM.z1 : 1);
        f('uSimN', SIM ? SIM.nx : 1, SIM ? SIM.nz : 1);
        f('uSimOn', SIM && SIM.on ? 1 : 0);
        f('uWindDir', 0.33, -0.94);
        f('uCalm', e.calm); f('uSwell', e.swell); f('uGlintI', 0.04 * e.glint);
        f('uBody', ...ramp('body', e.k));
      }
      gl.scissor(0, y0, cw, y1 - y0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    gl.disable(gl.SCISSOR_TEST);
  }

  /* ---------- 叠加层：小船、芦苇、萤火虫、飞鸟、溅起的水珠 ---------- */
  let REEDS = [], FLIES = [], BOAT_C = null;
  function buildProps() {
    const r = rng(5);
    REEDS = [];
    const clusters = mobile ? [[-0.985, 9, 0.62], [0.985, 7, 0.5]] : [[-0.975, 12, 1.32], [0.985, 8, 0.86]];
    for (const [cx, n, hmax] of clusters) for (let i = 0; i < n; i++) {
      const z = (mobile ? 1.9 : 2.1) + r() * 1.4, sx = (cx + (r() - 0.5) * 0.1 * (mobile ? 1.6 : 1)) * ASP;
      const kind = r() < 0.32 ? 'cat' : r() < 0.6 ? 'blade' : 'stem';
      REEDS.push({ x: sx * z / G.F, z, h: hmax * (0.45 + 0.55 * r()) * (kind === 'blade' ? 0.75 : 1), lean: (r() - 0.5) * 0.3 - cx * 0.06, ph: r() * 6.28, kind, w: 0.011 + r() * 0.007 });
    }
    REEDS.sort((a, b) => b.z - a.z);
    FLIES = [];
    const nf = mobile ? 9 : 16;
    for (let i = 0; i < nf; i++) {
      const side = i % 3 === 0 ? (r() - 0.5) * 1.5 : i % 3 === 1 ? -0.9 : 0.9, z = 2.6 + r() * 5;
      FLIES.push({ hx: side * ASP * z / G.F, hy: 0.25 + r() * 1.1, hz: z, a: r() * 6.28, b: r() * 6.28, per: 2.4 + r() * 2.8, ph: r(), on: T_FLY + r() * 14 });
    }
  }

  function drawOverlay(now, e) {
    const o = octx;
    o.setTransform(DPR, 0, 0, DPR, 0, 0);
    o.clearRect(0, 0, W, H);
    const T = REDUCED ? 3 : now;
    // 环境里的“剪影色”：天越黑越黑
    const night = smooth((e.k - 2.4) / 1.6);
    drawBirds(o, e, T);
    drawBoat(o, e, T, night);
    for (const rd of REEDS) drawReed(o, rd, T, e, night);
    drawFlies(o, e, T);
    o.fillStyle = `rgba(255,236,220,${0.85 - night * 0.45})`;
    for (const p of st.drops) { o.beginPath(); o.arc(p.x, p.y, 1.3, 0, 7); o.fill(); }
    if (!st.touched && st.started) {
      o.font = '12px "DM Sans", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
      o.fillStyle = 'rgba(239,232,225,.42)';
      o.textBaseline = 'bottom';
      o.fillText(mobile ? '手指在水面上横着划一划' : '在水面上划一划，点一下扔颗石子', 16, H - 12);
    }
  }

  // 船：本地坐标，船头朝右，y 向上，单位是世界单位
  function hull(o) {
    o.beginPath();
    o.moveTo(-2.15, 0.5);
    o.quadraticCurveTo(0, 0.32, 2.35, 0.8);
    o.lineTo(2.06, 0.02);
    o.quadraticCurveTo(0, -0.12, -1.98, 0);
    o.closePath();
  }
  function boatShape(o, withLamp) {
    hull(o);
    o.fill();
    o.fillRect(-1.78, 0.42, 0.07, 1.95);           // 挂灯的杆
    o.fillRect(-1.78, 2.3, 0.42, 0.05);
    if (withLamp) { o.fillRect(-1.47, 2.0, 0.03, 0.3); o.fillRect(-1.55, 1.74, 0.2, 0.28); }
  }
  function drawBoat(o, e, T, night) {
    const B = G.boat, k = ppw(B.z) * B.s, bob = Math.sin(T * 1.25) * 0.035, roll = Math.sin(T * 0.83 + 1) * 0.018;
    const x = B.sx * B.z / G.F, [sx, sy] = proj(x, bob, B.z), px = SX(sx), py = SY(sy);
    const sil = `rgb(${Math.round(lerp(22, 7, night))},${Math.round(lerp(15, 8, night))},${Math.round(lerp(22, 14, night))})`;
    const lamp = clamp((e.t - T_BOAT) / 1.2, 0, 1) * (0.9 + 0.1 * Math.sin(T * 7.1) * Math.sin(T * 3.3));
    // 系船的桩子
    const [qx, qy] = proj(x + 3.3 * B.s, 0, B.z + 0.4), pk = ppw(B.z + 0.4) * B.s, postX = SX(qx), postY = SY(qy);

  function drawFlies(o, e, T) {

    if (!SND.on || !SND.ac || SND.ac.state !== 'running') return;
    const now = SND.ac.currentTime;
    SND.eng.sched(Math.max(SND.until, now), now + 0.3, smooth((e.k - 2.3) / 1.2));
    SND.until = now + 0.3;
    SND.eng.night(smooth((e.k - 2.3) / 1.2), now);
    SND.eng.swish(Math.min(0.14, st.lastSpeed * 0.0001), now);
    st.lastSpeed *= 0.8;
  }
  function clackRow() {
    const n = Math.min(6, Math.max(1, [...brand].length)), t0 = SND.ac.currentTime + 0.02;
    for (let i = 0; i < n; i++) SND.eng.clack(t0 + i / n * 1.8 + Math.random() * 0.05);
  }

  /* ---------- 交互：划水、扔石子 ---------- */
  scene.addEventListener('pointermove', e => {
    const r = scene.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (e.pointerType === 'touch' && !e.buttons) { st.last = null; return; }
    const w = toWorld(x, y);
    if (w && st.last) {
      const d = Math.hypot(x - st.last.x, y - st.last.y);
      if (d > 0.5) {
        // 沿路径点几下，而不是拖一整条：一个个小圈互相叠，才像手指划过水的那串细纹
        const n = Math.min(4, Math.ceil(d / 16)), a = clamp(d * 0.00032, 0.0012, 0.0075), wl = st.last.w;
        for (let k = 1; k <= n; k++) { const f = k / n, px = lerp(wl.x, w.x, f), pz = lerp(wl.z, w.z, f); poke(px, pz, px, pz, 0.035, a); }
        st.lastSpeed = Math.max(st.lastSpeed, d / Math.max(1, e.timeStamp - st.last.t) * 1000);
        st.touched = true;
      }
    }
    st.last = w ? { x, y, w, t: e.timeStamp } : null;
  });
  scene.addEventListener('pointerleave', () => { st.last = null; });
  scene.addEventListener('pointerup', e => { if (e.pointerType === 'touch') st.last = null; });
  scene.addEventListener('click', e => {
    const r = scene.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, w = toWorld(x, y);
    if (!w) return;
    st.touched = true;
    poke(w.x, w.z, w.x, w.z, 0.08, 0.1);
    const k = ppw(w.z) / ppw(4);
    for (let i = 0; i < 14; i++) st.drops.push({ x, y, vx: (Math.random() - 0.5) * 110 * k, vy: -(140 + Math.random() * 190) * k, y0: y + (Math.random() - 0.5) * 6 * k });
    if (SND.on) SND.eng.plunk(SND.ac.currentTime + 0.01);
  });
  $('#replay').addEventListener('click', () => { st.started = true; if (st.t > 0) st.rewind = true; });

  // 没有 WebGL2：画一张安静的蓝调时刻，字是暖色的灯
  function fallback() {
    const o = glc.getContext('2d');
    if (!o) return;
    o.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = o.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#141a3c');
    g.addColorStop(SY(G.yH) / H, '#7a5a86');
    g.addColorStop(SY(G.yH) / H + 0.001, '#1a1830');
    g.addColorStop(1, '#07080f');
    o.fillStyle = g;
    o.fillRect(0, 0, W, H);
    o.font = signFont(H * 0.24);
    o.textAlign = 'center';
    o.fillStyle = 'rgba(255,214,150,.9)';
    o.fillText(brand, SX((G.TB.x0 + G.TB.x1) / 2), SY(G.deck) - 4);
    o.globalAlpha = 0.3;
    o.scale(1, -1);
    o.fillText(brand, SX((G.TB.x0 + G.TB.x1) / 2), -SY(G.yw1) * 2 + SY(G.deck) - 4);
  }

  function build() {
    layout();
    buildFar();
    buildLetters();
    buildProps();
    // 太阳从哪条线落下去：电脑上是右边的山；手机上字铺满一行，先被字挡住
    const ridge = G.ridgeAt(G.sunX);
    G.setY = mobile ? Math.max(ridge, G.letters.top) : ridge;
    G.sunV = 2 * G.sunR / (mobile ? 9 : 6);   // 几秒落下一个太阳的直径：手机上起点不能太高，落得慢一点
    if (glOK) uploadAll();
    else fallback();
    ready = true;
  }

  let visible = false, ready = false, last = performance.now();
  new IntersectionObserver(es => es.forEach(e => {
    visible = e.isIntersecting;
    // 页脚滚出去了，声音也跟着淡掉；滚回来再淡进来
    if (SND.on && SND.ac) SND.master.gain.setTargetAtTime(visible && !document.hidden ? 1 : 0, SND.ac.currentTime, 0.4);
  })).observe(scene);
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(now - last, 50) / 1000;
    last = now;
    if (!visible || !ready) return;
    const r = scene.getBoundingClientRect();
    if (!st.started && (r.top < innerHeight * 0.72 || r.bottom <= innerHeight + 4)) st.started = true;
    frame(dt);
    st.dt = dt;
    const T = REDUCED ? 7.3 : now / 1000;
    let e;
    try { render(T); } catch (err) { console.error(err); }
    e = env(st.t);
    drawOverlay(T, e);
    soundTick(e);
  }
  document.addEventListener('visibilitychange', () => {
    if (!SND.ac || !SND.on) return;
    SND.master.gain.setTargetAtTime(document.hidden || !visible ? 0 : 1, SND.ac.currentTime, 0.3);
  });

  const fontsReady = () => Promise.all([
    isCJK(brand) ? document.fonts.load('900 100px "Noto Serif SC"', brand) : document.fonts.load('400 100px "Alfa Slab One"', brand),
  ]).catch(() => {});
  function rebuildLetters() {
    buildLetters();
    G.setY = mobile ? Math.max(G.ridgeAt(G.sunX), G.letters.top) : G.ridgeAt(G.sunX);
    if (glOK) uploadLetters(); else fallback();
  }
  try { glOK = initGL(); } catch (err) { console.error(err); glOK = false; }
  // 先用手头有的字体画出来，网页字体到了再把字重做一遍：网慢的时候画面不会一直黑着
  const hadFont = document.fonts.check(signFont(100), brand);
  build();
  requestAnimationFrame(loop);
  if (!hadFont) fontsReady().then(rebuildLetters);
  let tmr, lastW = innerWidth;
  addEventListener('resize', () => {
    if (innerWidth === lastW) return;
    lastW = innerWidth;
    clearTimeout(tmr);
    tmr = setTimeout(build, 250);
  });
</script>
</body>
</html>
